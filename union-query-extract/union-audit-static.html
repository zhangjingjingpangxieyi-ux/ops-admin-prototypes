<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>审核列表 - 静态原型</title>
  <style>
    :root{--primary:#1890ff;--primary-hover:#40a9ff;--text:#262626;--muted:#8c8c8c;--line:#f0f0f0;--border:#d9d9d9;--head:#fafafa;--bg:#f0f2f5;--success:#52c41a;--warning:#faad14;--danger:#ff4d4f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5715 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}.page{min-width:1180px;min-height:100vh}.page-title{display:none}.filters{display:flex;align-items:center;gap:16px;row-gap:10px;flex-wrap:wrap;min-height:108px;padding:12px 20px;background:#fff}.field{display:flex;align-items:center;gap:8px;min-width:0}.field label{white-space:nowrap;color:#262626}.control{height:32px;min-width:170px;border:1px solid var(--border);border-radius:2px;background:#fff;padding:4px 11px;color:#262626;outline:none}.control:hover,.control:focus{border-color:var(--primary-hover)}.control.server{min-width:260px}.btn{height:32px;padding:4px 15px;border:1px solid var(--border);border-radius:2px;background:#fff;color:#262626;white-space:nowrap}.btn:hover{color:var(--primary);border-color:var(--primary-hover)}.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover);color:#fff}.btn-danger{color:var(--danger);border-color:#ffccc7}.btn-link{border:0;background:transparent;color:var(--primary);padding:0;height:auto}.btn-link.danger{color:var(--danger)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;background:#fff}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}.hint{color:var(--muted);font-size:13px}.icon-btn{width:32px;padding:0;text-align:center;font-size:16px}.table-wrap{overflow:auto;background:#fff;padding:0 12px}table{width:100%;min-width:1840px;border-collapse:collapse;table-layout:fixed}th{background:var(--head);font-weight:500;text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}tbody tr:hover td{background:#fafafa}.tag{display:inline-block;border-radius:2px;padding:0 7px;line-height:22px;border:1px solid transparent;white-space:nowrap}.tag-pending{color:#d48806;background:#fffbe6;border-color:#ffe58f}.tag-done{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}.tag-muted{color:#595959;background:#fafafa;border-color:#d9d9d9}.tag-blue{color:#096dd9;background:#e6f7ff;border-color:#91d5ff}.tag-red{color:#cf1322;background:#fff1f0;border-color:#ffa39e}.tag-purple{color:#531dab;background:#f9f0ff;border-color:#d3adf7}.subtext{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}.ops{white-space:nowrap}.ops button+button{margin-left:1em}.audit-meta{line-height:1.7;white-space:nowrap}.pagination{height:56px;display:flex;justify-content:flex-end;align-items:center;gap:8px;color:#595959;background:#fff;padding:0 12px}.page-btn{min-width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:2px}.page-btn.active{border-color:var(--primary);color:var(--primary)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;width:min(860px,86vw);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-6px 0 16px rgba(0,0,0,.08)}.drawer-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}.close{width:32px;height:32px;border:0;background:transparent;font-size:22px;color:#8c8c8c}.drawer-body{padding:20px 24px;overflow:auto;flex:1}.drawer-foot{height:64px;border-top:1px solid var(--line);padding:16px 24px;display:flex;justify-content:flex-end;gap:8px}.section-title{font-weight:600;margin:0 0 12px;padding-left:9px;border-left:3px solid var(--primary)}.desc{display:grid;grid-template-columns:130px 1fr 130px 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:24px}.desc dt,.desc dd{margin:0;padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.desc dt{background:#fafafa;color:#595959}.desc dd{background:#fff}.detail-block{background:#fafafa;border:1px solid var(--line);padding:12px 16px;margin-bottom:20px;line-height:1.8}.toast{position:fixed;left:50%;top:28px;transform:translateX(-50%);padding:8px 14px;background:#fff;border-radius:2px;box-shadow:0 3px 12px rgba(0,0,0,.18);z-index:80;display:none}.toast.show{display:block}.toast:before{content:"✓";color:var(--success);margin-right:8px}
  </style>
</head>
<body>
  <main class="page">
    <h1 class="page-title">审核列表</h1>
    <section class="filters">
      <div class="field"><label>区服</label><select class="control server"><option>不限</option><option>1145海外-杨智圆主干(1145)</option><option>位面2海外-杨智圆主干(10006)</option></select></div>
      <div class="field"><label>来源类型</label><select class="control"><option>全部</option><option>人工申请</option><option>监控规则</option></select></div>
      <div class="field"><label>来源单号</label><input class="control" placeholder="请输入来源单号"></div>
      <div class="field"><label>规则名称</label><input class="control" placeholder="请输入规则名称"></div>
      <div class="field"><label>确认人</label><input class="control" placeholder="请输入确认人"></div>
      <div class="field"><label>联盟ID</label><input class="control" placeholder="请输入联盟ID"></div>
      <div class="field"><label>角色ID</label><input class="control" placeholder="请输入角色ID"></div>
      <div class="field"><label>审核状态</label><select class="control"><option>不限</option><option>待审核</option><option>已通过</option><option>已驳回</option></select></div>
      <div class="field"><label>操作类型</label><select class="control"><option>不限</option><option>解散</option><option>联盟改名</option><option>宣言修改</option><option>联盟踢人</option><option>变更阶级/职位</option><option>联盟变更</option></select></div>
      <button class="btn btn-primary" id="query-audit">查 询</button>
    </section>
    <div class="toolbar">
      <div class="toolbar-left"><button class="btn" id="batch-audit">批量审核</button><span class="hint">人工申请和监控规则生成的联盟操作审核记录统一在此处理</span></div>
      <div class="toolbar-right"><button class="btn icon-btn" title="导出当前列表">⇩</button><button class="btn icon-btn" title="调整表格密度">↕</button><button class="btn icon-btn" title="列设置">⚙</button></div>
    </div>
    <div class="table-wrap">
      <table id="audit-table">
        <thead><tr><th style="width:46px"><input type="checkbox" id="check-all"></th><th style="width:100px">审核状态</th><th style="width:110px">来源类型</th><th style="width:140px">来源单号</th><th style="width:180px">规则名称</th><th style="width:130px">操作类型</th><th style="width:100px">对象维度</th><th style="width:120px">联盟ID</th><th style="width:140px">联盟名称</th><th style="width:120px">角色ID</th><th style="width:240px">操作详情</th><th style="width:190px">申请/确认信息</th><th style="width:170px">审核信息</th><th style="width:130px">操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination"><span>共 126 条</span><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">4</button><button class="page-btn">5</button><span>...</span><button class="page-btn">13</button><select class="control" style="min-width:110px"><option>10 条/页</option><option>20 条/页</option></select></div>
  </main>
  <div class="overlay" id="detail-overlay"><aside class="drawer"><header class="drawer-head"><span id="drawer-title">审核详情</span><button class="close" data-close="detail-overlay" aria-label="关闭">×</button></header><div class="drawer-body" id="detail-body"></div><footer class="drawer-foot"><button class="btn" data-close="detail-overlay">关闭</button><button class="btn btn-primary" id="drawer-primary">通过</button><button class="btn btn-danger" id="drawer-reject">驳回</button></footer></aside></div>
  <div class="toast" id="toast">操作成功</div>
  <script>
    const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
    const audits=[
      {status:'已通过',sourceType:'人工申请',sourceNo:'-',ruleName:'-',objectType:'联盟',type:'宣言修改',unionId:'11450008',unionName:'东莞大范',server:'1145海外-杨智圆主干(1145)',openAt:'-',roleId:'-',detail:'联盟宣言：- → 那咱们',applicant:'杨智圆',applyAt:'2026-07-02 20:23:39',auditor:'杨智圆',auditAt:'2026-07-02 20:27:25',remark:'ok'},
      {status:'已通过',sourceType:'人工申请',sourceNo:'-',ruleName:'-',objectType:'联盟',type:'联盟改名',unionId:'11450008',unionName:'东莞大范',server:'1145海外-杨智圆主干(1145)',openAt:'-',roleId:'-',detail:'联盟名称：东莞大范 → 帅人联盟哦',applicant:'杨智圆',applyAt:'2026-07-02 20:23:34',auditor:'杨智圆',auditAt:'2026-07-02 20:27:08',remark:'ok'},
      {status:'待审核',sourceType:'人工申请',sourceNo:'-',ruleName:'-',objectType:'联盟',type:'宣言修改',unionId:'100060006',unionName:'看看吧',server:'位面2海外-杨智圆主干(10006)',openAt:'-',roleId:'-',detail:'联盟宣言：这个宣言好不好啊 → 去tm的啊啊啊',applicant:'杨智圆',applyAt:'2026-07-02 10:18:56',auditor:'-',auditAt:'-',remark:'-'},
      {status:'已驳回',sourceType:'人工申请',sourceNo:'-',ruleName:'-',objectType:'联盟',type:'联盟改名',unionId:'100060206',unionName:'旧日之城',server:'位面2海外-杨智圆主干(10006)',openAt:'-',roleId:'-',detail:'联盟名称：旧日之城 → 测试敏感名称',applicant:'刘七',applyAt:'2026-07-03 14:20:08',auditor:'运营主管',auditAt:'2026-07-03 14:32:41',remark:'名称不符合规范'},
      {status:'待审核',sourceType:'监控规则',sourceNo:'B20260811001',ruleName:'联盟满人但活跃玩家少',objectType:'成员',type:'联盟踢人',unionId:'100060006',unionName:'看看吧',server:'位面2海外-杨智圆主干(10006)',openAt:'2026-07-01 10:00:00',roleId:'614125',detail:'将成员 614125 踢出联盟',confirmedBy:'张三',confirmedAt:'2026-08-11 10:08:12',hitTime:'2026-08-11 10:00:03',hitCondition:'联盟人数=100 且 活跃人数≤40',preCheckResult:'通过',auditor:'-',auditAt:'-',remark:'监控确认生成'},
      {status:'待审核',sourceType:'监控规则',sourceNo:'B20260811004',ruleName:'零散联盟解散',objectType:'联盟',type:'解散',unionId:'100060188',unionName:'落日余晖',server:'位面2海外-杨智圆主干(10006)',openAt:'2026-07-01 10:00:00',roleId:'-',detail:'解散联盟 100060188 / 落日余晖',confirmedBy:'李四',confirmedAt:'2026-08-11 10:21:34',hitTime:'2026-08-11 10:20:01',hitCondition:'活跃人数>0 且 活跃人数≤5',preCheckResult:'通过',auditor:'-',auditAt:'-',remark:'监控确认生成'},
      {status:'待审核',sourceType:'监控规则',sourceNo:'B20260811003',ruleName:'没有R4的联盟',objectType:'成员',type:'变更阶级/职位',unionId:'100060388',unionName:'晚风',server:'位面2海外-杨智圆主干(10006)',openAt:'2026-07-01 10:00:00',roleId:'616708',detail:'将成员 616708 从 R3 调整为 R4',confirmedBy:'王五',confirmedAt:'2026-08-11 09:36:28',hitTime:'2026-08-11 09:30:16',hitCondition:'指定阶级/职位人数=0',preCheckResult:'通过',fromPosition:'R3',toPosition:'R4',auditor:'-',auditAt:'-',remark:'监控确认生成'},
      {status:'已通过',sourceType:'监控规则',sourceNo:'B20260811005',ruleName:'跨盟活跃成员迁移',objectType:'成员',type:'联盟变更',unionId:'100060211',unionName:'星海',server:'位面2海外-杨智圆主干(10006)',openAt:'2026-07-01 10:00:00',roleId:'612901',detail:'将成员 612901 从星海迁移至晨星',confirmedBy:'赵六',confirmedAt:'2026-08-11 11:03:18',hitTime:'2026-08-11 11:00:02',hitCondition:'目标联盟活跃人数不足 且 成员战力排名靠前',preCheckResult:'通过',targetUnionId:'100060128',targetUnionName:'晨星',auditor:'运营主管',auditAt:'2026-08-11 11:12:40',remark:'同意'}
    ];
    function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
    function tag(status){if(status==='待审核')return 'tag-pending';if(status==='已通过')return 'tag-done';if(status==='已驳回')return 'tag-red';return 'tag-muted';}
    function sourceTag(sourceType){return sourceType==='监控规则'?'tag-purple':'tag-muted';}
    function applyOrConfirmInfo(a){return a.sourceType==='监控规则'?`确认人：${esc(a.confirmedBy)}<br>确认时间：${esc(a.confirmedAt)}`:`申请人：${esc(a.applicant)}<br>申请时间：${esc(a.applyAt)}`;}
    function auditInfo(a){return a.auditor==='-'?'-':`审核人：${esc(a.auditor)}<br>审核时间：${esc(a.auditAt)}`;}
    function render(){ $('#audit-table tbody').innerHTML=audits.map((a,i)=>`<tr data-index="${i}"><td><input type="checkbox" class="row-check" ${a.status==='待审核'?'':'disabled'}></td><td><span class="tag ${tag(a.status)}">${esc(a.status)}</span></td><td><span class="tag ${sourceTag(a.sourceType)}">${esc(a.sourceType)}</span></td><td>${esc(a.sourceNo)}</td><td>${esc(a.ruleName)}</td><td><span class="tag tag-blue">${esc(a.type)}</span></td><td>${esc(a.objectType)}</td><td>${esc(a.unionId)}</td><td>${esc(a.unionName)}</td><td>${esc(a.roleId)}</td><td>${esc(a.detail)}</td><td class="audit-meta">${applyOrConfirmInfo(a)}</td><td class="audit-meta">${auditInfo(a)}</td><td class="ops"><button class="btn-link detail" data-index="${i}">${a.status==='待审核'?'审核':'查看'}</button>${a.status==='待审核'?'<button class="btn-link danger reject" data-index="'+i+'">驳回</button>':''}</td></tr>`).join('');}
    function desc(items){return items.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('');}
    function sourceInfo(a){if(a.sourceType!=='监控规则')return '';return `<h3 class="section-title">来源信息</h3><dl class="desc">${desc([['来源类型',esc(a.sourceType)],['监控批次ID',esc(a.sourceNo)],['规则名称',esc(a.ruleName)],['命中时间',esc(a.hitTime)],['命中条件',esc(a.hitCondition)],['执行前校验结果',esc(a.preCheckResult)],['确认人',esc(a.confirmedBy)],['确认时间',esc(a.confirmedAt)]])}</dl>`;}
    function specialFields(a){if(a.type==='联盟变更')return [['原联盟ID/名称',esc(a.unionId)+' / '+esc(a.unionName)],['目标联盟ID/名称',esc(a.targetUnionId)+' / '+esc(a.targetUnionName)]];if(a.type==='变更阶级/职位')return [['原职位',esc(a.fromPosition)],['目标职位',esc(a.toPosition)]];return [];}
    function openDetail(i){const a=audits[i];const basic=[['操作类型',esc(a.type)],['对象维度',esc(a.objectType)],['联盟ID',esc(a.unionId)],['联盟名称',esc(a.unionName)],['区服',esc(a.server)],['开服时间',esc(a.openAt||'-')],['角色ID',esc(a.roleId)],['审核状态','<span class="tag '+tag(a.status)+'">'+esc(a.status)+'</span>'],...specialFields(a),['操作详情',esc(a.detail)]];if(a.sourceType==='人工申请'){basic.push(['申请人',esc(a.applicant)],['申请时间',esc(a.applyAt)]);}$('#drawer-title').textContent=a.status==='待审核'?'审核处理':'审核详情';$('#detail-body').innerHTML=`<h3 class="section-title">基础信息</h3><dl class="desc">${desc(basic)}</dl>${sourceInfo(a)}<h3 class="section-title">审核信息</h3><dl class="desc">${desc([['审核人',esc(a.auditor)],['审核结果','<span class="tag '+tag(a.status)+'">'+esc(a.status)+'</span>'],['审核时间',esc(a.auditAt)],['审核备注',esc(a.remark)]])}</dl>`;$('#drawer-primary').style.display=a.status==='待审核'?'inline-block':'none';$('#drawer-reject').style.display=a.status==='待审核'?'inline-block':'none';$('#detail-overlay').classList.add('open');}
    function close(id){$('#'+id).classList.remove('open')}function toast(m){const n=$('#toast');n.textContent=m;n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),2200)}
    document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c){close(c.dataset.close);return;}const d=e.target.closest('.detail');if(d){openDetail(Number(d.dataset.index));return;}const r=e.target.closest('.reject');if(r){toast('已驳回该审核记录');return;}});$$('.overlay').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)close(x.id)}));$('#query-audit').addEventListener('click',()=>toast('已按查询条件刷新审核列表'));$('#batch-audit').addEventListener('click',()=>toast($$('.row-check:checked').length?'已进入批量审核':'请选择待审核记录'));$('#check-all').addEventListener('change',e=>$$('.row-check:not(:disabled)').forEach(x=>x.checked=e.target.checked));$('#drawer-primary').addEventListener('click',()=>{close('detail-overlay');toast('已通过审核')});$('#drawer-reject').addEventListener('click',()=>{close('detail-overlay');toast('已驳回审核')});render();
  </script>
</body>
</html>
