ng:13px 10px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}tbody tr:hover td{background:#fafafa}.tag{display:inline-block;border-radius:2px;padding:0 7px;line-height:22px;border:1px solid transparent;white-space:nowrap}.tag-pending{color:#d48806;background:#fffbe6;border-color:#ffe58f}.tag-done{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}.tag-muted{color:#595959;background:#fafafa;border-color:#d9d9d9}.tag-blue{color:#096dd9;background:#e6f7ff;border-color:#91d5ff}.tag-red{color:#cf1322;background:#fff1f0;border-color:#ffa39e}.tag-purple{color:#531dab;background:#f9f0ff;border-color:#d3adf7}.tag-green{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}.subtext{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}.ops{white-space:nowrap}.ops button+button{margin-left:1em}.audit-meta{line-height:1.7;white-space:nowrap}.disabled-row{color:#8c8c8c}.pagination{height:56px;display:flex;justify-content:flex-end;align-items:center;gap:8px;color:#595959;background:#fff;padding:0 12px}.page-btn{min-width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:2px}.page-btn.active{border-color:var(--primary);color:var(--primary)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;width:min(960px,88vw);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-6px 0 16px rgba(0,0,0,.08)}.drawer-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}.close{width:32px;height:32px;border:0;background:transparent;font-size:22px;color:#8c8c8c}.drawer-body{padding:20px 24px;overflow:auto;flex:1}.drawer-foot{height:64px;border-top:1px solid var(--line);padding:16px 24px;display:flex;justify-content:flex-end;gap:8px}.section-title{font-weight:600;margin:0 0 12px;padding-left:9px </head>
<body>
  <main class="page">
    <h1 class="page-title">审核列表</h1>
    <section class="filters">
      <div class="field"><label>区服</label><select class="control server" id="filter-server"><option>不限</option><option>1145海外-杨智圆主干(1145)</option><option>位面2海外-杨智圆主干(10006)</option></select></div>
      <div class="field"><label>来源类型</label><select class="control" id="filter-source"><option>全部</option><option>人工申请</option><option>监控规则</option></select></div>
      <div class="field"><label>来源单号</label><input class="control" id="filter-source-no" placeholder="请输入来源单号"></div>
      <div class="field"><label>规则名称</label><input class="control" id="filter-rule" placeholder="请输入规则名称"></div>
      <div class="field"><label>发起/生成方式</label><select class="control" id="filter-origin"><option>全部</option><option>系统自动生成</option><option>杨智圆</option><option>刘七</option></select></div>
      <div class="field"><label>联盟ID</label><input class="control" id="filter-union" placeholder="请输入联盟ID"></div>
      <div class="field"><label>角色ID</label><input class="control" id="filter-role" placeholder="请输入角色ID"></div>
      <div class="field"><label>审核状态</label><select class="control" id="filter-status"><option>不限</option><option>待审核</option><option>已通过</option><option>已拒绝</option></select></div>
      <div class="field"><label>操作类型</label><select class="control" id="filter-action"><option>不限</option><option>宣言修改</option><option>联盟改名</option><option>联盟踢人</option><option>联盟解散</option><option>变更阶级/职位</option><option>联盟变更</option><option>VIP补偿</option><option>客服跟进</option></select></div>
      <button class="btn btn-primary" id="query-audit">查 询</button><button class="btn" id="reset-audit">重 置</button>
    </section>
    <div class="toolbar">
      <div class="toolbar-left"><button class="btn" id="batch-audit">批量审核</button><span class="hint">人工申请和监控规则自动生成的审核记录统一在此处理；监控规则来源按操作对象逐条审核</span></div>
      <div class="toolbar-right"><button class="btn icon-btn" title="导出当前列表">⇩</button><button class="btn icon-btn" title="调整表格密度">↕</button><button class="btn icon-btn" title="列设置">⚙</button></div>
    </div>
    <div class="table-wrap">
      <table id="audit-table">
        <thead><tr><th style="width:46px"><input type="checkbox" id="check-all"></th><th style="width:100px">审核状态</th><th style="width:110px">来源类型</th><th style="width:150px">来源单号</th><th style="width:180px">规则名称</th><th style="width:130px">操作类型</th><th style="width:90px">对象维度</th><th style="width:120px">联盟ID</th><th style="width:140px">联盟名称</th><th style="width:120px">角色ID</th><th style="width:260px">操作详情</th><th style="width:210px">来源生成信息</th><th style="width:170px">审核信息</th><th style="width:130px">操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
  <div class="overlay" id="detail-overlay"><aside class="drawer"><header class="drawer-head"><span id="drawer-title">审核详情</span><button class="close" data-close="detail-overlay" aria-label="关闭">×</button></header><div class="drawer-body" id="detail-body"></div><footer class="drawer-foot"><button class="btn" data-close="detail-overlay">关闭</button><button class="btn btn-primary" id="drawer-primary">通过</button><button class="btn btn-danger" id="drawer-reject">拒绝</button></footer></aside></div>
  <div class="overlay" id="batch-overlay"><div class="modal"><div class="modal-body"><div class="modal-title">批量审核</div><div class="modal-copy" id="batch-copy">已选择 0 条待审核记录</div><textarea class="control" id="batch-remark" placeholder="请输入统一审核备注"></textarea></div><div class="modal-foot"><button class="btn" data-close="batch-overlay">取消</button><button class="btn btn-primary" id="batch-pass">批量通过</button><button class="btn btn-danger" id="batch-reject">批量拒绝</button></div></div></div>
  <div class="toast" id="toast">操作成功</div>

      {id:'A2026081100102',status:'待审核',sourceType:'监控规则',sourceNo:'B20260811001',ruleName:'联盟满人但活跃玩家少',objectType:'成员',type:'联盟踢人',unionId:'100060006',unionName:'看看吧',server:'位面2海外-杨智圆主干(10006)',openAt:'2026-07-01 10:00:00',roleId:'614083',memberId:'614083',detail:'将成员 614083 踢出联盟',hitTime:'2026-08-11 10:00:03',hitCondition:'联盟人数=100 且 活跃人数≤40；成员离线时长≥10小时',hitReason:'离线15小时，战力排名靠后',generationMode:'系统自动生成',generatedAt:'2026-08-11 10:00:12',generationResult:'已生成',auditor:'-',auditAt:'-',remark:'-'},
      {id:'A2026081100401',status:'待审核',sourceType:'监控规则',sourceNo:'B20260811004',ruleName:'零散联盟解散',objectType:'联盟',type:'联盟解散',unionId:'100060188',unionName:'落日余晖',server:'位面2海外-杨智圆主干(10006)',openAt:'2026-07-01 10:00:00',roleId:'-',activeMembers:'3',detail:'解散联盟 100060188 / 落日余晖',hitTime:'2026-08-11 10:20:01',hitCondition:'活跃人数>0 且 活跃人数≤5',hitReason:'活跃成员仅3人',generationMode:'系统自动生成',generatedAt:'2026-08-11 10:20:09',generationResult:'已生成',auditor:'-',auditAt:'-',remark:'-'},
      {id:'A2026081100301',status:'待审核',sourceType:'监控规则',sourceNo:'B20260811003',ruleName:'没有R4的联盟',objectType:'成员',type:'变更阶级/职位',unionId:'100060388',unionName:'晚风',server:'位面2海外-杨智圆主干(10006)',openAt:'2026-07-01 10:00:00',roleId:'616708',detail:'将成员 616708 从 R3 调整为 R4 / 军师',hitTime:'2026-08-11 09:30:16',hitCondition:'指定阶级/职位人数=0',hitReason:'联盟无R4，按战力推荐上任',fromPosition:'R3 / 无官职',toPosition:'R4 / 军师',generationMode:'系统自动生成',generatedAt:'2026-08-11 09:30:25',generationResult:'已生成',auditor:'-',auditAt:'-',remark:'-'},

    let currentIndex=-1;
    function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
    function tag(status){if(status==='待审核')return 'tag-pending';if(status==='已通过')return 'tag-done';if(status==='已拒绝')return 'tag-red';return 'tag-muted';}
    function sourceTag(sourceType){return sourceType==='监控规则'?'tag-purple':'tag-muted';}
    function sourceInfoCell(a){return a.sourceType==='监控规则'?`生成方式：${esc(a.generationMode)}<br>生成时间：${esc(a.generatedAt)}`:`申请人：${esc(a.applicant)}<br>申请时间：${esc(a.applyAt)}`;}
    function auditInfo(a){return a.auditor==='-'?'-':`审核人：${esc(a.auditor)}<br>审核时间：${esc(a.auditAt)}`;}
    function getFilters(){return {server:$('#filter-server').value,source:$('#filter-source').value,sourceNo:$('#filter-source-no').value.trim(),rule:$('#filter-rule').value.trim(),origin:$('#filter-origin').value,unionId:$('#filter-union').value.trim(),roleId:$('#filter-role').value.trim(),status:$('#filter-status').value,action:$('#filter-action').value};}
    function filteredAudits(){const f=getFilters();return audits.map((a,i)=>({a,i})).filter(({a})=>{if(f.server!=='不限'&&a.server!==f.server)return false;if(f.source!=='全部'&&a.sourceType!==f.source)return false;if(f.sourceNo&&!a.sourceNo.includes(f.sourceNo))return false;if(f.rule&&!a.ruleName.includes(f.rule))return false;if(f.origin!=='全部'){const origin=a.sourceType==='监控规则'?a.generationMode:a.applicant;if(origin!==f.origin)return false;}if(f.unionId&&!String(a.unionId).includes(f.unionId))return false;if(f.roleId&&!String(a.roleId).includes(f.roleId))return false;if(f.status!=='不限'&&a.status!==f.status)return false;if(f.action!=='不限'&&a.type!==f.action)return false;return true;});}

    function desc(items){return items.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('');}
    function richDesc(items){return items.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('');}
    function sourceInfo(a){if(a.sourceType==='人工申请')return `<h3 class="section-title">来源信息</h3><dl class="desc">${desc([['来源类型',a.sourceType],['来源单号',a.sourceNo],['申请人',a.applicant],['申请时间',a.applyAt]])}</dl>`;return `<h3 class="section-title">来源信息</h3><dl class="desc">${desc([['来源类型',a.sourceType],['监控批次ID',a.sourceNo],['规则名称',a.ruleName],['巡检时间',a.hitTime],['命中条件快照',a.hitCondition],['生成方式',a.generationMode],['生成时间',a.generatedAt],['审核记录生成结果',a.generationResult]])}</dl><div class="detail-block"><button class="btn-link source-jump">查看审核记录来源</button><span class="subtext">可追溯到对应监控批次或巡检详情</span></div>`;}
    function specialFields(a){if(a.type==='联盟变更')return [['原联盟ID/名称',`${esc(a.unionId)} / ${esc(a.unionName)}`],['目标联盟ID/名称',`${esc(a.targetUnionId)} / ${esc(a.targetUnionName)}`]];if(a.type==='变更阶级/职位')return [['原阶级/职位',esc(a.fromPosition)],['目标阶级/职位',esc(a.toPosition)]];if(a.type==='联盟踢人')return [['成员ID',esc(a.memberId)],['命中原因',esc(a.hitReason)]];if(a.type==='联盟解散')return [['活跃人数',esc(a.activeMembers)],['命中原因',esc(a.hitReason)]];if(a.sourceType==='监控规则')return [['命中原因',esc(a.hitReason||'-')],['','']];return [];}
    function openDetail(i){currentIndex=i;const a=audits[i];const basic=[['操作类型',a.type],['对象维度',a.objectType],['联盟ID',a.unionId],['联盟名称',a.unionName],['区服',a.server],['开服时间',a.openAt||'-'],['角色ID',a.roleId],['审核状态',`<span class="tag ${tag(a.status)}">${esc(a.status)}</span>`],...specialFields(a),['操作详情',a.detail]];$('#drawer-title').textContent=a.status==='待审核'?'审核处理':'审核详情';$('#detail-body').innerHTML=`<h3 class="section-title">基础信息</h3><dl class="desc">${richDesc(basic)}</dl>${sourceInfo(a)}<h3 class="section-title">审核信息</h3><dl class="desc">${richDesc([['审核状态',`<span class="tag ${tag(a.status)}">${esc(a.status)}</span>`],['审核人',a.auditor],['审核时间',a.auditAt],['审核备注',a.remark]])}</dl>`;$('#drawer-primary').style.display=a.status==='待审核'?'inline-block':'none';$('#drawer-reject').style.display=a.status==='待审核'?'inline-block':'none';$('#detail-overlay').classList.add('open');}
    function close(id){$('#'+id).classList.remove('open')}function toast(m){const n=$('#toast');n.textContent=m;n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),2200)}
    function approveCurrent(){if(currentIndex<0)return;audits[currentIndex].status='已通过';audits[currentIndex].auditor='当前用户';audits[currentIndex].auditAt='2026-08-17 18:00:00';audits[currentIndex].remark='审核通过';close('detail-overlay');render();toast('已通过审核');}
    function rejectCurrent(){if(currentIndex<0)return;audits[currentIndex].status='已拒绝';audits[currentIndex].auditor='当前用户';audits[currentIndex].auditAt='2026-08-17 18:00:00';audits[currentIndex].remark='审核拒绝';close('detail-overlay');render();toast('已拒绝审核');}
    document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c){close(c.dataset.close);return;}const d=e.target.closest('.detail');if(d){openDetail(Number(d.dataset.index));return;}const r=e.target.closest('.reject');if(r){currentIndex=Number(r.dataset.index);rejectCurrent();return;}if(e.target.closest('.source-jump')){toast('已定位到对应巡检来源');}});
    $$('.overlay').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)close(x.id)}));
    $('#query-audit').addEventListener('click',()=>{render();toast('已按查询条件刷新审核列表')});
    $('#reset-audit').addEventListener('click',()=>{$$('.filters input').forEach(x=>x.value='');$$('.filters select').forEach(x=>x.selectedIndex=0);render();toast('已重置查询条件')});
    $('#batch-audit').addEventListener('click',()=>{const checked=$$('.row-check:checked');if(!checked.length){toast('请选择待审核记录');return;}$('#batch-copy').textContent='已选择 '+checked.length+' 条待审核记录';$('#batch-overlay').classList.add('open');});
    $('#batch-pass').addEventListener('click',()=>{$$('.row-check:checked').forEach(box=>{const a=audits[Number(box.closest('tr').dataset.index)];a.status='已通过';a.auditor='当前用户';a.auditAt='2026-08-17 18:00:00';a.remark=$('#batch-remark').value.trim()||'批量审核通过';});close('batch-overlay');render();toast('已批量通过审核')});
    $('#batch-reject').addEventListener('click',()=>{$$('.row-check:checked').forEach(box=>{const a=audits[Number(box.closest('tr').dataset.index)];a.status='已拒绝';a.auditor='当前用户';a.auditAt='2026-08-17 18:00:00';a.remark=$('#batch-remark').value.trim()||'批量审核拒绝';});close('batch-overlay');render();toast('已批量拒绝审核')});
    $('#check-all').addEventListener('change',e=>$$('.row-check:not(:disabled)').forEach(x=>x.checked=e.target.checked));
    $('#drawer-primary').addEventListener('click',approveCurrent);$('#drawer-reject').addEventListener('click',rejectCurrent);render();
  </script>
</body>
</html>
