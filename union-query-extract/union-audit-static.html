      <div class="field"><label>规则名称</label><input class="control" id="filter-rule" placeholder="请输入规则名称"></div>

      <div class="field"><select class="control compact" id="filter-union-type" aria-label="联盟查询字段"><option value="id">联盟ID</option><option value="name">联盟名称</option></select><input class="control" id="filter-union" placeholder="请输入联盟ID"></div>
      <div class="field"><label>角色ID</label><input class="control" id="filter-role" placeholder="请输入角色ID"></div>
      <div class="field"><label>审核状态</label><select class="control" id="filter-status"><option>不限</option><option>待审核</option><option>已通过</option><option>已拒绝</option></select></div>
      <div class="field"><label>操作类型</label><select class="control" id="filter-action"><option>不限</option><option>宣言修改</option><option>联盟改名</option><option>联盟踢人</option><option>联盟解散</option><option>变更阶级/职位</option><option>联盟变更</option><option>VIP补偿</option><option>客服跟进</option></select></div>
      <button class="btn btn-primary" id="query-audit">查 询</button><button class="btn" id="reset-audit">重 置</button>
    </section>
    <div class="toolbar">
      <div class="toolbar-left"><button class="btn" id="batch-audit">批量审核</button><span class="hint">人工申请和监控规则自动生成的审核记录统一在此处理；监控规则来源按操作对象逐条审核</span></div>
      <div class="toolbar-right"><button class="btn icon-btn" title="导出当前列表">⇩</button><button class="btn icon-btn" title="调整表格密度">↕</button><button class="btn icon-btn" title="列设置">⚙</button></div>
    </div>
    <div class="table-wrap">
      <table id="audit-table">
        <thead><tr><th style="width:46px"><input type="checkbox" id="check-all"></th><th style="width:100px">审核状态</th><th style="width:110px">来源类型</th><th style="width:150px">来源单号</th><th style="width:180px">规则名称</th><th style="width:130px">操作类型</th><th style="width:90px">对象维度</th><th style="width:120px">联盟ID</th><th style="width:140px">联盟名称</th><th style="width:180px">区服</th><th style="width:150px">开服时间</th><th style="width:120px">角色ID</th><th style="width:260px">操作详情</th><th style="width:210px">来源生成信息</th><th style="width:170px">审核信息</th><th style="width:130px">操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
  <div class="overlay" id="detail-overlay"><aside class="drawer"><header class="drawer-head"><span id="drawer-title">审核详情</span><button class="close" data-close="detail-overlay" aria-label="关闭">×</button></header><div class="drawer-body" id="detail-body"></div><footer class="drawer-foot"><button class="btn" data-close="detail-overlay">关闭</button><button class="btn btn-primary" id="drawer-primary">通过</button><button class="btn btn-danger" id="drawer-reject">拒绝</button></footer></aside></div>

    };
    function isRoleDimension(a){return (a.objectType==='成员'||a.objectType==='角色')&&a.roleId&&a.roleId!=='-';}
    function objectSnapshot(a){const role=roleSnapshotMap[a.roleId]||{};return {roleId:a.roleId||'-',createdAt:role.createdAt||'-',onlineStatus:role.onlineStatus||'-',rechargeUsd:role.rechargeUsd||'-',lastOfflineAt:role.lastOfflineAt||'-',power:role.power||'-',level:role.level||'-',unionPowerRank:role.unionPowerRank||'-'};}
    function processSnapshot(a){if(a.type==='联盟踢人')return '单盟踢人上限：10人；剩余联盟人数下限：30人';if(a.type==='联盟解散')return '无额外处理配置';if(a.type==='变更阶级/职位')return `目标阶级/职位：${esc(a.toPosition||'-')}；上任人数：1人`;if(a.type==='联盟变更')return `目标联盟：${esc(a.targetUnionName||'-')}；分配策略：按战力匹配`;if(a.type==='VIP补偿')return '补偿模板：VIP回流礼包；单角色发放上限：1次';return '-';}
    function applyReason(a){if(a.type==='宣言修改')return '申请人填写：联盟宣言需要调整，已确认内容可提交审核';if(a.type==='联盟改名')return '申请人填写：联盟名称需要调整，提交审核确认';return '申请人填写：人工提交操作申请';}
    function objectInfo(a){const unionItems=[['区服',esc(a.server)],['开服时间',esc(a.openAt||'-')]];if(a.unionId&&a.unionId!=='-'){unionItems.push(['联盟ID',esc(a.unionId)],['联盟名称',esc(a.unionName)],['联盟排名',esc(unionRankMap[a.unionId]||'-')]);}const role=objectSnapshot(a);const roleHtml=isRoleDimension(a)?`<div class="detail-block"><b>角色信息</b><dl class="desc" style="margin:12px 0 0">${richDesc([['角色ID',esc(role.roleId)],['角色创建时间',esc(role.createdAt)],['在线状态',esc(role.onlineStatus)],['累计充值金额（美元）',esc(role.rechargeUsd)],['最后离线时间',esc(role.lastOfflineAt)],['战力',esc(role.power)],['等级',esc(role.level)],['角色战力在联盟内排名',esc(role.unionPowerRank)]])}</dl></div>`:'';return `<h3 class="section-title">审核对象信息</h3><div class="detail-block"><b>区服 / 联盟信息</b><dl class="desc" style="margin:12px 0 0">${richDesc(unionItems)}</dl></div>${roleHtml}`;}
    function evidenceInfo(a){if(a.sourceType==='人工申请')return `<h3 class="section-title">命中/申请信息</h3><dl class="desc">${richDesc([['来源说明',`人工申请 - ${esc(a.sourceNo)}`],['申请人',esc(a.applicant)],['申请时间',esc(a.applyAt)],['申请内容',esc(a.detail)],['申请理由',applyReason(a)],['申请时对象快照','见上方审核对象信息']])}</dl>`;return `<h3 class="section-title">命中/申请信息</h3><dl class="desc">${richDesc([['监控配置',`联盟监控配置 - ${esc(a.ruleName)}`],['命中条件快照',esc(a.hitCondition||'-')],['处理配置快照',processSnapshot(a)],['命中原因',esc(a.hitReason||'-')],['巡检时间',esc(a.hitTime||'-')],['生成时间',esc(a.generatedAt||'-')],['审核记录生成结果',esc(a.generationResult||'-')]])}</dl><div class="detail-block"><button class="btn-link source-jump">查看审核记录来源</button><span class="subtext">可追溯到对应监控批次或巡检详情</span></div>`;}
    function openDetail(i){currentIndex=i;const a=audits[i];const basic=[['审核状态',`<span class="tag ${tag(a.status)}">${esc(a.status)}</span>`],['来源类型',`<span class="tag ${sourceTag(a.sourceType)}">${esc(a.sourceType)}</span>`],['来源单号',esc(a.sourceNo)],['规则名称',esc(a.ruleName)],['操作类型',`<span class="tag tag-blue">${esc(a.type)}</span>`],['对象维度',esc(a.objectType)],['操作详情',esc(a.detail)],['','']];$('#drawer-title').textContent=a.status==='待审核'?'审核处理':'审核详情';$('#detail-body').innerHTML=`<h3 class="section-title">基础信息</h3><dl class="desc">${richDesc(basic)}</dl>${objectInfo(a)}${evidenceInfo(a)}<h3 class="section-title">审核信息</h3><dl class="desc">${richDesc([['审核状态',`<span class="tag ${tag(a.status)}">${esc(a.status)}</span>`],['审核人',esc(a.auditor)],['审核时间',esc(a.auditAt)],['审核备注',esc(a.remark)]])}</dl>`;$('#drawer-primary').style.display=a.status==='待审核'?'inline-block':'none';$('#drawer-reject').style.display=a.status==='待审核'?'inline-block':'none';$('#detail-overlay').classList.add('open');}
    function close(id){$('#'+id).classList.remove('open')}function toast(m){const n=$('#toast');n.textContent=m;n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),2200)}
    function approveCurrent(){if(currentIndex<0)return;audits[currentIndex].status='已通过';audits[currentIndex].auditor='当前用户';audits[currentIndex].auditAt='2026-08-17 18:00:00';audits[currentIndex].remark='审核通过';close('detail-overlay');render();toast('已通过审核');}
    function rejectCurrent(){if(currentIndex<0)return;audits[currentIndex].status='已拒绝';audits[currentIndex].auditor='当前用户';audits[currentIndex].auditAt='2026-08-17 18:00:00';audits[currentIndex].remark='审核拒绝';close('detail-overlay');render();toast('已拒绝审核');}
    document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c){close(c.dataset.close);return;}const d=e.target.closest('.detail');if(d){openDetail(Number(d.dataset.index));return;}const r=e.target.closest('.reject');if(r){currentIndex=Number(r.dataset.index);rejectCurrent();return;}if(e.target.closest('.source-jump')){toast('已定位到对应巡检来源');}});
    $$('.overlay').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)close(x.id)}));
    $('#query-audit').addEventListener('click',()=>{render();toast('已按查询条件刷新审核列表')});
    function syncUnionFilterPlaceholder(){const isName=$('#filter-union-type').value==='name';$('#filter-union').placeholder=isName?'请输入联盟名称':'请输入联盟ID';}
    $('#filter-union-type').addEventListener('change',syncUnionFilterPlaceholder);
    $('#reset-audit').addEventListener('click',()=>{$$('.filters input').forEach(x=>x.value='');$$('.filters select').forEach(x=>x.selectedIndex=0);syncUnionFilterPlaceholder();render();toast('已重置查询条件')});
    $('#batch-audit').addEventListener('click',()=>{const checked=$$('.row-check:checked');if(!checked.length){toast('请选择待审核记录');return;}$('#batch-copy').textContent='已选择 '+checked.length+' 条待审核记录';$('#batch-overlay').classList.add('open');});
    $('#batch-pass').addEventListener('click',()=>{$$('.row-check:checked').forEach(box=>{const a=audits[Number(box.closest('tr').dataset.index)];a.status='已通过';a.auditor='当前用户';a.auditAt='2026-08-17 18:00:00';a.remark=$('#batch-remark').value.trim()||'批量审核通过';});close('batch-overlay');render();toast('已批量通过审核')});
    $('#batch-reject').addEventListener('click',()=>{$$('.row-check:checked').forEach(box=>{const a=audits[Number(box.closest('tr').dataset.index)];a.status='已拒绝';a.auditor='当前用户';a.auditAt='2026-08-17 18:00:00';a.remark=$('#batch-remark').value.trim()||'批量审核拒绝';});close('batch-overlay');render();toast('已批量拒绝审核')});
    $('#check-all').addEventListener('change',e=>$$('.row-check:not(:disabled)').forEach(x=>x.checked=e.target.checked));
    $('#drawer-primary').addEventListener('click',approveCurrent);$('#drawer-reject').addEventListener('click',rejectCurrent);render();
  </script>
</body>
</html>
