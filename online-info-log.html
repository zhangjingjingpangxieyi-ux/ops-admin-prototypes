<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线信息日志（日统计）</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-width:1120px;background:#f2f4f7;color:#24324a;font:13px "Microsoft YaHei","PingFang SC",Arial,sans-serif}button,input{font:inherit}.app{min-height:100vh;padding:18px 8px 30px}.toolbar{height:54px;background:#fff;border-bottom:1px solid #eef1f5;padding:10px 12px;display:flex;align-items:center;gap:8px}.field{height:34px;display:flex;align-items:center;border:1px solid #dfe4eb;border-radius:4px;background:#fff;color:#26364e}.field.date{width:180px;padding:0 10px}.field.server{width:150px;padding:0 10px}.field.dimension{width:170px;padding:0 10px;position:relative;cursor:pointer}.field .icon{color:#7f8b9e;margin-right:8px;font-size:15px}.field .arrow{margin-left:auto;color:#8d98a9}.query{height:34px;padding:0 18px;border:0;border-radius:4px;background:#168df5;color:#fff;cursor:pointer}.query:active{background:#0a7de3}.tabs{height:48px;background:#fff;margin-top:10px;padding:0 16px;display:flex;align-items:end;border-bottom:1px solid #e8ecf2}.tab{height:42px;padding:0 20px;display:flex;align-items:center;color:#66758a;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:#168df5;font-weight:700;border-bottom-color:#168df5}.content{margin-top:10px;background:#fff;padding:0 12px 16px}.title{height:56px;display:flex;align-items:center;font-size:15px;font-weight:700;color:#25344c}.title .badge{margin-left:10px;padding:3px 8px;border-radius:12px;background:#eef7ff;color:#168df5;font-size:12px;font-weight:400}.hint{margin-left:auto;color:#8b96a7;font-size:12px;font-weight:400}.table-wrap{overflow:auto;border-top:1px solid #eef1f5}table{width:100%;min-width:1060px;border-collapse:collapse;table-layout:fixed}th,td{height:42px;padding:0 12px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{height:40px;background:#fafbfd;color:#536278;font-weight:700}td{color:#263750}tbody tr:hover td{background:#f5faff}.merged-total{background:#f1f7ff;color:#156fbe;font-weight:700;vertical-align:middle;text-align:center;border-left:1px solid #d8eaff;border-right:1px solid #d8eaff}.num{text-align:right;font-variant-numeric:tabular-nums}.date-col{width:120px}.id-col{width:85px}.name-col{width:125px}.dim-col{width:120px}.metric-col{width:120px}.sum-col{width:110px}.pagination{height:52px;display:flex;align-items:center;justify-content:flex-end;gap:9px;color:#65748a}.page{height:28px;min-width:28px;padding:0 8px;border:1px solid #d9e0e9;background:#fff;color:#526176;border-radius:3px;cursor:pointer}.page.active{border-color:#168df5;color:#168df5}.page-size{height:28px;border:1px solid #d9e0e9;border-radius:3px;background:#fff;padding:0 8px;color:#526176}.dropdown{display:none;position:absolute;top:38px;left:0;z-index:10;width:100%;padding:8px 0;background:#fff;border:1px solid #dfe5ed;border-radius:4px;box-shadow:0 8px 20px rgba(30,45,70,.14)}.dimension.open .dropdown{display:block}.option{height:30px;display:flex;align-items:center;padding:0 12px;gap:8px}.option:hover{background:#f0f7ff}.option input{accent-color:#168df5}.empty{padding:50px;text-align:center;color:#99a4b3}.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);display:none;background:rgba(35,48,70,.9);color:#fff;border-radius:4px;padding:9px 18px;z-index:20}.toast.show{display:block}.history-frame{display:none;width:100%;height:760px;border:0;background:#f2f4f7}.app.history-mode .toolbar{display:flex}.app.history-mode .dimension{display:none}.history-only{display:none}.app.history-mode .history-only{display:flex}.app.history-mode .content{display:none}.app.history-mode .history-frame{display:block}
.field input[type=date],.field select{width:100%;border:0;background:transparent;color:inherit;outline:none}.pagination button:disabled{opacity:.45;cursor:default}.tab{background:none;border-top:0;border-left:0;border-right:0;font:inherit}.hint{max-width:45%;text-align:right}</style></head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="field date"><span class="icon">▣</span><input id="start" aria-label="开始日期" type="date" value="2026-09-14"></div>
    <div class="field date"><span class="icon">▣</span><input id="end" aria-label="结束日期" type="date" value="2026-09-21"></div>
    <div class="field server"><span class="icon">T</span><select id="server" aria-label="区服"><option value="all">全部区服</option><option value="2003">2003 六尺之渊</option></select></div>
    <div id="dimensionField" class="field dimension"><span class="icon">T</span><span id="dimensionLabel">国家</span><span class="arrow">⌄</span><div id="dropdown" class="dropdown"></div></div>
    <div class="field role history-only"><input id="historyRoleId" placeholder="角色ID" aria-label="角色ID"></div><div class="field role history-only"><input id="historyRoleName" placeholder="角色名称" aria-label="角色名称"></div><button id="query" class="query">查询</button>
  </div>
  <div class="tabs"><button class="tab active" data-view="country">分国家在线信息日志</button><button class="tab" data-view="map">分地图在线信息日志</button><button class="tab" data-view="job">分职业在线信息日志</button><button class="tab history-tab" data-history="power">历史战力情况</button><button class="tab history-tab" data-history="warehouse">历史仓库</button><button class="tab history-tab" data-history="bag">历史背包</button><button class="tab history-tab" data-history="equipment">历史装备情况</button></div>
  <main class="content">
    <div class="title"><span id="pageTitle">代号经典分国家在线信息日志</span><span class="badge">按日统计</span><span id="summary" class="hint">每个统计日期 + 区服 + 国家一条记录</span></div>
    <div class="table-wrap"><table><colgroup><col class="date-col"><col class="id-col"><col class="name-col"><col class="dim-col"><col class="metric-col"><col class="sum-col"><col class="metric-col"><col class="sum-col"><col class="metric-col"><col class="sum-col"></colgroup><thead><tr><th>统计日期</th><th>区服ID</th><th>区服名称</th><th id="dimHeader">国家</th><th>角色最大在线</th><th>最大值小计</th><th>角色最小在线</th><th>最小值小计</th><th>角色平均在线</th><th>平均值小计</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="pagination"><span id="total"></span><button id="prev" class="page" aria-label="上一页">‹</button><span id="pageNum"></span><button id="next" class="page" aria-label="下一页">›</button><select id="size" class="page-size" aria-label="每页分组数"><option value="7">7 组/页</option><option value="3">3 组/页</option></select></div>
  </main>
  <iframe id="historyFrame" class="history-frame" title="角色历史快照日志"></iframe>
</div><div id="toast" class="toast">查询成功</div>
<script>
const config={
 country:{title:'代号经典分国家在线信息日志',label:'国家',summary:'每个统计日期 + 区服 + 国家一条记录',items:['云州','幽州','荆州','秦州','越州','雷州'],base:[336,280,244,218,196,172],min:[12,8,6,4,3,2],avg:[182.4,151.2,129.7,115.8,98.5,87.1],subtotal:'六国小计'},
 map:{title:'代号经典分地图在线信息日志',label:'游戏地图',summary:'每个统计日期 + 区服 + 地图一条记录',items:['丹霞一','丹霞三','丹霞二','亡魂谷','悬空之地','洞阳','福地','赏金之战'],base:[210,194,161,149,142,81,126,96],min:[12,10,8,6,3,2,5,4],avg:[126.5,114.8,98.3,88.4,82.1,47.6,68.2,51.7],subtotal:'地图小计'},
 job:{title:'代号经典分职业在线信息日志',label:'职业',summary:'每个统计日期 + 区服 + 职业一条记录',items:['剑仙','天师','幽冥','忘忧','拳师','武圣','殷刹','灵狐','神羿','鬼谷'],base:[92,73,90,58,64,145,47,38,52,41],min:[8,5,7,3,4,11,2,2,3,2],avg:[56.3,42.7,53.1,31.8,38.6,86.9,27.5,22.4,30.7,24.6],subtotal:'职业小计'}
};
let view=['country','map','job'].includes(location.hash.slice(1))?location.hash.slice(1):'country';
const $=s=>document.querySelector(s);
let selected=[],applied=[],page=1,start='2026-09-14',end='2026-09-21';
function sum(a){return a.reduce((x,y)=>x+y,0)}
function menu(){const c=config[view];$('#dropdown').innerHTML='<label class="option"><input type="checkbox" data-all '+(selected.length===c.items.length?'checked':'')+'>全部选中</label>'+c.items.map((x,i)=>`<label class="option"><input type="checkbox" data-item="${i}" ${selected.includes(i)?'checked':''}>${x}</label>`).join('');$('#dimensionLabel').textContent=selected.length===c.items.length?c.label:('已选 '+selected.length+' 项');}
function render(){const c=config[view];$('#pageTitle').textContent=c.title;$('#dimHeader').textContent=view==='map'?'地图':c.label;$('#summary').textContent='示例数据 · 小计值按分组纵向合并展示';const dates=[];for(let d=new Date(end+'T00:00:00Z');d>=new Date(start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1)){if(dates.length>=366)break;dates.push(d.toISOString().slice(0,10));}const size=Number($('#size').value),pages=Math.max(1,Math.ceil(dates.length/size));page=Math.min(page,pages);let html='';dates.slice((page-1)*size,page*size).forEach((day,k)=>{const offset=(page-1)*size+k;const mx=c.base.map(x=>Math.max(0,x-offset*3)),mn=c.min.map(x=>Math.max(0,x-offset)),av=c.avg.map(x=>Math.max(0,x-offset*1.4));const count=applied.length;applied.forEach((i,row)=>{html+='<tr>';if(row===0)html+=`<td rowspan="${count}">${day}</td><td rowspan="${count}">2003</td><td rowspan="${count}">六尺之渊</td>`;html+=`<td>${c.items[i]}</td><td class="num">${mx[i]}</td>`;if(row===0)html+=`<td rowspan="${count}" class="num merged-total">${sum(applied.map(i=>mx[i]))}</td>`;html+=`<td class="num">${mn[i]}</td>`;if(row===0)html+=`<td rowspan="${count}" class="num merged-total">${sum(applied.map(i=>mn[i]))}</td>`;html+=`<td class="num">${av[i].toFixed(2)}</td>`;if(row===0)html+=`<td rowspan="${count}" class="num merged-total">${sum(applied.map(i=>av[i])).toFixed(2)}</td>`;html+='</tr>';});});$('#rows').innerHTML=html||'<tr><td colspan="10" class="empty">暂无数据</td></tr>';$('#total').textContent='共 '+dates.length+' 组 / '+dates.length*applied.length+' 条明细';$('#pageNum').textContent=page+' / '+pages;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages;}
function switchView(){const c=config[view];selected=c.items.map((_,i)=>i);applied=[...selected];page=1;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));menu();render();}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800);}
document.querySelectorAll('.tab[data-view]').forEach(t=>t.addEventListener('click',()=>{document.querySelector('.app').classList.remove('history-mode');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');view=t.dataset.view;location.hash=view;switchView();}));
document.querySelectorAll('.history-tab').forEach(t=>t.addEventListener('click',()=>{document.querySelector('.app').classList.add('history-mode');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');const f=document.querySelector('#historyFrame');f.onload=()=>{try{const st=f.contentDocument.createElement('style');st.textContent='.filter,.titlebar,.tabs{display:none!important}.page{padding:0!important;background:#f2f4f7!important}';f.contentDocument.head.appendChild(st);}catch(e){}};f.src='role-history-snapshot.html#'+t.dataset.history;}));
$('#dimensionField').addEventListener('click',e=>{if(!e.target.closest('.dropdown'))$('#dimensionField').classList.toggle('open');});
$('#dropdown').addEventListener('change',e=>{if(e.target.hasAttribute('data-all'))selected=e.target.checked?config[view].items.map((_,i)=>i):[];else{let i=Number(e.target.dataset.item);selected=e.target.checked?[...selected,i]:selected.filter(x=>x!==i);}menu();});
document.addEventListener('click',e=>{if(!$('#dimensionField').contains(e.target))$('#dimensionField').classList.remove('open');});
$('#query').addEventListener('click',()=>{if(document.querySelector('.app').classList.contains('history-mode')){toast('历史快照查询条件已应用');return;}const a=$('#start').value,b=$('#end').value;if(!a||!b||a>b){toast('请选择有效日期，开始日期不能晚于结束日期');return;}if((new Date(b)-new Date(a))/86400000>365){toast('原型最多展示366天示例数据');return;}start=a;end=b;applied=selected.length?[...selected]:config[view].items.map((_,i)=>i);page=1;$('#dimensionField').classList.remove('open');render();toast('查询成功');});
$('#prev').onclick=()=>{page--;render();};$('#next').onclick=()=>{page++;render();};$('#size').onchange=()=>{page=1;render();};
document.querySelectorAll('th').forEach(th=>{if(th.textContent.includes('小计'))th.title='同一区服、同一天全部分类的对应统计值相加；不是全服同一时刻的峰值或谷值。';});
if(['power','warehouse','bag','equipment'].includes(location.hash.slice(1))){const t=document.querySelector('.history-tab[data-history=\"'+location.hash.slice(1)+'\"]');if(t)t.click();}else{switchView();}
</script></body></html>
