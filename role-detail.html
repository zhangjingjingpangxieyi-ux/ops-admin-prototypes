<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色详情</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-width:1280px;font:14px/1.5 "PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#202733;background:#f4f6f8}
    body.mobile-mode{min-width:0}
    button{font:inherit}
    .page{min-height:100vh;background:#f4f6f8}
    .mode-switch{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;gap:8px;padding:8px 24px;border-bottom:1px solid #edf0f5;background:#fff}
    .mode-btn{height:28px;border:1px solid #d9dde6;border-radius:3px;padding:0 12px;color:#596273;cursor:pointer;background:#fff}
    .mode-btn.active{border-color:#1677ff;color:#fff;background:#1677ff}
    .summary{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:18px 24px;border-bottom:1px solid #edf0f5;background:#fff}
    .identity{min-width:0}
    .name-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .role-name{font-size:18px;font-weight:600;color:#202733;line-height:1.3}
    .status{display:inline-flex;min-height:22px;align-items:center;border-radius:3px;padding:2px 8px;font-size:12px;background:#eaf7ee;color:#1f8f43}
    .status.offline{background:#f2f4f7;color:#667085}
    .meta-grid{display:flex;flex-wrap:wrap;gap:8px 22px;color:#596273}
    .meta-item{white-space:nowrap}
    .meta-label{color:#8a94a6}
    .actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;min-width:360px}
    .btn{height:32px;border:1px solid #d9dde6;border-radius:3px;padding:0 14px;color:#202733;cursor:pointer;background:#fff}
    .btn:hover{border-color:#1677ff;color:#1677ff}
    .btn.primary{border-color:#1677ff;color:#fff;background:#1677ff}
    .btn.primary:hover{background:#4096ff}
    .btn.danger{border-color:#ff4d4f;color:#fff;background:#ff4d4f}
    .btn.danger:hover{border-color:#ff7875;color:#fff;background:#ff7875}
    .tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;padding:0 24px;border-bottom:1px solid #edf0f5;background:#fff}
    .tab{height:44px;border:0;border-bottom:2px solid transparent;padding:0 14px;color:#596273;white-space:nowrap;cursor:pointer;background:transparent}
    .tab:hover{color:#1677ff}
    .tab.active{color:#1677ff;border-bottom-color:#1677ff;font-weight:500}
    .content{padding:16px 24px}
    .panel{border:1px solid #edf0f5;background:#fff}
    .panel-head{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 16px;border-bottom:1px solid #edf0f5;background:#fbfcfe}
    .panel-title{font-weight:500;color:#202733}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border:1px solid #edf0f5;padding:12px 16px;text-align:left;white-space:nowrap}
    th{color:#202733;font-weight:500;background:#f7f9fc}
    td{color:#596273;background:#fff}
    .detail-table{min-width:1120px}
    .detail-table th{width:9%;color:#202733;background:#fafafa}
    .detail-table td{width:16%;color:#202733}
    .link-text{color:#1677ff}.status-online{color:#24a148}.status-offline{color:#8a94a6}
    .empty-state{display:flex;min-height:280px;align-items:center;justify-content:center;color:#98a2b3;background:#fff}
    .module-note{min-width:0;color:#8a94a6;font-size:12px;text-align:right}
    .item-list-wrap{overflow:visible}
    .item-table{min-width:880px}.item-table th,.item-table td{height:56px}
    .item-cell{display:flex;align-items:center;gap:10px}
    .item-preview{position:relative;display:inline-flex;align-items:center;color:#1677ff;cursor:default}
    .item-icon{position:relative;display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(32,39,51,.08);border-radius:6px;padding:0;color:#fff;font-weight:700;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
    .item-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .rarity-legend{background:linear-gradient(135deg,#6f8cff,#2f54eb)}.rarity-epic{background:linear-gradient(135deg,#a66cff,#6d28d9)}.rarity-rare{background:linear-gradient(135deg,#20c997,#087f5b)}.rarity-common{background:linear-gradient(135deg,#8a94a6,#596273)}
    .item-popover{position:absolute;left:46px;top:-10px;z-index:30;display:none;width:280px;border:1px solid #d9dde6;border-radius:6px;padding:12px;background:#fff;box-shadow:0 10px 30px rgba(32,39,51,.16);white-space:normal}
    .item-preview.text-trigger .item-popover{left:0;top:26px}
    .item-preview:hover .item-popover,.item-preview:focus-within .item-popover{display:block}
    .popover-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #edf0f5}
    .popover-title{font-weight:600;color:#202733}.popover-sub{margin-top:2px;color:#8a94a6;font-size:12px}
    .attr-grid{display:grid;grid-template-columns:78px 1fr;gap:6px 10px}.attr-label{color:#8a94a6}.attr-value{min-width:0;color:#202733;word-break:break-all}
    .detail-btn{border:0;padding:0;color:#1677ff;cursor:pointer;background:transparent}.detail-btn:hover{text-decoration:underline}
    .tag-pill{display:inline-flex;height:22px;align-items:center;border-radius:3px;padding:0 8px;color:#596273;background:#f2f4f7}
    .float-mask{position:fixed;inset:0;z-index:40;background:rgba(32,39,51,.16)}
    .float-card{position:fixed;right:24px;top:92px;z-index:41;width:360px;max-width:calc(100vw - 48px);border:1px solid #d9dde6;border-radius:6px;background:#fff;box-shadow:0 18px 48px rgba(32,39,51,.22)}
    .float-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #edf0f5}.float-title{font-weight:600}
    .float-close{border:0;color:#8a94a6;cursor:pointer;background:transparent}.float-body{padding:16px}
    body.mobile-mode .page{max-width:430px;margin:0 auto;border-left:1px solid #edf0f5;border-right:1px solid #edf0f5}
    body.mobile-mode .mode-switch{padding:8px 12px}
    body.mobile-mode .summary{display:block;padding:14px 12px}
    body.mobile-mode .name-row{align-items:center;justify-content:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap}
    body.mobile-mode .role-name{font-size:16px;word-break:break-all}
    body.mobile-mode .status{max-width:none;justify-content:center;text-align:center;line-height:1.35;white-space:nowrap}
    body.mobile-mode .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;color:#596273}
    body.mobile-mode .meta-item{min-width:0;white-space:nowrap}
    body.mobile-mode .actions{justify-content:flex-start;min-width:0;margin-top:12px}
    body.mobile-mode .btn{height:30px;padding:0 10px}
    body.mobile-mode .tabs{padding:0 12px}
    body.mobile-mode .tab{height:40px;padding:0 10px}
    body.mobile-mode .content{padding:12px}
    body.mobile-mode .panel-head{min-height:40px;padding:0 12px}
    body.mobile-mode .detail-table{min-width:0}
    body.mobile-mode .detail-table th{width:38%;white-space:normal}
    body.mobile-mode .detail-table td{width:62%;white-space:normal;word-break:break-all}
    body.mobile-mode .item-list-wrap{overflow:auto}
    body.mobile-mode .item-table{min-width:720px}
    body.mobile-mode .item-popover{display:none!important}
    body.mobile-mode .float-card{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-width:none}
    body.mobile-mode th,body.mobile-mode td{padding:10px 12px}
    @media (max-width:380px){
      body.mobile-mode .meta-grid{grid-template-columns:1fr}
      body.mobile-mode .status{white-space:normal}
    }
  </style>
</head>

        { id:"410118", name:"炼金工坊", count:1, icon:"坊", rarity:"epic", ext:{ "建筑等级":"8", "产出类型":"强化材料", "当前队列":"3/5", "升级条件":"木材 12000；金币 8000" } }
      ]
    };
    const genericTables = {
      "邮件": {
        note:"邮件类 Tab 使用普通表格展示实际字段，无拓展字段时不展示图标和详情浮层。",
        columns:["邮件ID","邮件标题","邮件类型","发送时间","领取状态"],
        rows:[
          ["M20260610001","赛季补偿奖励","系统邮件","2026-06-10 09:30:00","已领取"],
          ["M20260608016","联盟战结算","活动邮件","2026-06-08 22:15:30","未领取"]
        ]
      },
      "联盟": {
        note:"联盟类 Tab 字段较少时直接展示业务字段，不强制出现拓展详情列。",
        columns:["联盟ID","联盟名称","职位","联盟等级","加入时间"],
        rows:[
          ["29","Atlantis","成员","18","2025-12-16 11:24:09"]
        ]
      }
    };
    const tabConfigs = {
      "背包-物品": { type:"itemList", title:"背包-物品", note:"通用物品类展示：基础列固定为图标、ID、名称、数量；项目自定义字段收进浮层。" },
      "背包-装备": { type:"itemList", title:"背包-装备", note:"装备类同样复用物品列表，装备属性、强化、穿戴对象等作为拓展字段。" },
      "皮肤": { type:"itemList", title:"皮肤", note:"皮肤、建筑等可复用物品类模板；无拓展字段时详情入口自动隐藏。" },
      "建筑": { type:"itemList", title:"建筑", note:"建筑等级、容量、耐久等项目字段放在拓展详情中展示。" },
      "邮件": { type:"table", title:"邮件" },
      "联盟": { type:"table", title:"联盟" }
    };

    const roleId = new URLSearchParams(location.search).get("roleId");
    const role = rows.find(item => item[2] === roleId) || rows[0];
    let activeTab = "总览";
    let viewMode = "pc";
    let activeItemDetail = null;

    function renderSummary() {
      const statusClass = role[12] === "在线" ? "status" : "status offline";
      const statusText = role[12] === "离线" && role[16] !== "-" ? `离线 离线时间：${role[16]}` : role[12];
      document.getElementById("summary").innerHTML = `
        <div class="name-row">
          <div class="role-name">${role[3]}</div>
          <span class="${statusClass}">${statusText}</span>
        </div>
        <div class="meta-grid">
          <span class="meta-item"><span class="meta-label">角色ID：</span>${role[2]}</span>
          <span class="meta-item"><span class="meta-label">区服：</span>${role[1]}（${role[0]}）</span>
          <span class="meta-item"><span class="meta-label">游戏账号ID：</span>${role[4]}</span>
          <span class="meta-item"><span class="meta-label">冰川通行证ID：</span>${role[5]}</span>
          <span class="meta-item"><span class="meta-label">渠道ID：</span>${role[6]}</span>
        </div>`;
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = tabNames.map(name => `
        <button class="tab ${name === activeTab ? "active" : ""}" onclick="switchTab('${name}')">${name}</button>
      `).join("");
    }

    function renderOverview() {
      const fields = columns.map((name, index) => ({ name, value: role[index] || "-" }));
      const rowsHtml = [];
      const groupSize = viewMode === "mobile" ? 1 : 4;

      for (let i = 0; i < fields.length; i += groupSize) {
        const group = fields.slice(i, i + groupSize);
        while (group.length < groupSize) group.push({ name: "", value: "" });

        rowsHtml.push(`<tr>${group.map(field => {
          if (!field.name) return `<th></th><td></td>`;
          let value = field.value;
          const fieldIndex = columns.indexOf(field.name);
          if (fieldIndex === 8 && value !== "-") value = `<span class="link-text">${value}</span>`;
          if (fieldIndex === 12) {
            const status = value === "在线" ? "status-online" : "status-offline";
            value = `<span class="${status}">${value}</span>`;
          }
          return `<th>${field.name}</th><td>${value}</td>`;
        }).join("")}</tr>`);
      }

      document.getElementById("content").innerHTML = `
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">总览信息</div>
          </div>
          <div class="table-wrap">
            <table class="detail-table">
              <tbody>${rowsHtml.join("")}</tbody>
            </table>
          </div>
        </section>`;
    }

    function renderEmptyTab() {
      document.getElementById("content").innerHTML = `
        <section class="panel">
          <div class="panel-head"><div class="panel-title">${activeTab}</div></div>
          <div class="empty-state">暂无数据</div>
        </section>`;
    }

    function rarityClass(item) {
      return `rarity-${item.rarity || "common"}`;
    }

    function defaultIconText(item) {
      return (item.name || "物").slice(-1);
    }

    function defaultIconStyle(item) {
      const seed = `${item.id || ""}${item.name || ""}`;
      const colors = ["#1677ff", "#13a8a8", "#52c41a", "#fa8c16", "#722ed1", "#eb2f96", "#2f54eb", "#a0d911"];
      let hash = 0;
      for (let i = 0; i < seed.length; i += 1) hash = (hash * 31 + seed.charCodeAt(i)) % colors.length;
      const color = colors[Math.abs(hash)];
      return `background:${color};border-color:${color}`;
    }

    function itemIconHtml(item) {
      const image = item.image || "";
      const fallback = defaultIconText(item);
      return `
        <span class="item-icon" style="${defaultIconStyle(item)}">
          <span>${fallback}</span>
          ${image ? `<img src="${image}" alt="${item.name}图标" onerror="this.remove()">` : ""}
        </span>`;
    }

    function detailBlock(item) {
      return `
        <div class="popover-head">
          ${itemIconHtml(item)}
          <div>
            <div class="popover-title">${item.name}</div>
            <div class="popover-sub">ID：${item.id} / 数量：${item.count}</div>

        </div>
        <div class="attr-grid">
          ${Object.entries(item.ext || {}).map(([label, value]) => `
            <div class="attr-label">${label}</div>
            <div class="attr-value">${value}</div>
          `).join("")}
        </div>`;
    }

    function renderItemList(config) {
      const data = itemSamples[activeTab] || [];
      document.getElementById("content").innerHTML = `
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">${config.title}</div>
            <div class="module-note">${config.note}</div>
          </div>
          <div class="table-wrap item-list-wrap">
            <table class="item-table">
              <thead>
                <tr>
                  <th>物品图标</th>
                  <th>物品ID</th>
                  <th>物品名称</th>
                  <th>数量</th>
                </tr>
              </thead>
              <tbody>
                ${data.map(item => {
                  const hasExt = item.ext && Object.keys(item.ext).length > 0;
                  return `
                    <tr>
                      <td>
                        <div class="item-cell">
                          <span class="item-preview">
                            <span onclick="${hasExt ? `openItemDetail('${activeTab}','${item.id}')` : ""}">${itemIconHtml(item)}</span>
                            ${hasExt ? `<div class="item-popover">${detailBlock(item)}</div>` : ""}
                          </span>
                        </div>
                      </td>
                      <td>
                        ${hasExt ? `
                          <span class="item-preview text-trigger" onclick="openItemDetail('${activeTab}','${item.id}')">
                            ${item.id}
                            <div class="item-popover">${detailBlock(item)}</div>
                          </span>` : item.id}
                      </td>
                      <td>
                        ${hasExt ? `
                          <span class="item-preview text-trigger" onclick="openItemDetail('${activeTab}','${item.id}')">
                            ${item.name}
                            <div class="item-popover">${detailBlock(item)}</div>
                          </span>` : item.name}
                      </td>
                      <td>${item.count}</td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </section>
        <div id="floatDetail"></div>`;
    }

    function renderGenericTable(config) {
      const table = genericTables[activeTab];
      document.getElementById("content").innerHTML = `
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">${config.title}</div>
            <div class="module-note">${table.note}</div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>${table.columns.map(name => `<th>${name}</th>`).join("")}</tr></thead>
              <tbody>
                ${table.rows.map(row => `<tr>${row.map(value => `<td>${value}</td>`).join("")}</tr>`).join("")}
              </tbody>
            </table>
          </div>
        </section>`;
    }

    function renderActiveTab() {
      const config = tabConfigs[activeTab];
      if (activeTab === "总览") renderOverview();
      else if (config?.type === "itemList") renderItemList(config);
      else if (config?.type === "table") renderGenericTable(config);
      else renderEmptyTab();
    }

    function switchTab(name) {
      activeTab = name;
      activeItemDetail = null;
      renderTabs();
      renderActiveTab();
    }

    function openItemDetail(tabName, itemId) {
      const item = (itemSamples[tabName] || []).find(entry => entry.id === itemId);
      if (!item) return;
      activeItemDetail = item;
      const mount = document.getElementById("floatDetail");
      if (!mount) return;
      mount.innerHTML = `
        <div class="float-mask" onclick="closeItemDetail()"></div>
        <aside class="float-card">
          <div class="float-head">
            <div class="float-title">拓展字段详情</div>
            <button class="float-close" onclick="closeItemDetail()">关闭</button>
          </div>
          <div class="float-body">${detailBlock(item)}</div>
        </aside>`;
    }

    function closeItemDetail() {
      activeItemDetail = null;
      const mount = document.getElementById("floatDetail");
      if (mount) mount.innerHTML = "";
    }

    function showTip(action) {
      alert(`${action}: 角色 ${role[2]}`);
    }

    function setMode(mode) {
      viewMode = mode;
      document.body.classList.toggle("mobile-mode", mode === "mobile");
      document.body.classList.toggle("pc-mode", mode === "pc");
      document.getElementById("pcModeBtn").classList.toggle("active", mode === "pc");
      document.getElementById("mobileModeBtn").classList.toggle("active", mode === "mobile");
      renderActiveTab();
    }

    renderSummary();
    renderTabs();
    renderOverview();
  </script>
</body>
</html>
