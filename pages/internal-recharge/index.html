<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物品申请审核</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 12px;
      color: #1f2329;
      background:
        repeating-linear-gradient(
          -31deg,
          transparent 0 126px,
          rgba(220, 225, 232, .16) 126px 127px,
          transparent 127px 254px
        ),
        #eef1f5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .36;
      background-image:
        repeating-linear-gradient(
          -31deg,
          transparent 0 116px,
          rgba(180, 188, 199, .14) 116px 118px,
          transparent 118px 232px
        );
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 768px;
      padding: 10px 9px 0;
    }

    .watermarks {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      color: rgba(188, 196, 206, .22);
      font-size: 13px;
      line-height: 1;
      z-index: 0;
    }

    .watermarks span {
      position: absolute;
      white-space: nowrap;
      transform: rotate(-31deg);
      user-select: none;
    }

    .top-panel {
      height: 90px;
      background: #fff;
      border: 1px solid #f0f1f4;
    }

    .tabs {
      display: flex;
      align-items: flex-end;
      height: 39px;
      padding-left: 11px;
      gap: 27px;
      border-bottom: 1px solid transparent;
    }

    .tab {
      position: relative;
      height: 36px;
      line-height: 36px;
      color: #202632;
      font-weight: 400;
      cursor: pointer;
    }

    .tab.active {
      color: #1689ff;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 35px;
      height: 1px;
      background: #1689ff;
    }

    .filters {
      display: flex;
      align-items: center;
      padding: 9px 0 0 13px;
      gap: 8px;
    }

    .select,
    .input {
      height: 26px;
      border: 1px solid #dfe2e8;
      background: #fff;
      color: #1f2329;
      display: flex;
      align-items: center;
    }

    .select {
      width: 95px;
      justify-content: space-between;
      padding: 0 9px;
      border-right-color: #d4d8df;
    }

    .select .chevron {
      width: 7px;
      height: 7px;
      border-right: 1px solid #aeb4bd;
      border-bottom: 1px solid #aeb4bd;
      transform: rotate(45deg) translateY(-2px);
    }

    .input.blank {
      width: 143px;
    }

    .input.date {
      width: 239px;
      padding: 0 8px;
      color: #a9adb5;
    }

    .calendar {
      position: relative;
      width: 12px;
      height: 12px;
      margin-left: auto;
      border: 1px solid #bfc5ce;
      border-radius: 1px;
    }

    .calendar::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: 2px;
      border-top: 1px solid #bfc5ce;
    }

    .btn {
      height: 28px;
      border: 1px solid #1689ff;
      background: #1689ff;
      color: #fff;
      padding: 0 16px;
      font-size: 12px;
      line-height: 26px;
      cursor: default;
    }

    .content-panel {
      height: 278px;
      margin-top: 8px;
      background: #fff;
      border: 1px solid #f0f1f4;
    }

    .toolbar {
      height: 49px;
      display: flex;
      align-items: center;
      padding: 0 22px 0 13px;
    }

    .toolbar-left {
      display: flex;
      gap: 12px;
    }

    .btn.primary {
      width: 52px;
      padding: 0;
      text-align: center;
      border-radius: 1px;
    }

    .btn.disabled {
      width: 70px;
      padding: 0;
      color: #a7adb6;
      background: #f4f5f7;
      border-color: #dde1e6;
      text-align: center;
    }

    .toolbar-icons {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #1f2329;
    }

    .icon-resize,
    .icon-gear {
      position: relative;
      width: 14px;
      height: 14px;
    }

    .icon-resize::before,
    .icon-resize::after {
      content: "";
      position: absolute;
      left: 6px;
      width: 2px;
      height: 10px;
      background: #1f2329;
      top: 2px;
    }

    .icon-resize::after {
      width: 8px;
      height: 1px;
      left: 3px;
      top: 6px;
      box-shadow: 0 -4px 0 #1f2329, 0 4px 0 #1f2329;
    }

    .icon-gear {
      border: 1.5px solid #1f2329;
      border-radius: 50%;
    }

    .icon-gear::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1.5px solid #1f2329;
      border-radius: 50%;
      background: #fff;
    }

    .icon-gear::after {
      content: "";
      position: absolute;
      left: 5px;
      top: -3px;
      width: 2px;
      height: 18px;
      background: #1f2329;
      box-shadow: -5px 5px 0 -1px #1f2329, 5px 5px 0 -1px #1f2329;
      transform: rotate(45deg);
      z-index: -1;
    }

    .table-wrap {
      margin: 0 15px 0 19px;
      border: 1px solid #eceff3;
      height: 173px;
      overflow: hidden;
      background: #fff;
    }

    .table-wrap.has-data {
      height: 151px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .table-wrap.has-data th,
    .table-wrap.has-data td {
      white-space: nowrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      height: 37px;
      padding: 0 10px;
      text-align: left;
      font-weight: 600;
      color: #262b33;
      border-right: 1px solid #edf0f5;
      border-bottom: 1px solid #edf0f5;
      background: #fff;
    }

    th:first-child {
      width: 25px;
      padding: 0;
      text-align: center;
    }

    th:nth-child(2) { width: 82px; }
    th:nth-child(3) { width: 139px; }
    th:nth-child(4) { width: 140px; }
    th:nth-child(5) { width: 88px; }
    th:nth-child(6) { width: 139px; }
    th:nth-child(7) { width: 123px; }
    th:nth-child(8) { width: 139px; }
    th:nth-child(9) { width: 122px; }
    th:nth-child(10) { width: 143px; }
    th:nth-child(11) { width: 79px; border-right: 0; }

    .data-table {
      min-width: 1084px;
    }

    .state-pending {
      min-width: 1180px;
    }

    .state-approved {
      min-width: 1420px;
    }

    .state-rejected {
      min-width: 1220px;
    }

    .data-table th,
    .data-table td {
      border-right: 1px solid #edf0f5;
      border-bottom: 1px solid #edf0f5;
      background: #fff;
    }

    .data-table th {
      height: 57px;
      padding: 0 8px;
      line-height: 18px;
      vertical-align: middle;
    }

    .data-table td {
      height: 89px;
      padding: 0 8px;
      color: #2b3038;
      line-height: 20px;
      vertical-align: middle;
    }

    .state-pending th,
    .state-pending td {
      height: 56px;
    }

    .state-pending th:first-child,
    .state-pending td:first-child {
      width: 32px;
      padding: 0;
      text-align: center;
    }

    .state-pending th:nth-child(2) { width: 102px; }
    .state-pending th:nth-child(3) { width: 140px; }
    .state-pending th:nth-child(4) { width: 140px; }
    .state-pending th:nth-child(5) { width: 102px; }
    .state-pending th:nth-child(6) { width: 140px; }
    .state-pending th:nth-child(7) { width: 162px; }
    .state-pending th:nth-child(8) { width: 140px; }
    .state-pending th:nth-child(9) { width: 154px; }
    .state-pending th:nth-child(10) { width: 140px; }
    .state-pending th:nth-child(11) {
      width: 104px;
      border-right: 0;
    }

    .state-pending td:nth-child(11) {
      border-right: 0;
    }

    .state-approved th:first-child,
    .state-rejected th:first-child {
      width: 80px;
      padding: 0 8px;
      text-align: left;
    }

    .state-approved th:nth-child(2) { width: 92px; }
    .state-approved th:nth-child(3) { width: 76px; }
    .state-approved th:nth-child(4) { width: 104px; }
    .state-approved th:nth-child(5) { width: 102px; }
    .state-approved th:nth-child(6) { width: 102px; }
    .state-approved th:nth-child(7) { width: 112px; }
    .state-approved th:nth-child(8) { width: 102px; }
    .state-approved th:nth-child(9) { width: 119px; }
    .state-approved th:nth-child(10) { width: 102px; }
    .state-approved th:nth-child(11) {
      width: 80px;
      border-right: 1px solid #edf0f5;
    }
    .state-approved th:nth-child(12) { width: 116px; }
    .state-approved th:nth-child(13) {
      width: 102px;
      border-right: 1px solid #edf0f5;
    }
    .state-approved th:nth-child(14) {
      width: 80px;
      border-right: 0;
    }

    .state-approved td:nth-child(14) {
      border-right: 0;
    }

    .state-rejected th:nth-child(2) { width: 66px; }
    .state-rejected th:nth-child(3) { width: 82px; }
    .state-rejected th:nth-child(4) { width: 88px; }
    .state-rejected th:nth-child(5) { width: 88px; }
    .state-rejected th:nth-child(6) { width: 99px; }
    .state-rejected th:nth-child(7) { width: 88px; }
    .state-rejected th:nth-child(8) { width: 99px; }
    .state-rejected th:nth-child(9) { width: 66px; }
    .state-rejected th:nth-child(10) { width: 88px; }
    .state-rejected th:nth-child(11) {
      width: 99px;
      border-right: 1px solid #edf0f5;
    }
    .state-rejected th:nth-child(12) { width: 88px; }
    .state-rejected th:nth-child(13) { width: 66px; border-right: 0; }

    .item-badge {
      display: inline-block;
      height: 18px;
      min-width: 28px;
      padding: 0 5px;
      border: 1px solid #b8ec8d;
      background: #f2ffe9;
      color: #45a500;
      line-height: 16px;
      text-align: center;
    }

    .success-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: #19c840;
      vertical-align: 1px;
    }

    .pending-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: #1689ff;
      vertical-align: 1px;
    }

    .reject-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: #ff4d4f;
      vertical-align: 1px;
    }

    .status-text {
      color: #606875;
    }

    .link-action {
      color: #1689ff;
      text-decoration: none;
      font-weight: 400;
    }

    .pager {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      height: 45px;
      padding-right: 14px;
      color: #b8bec8;
    }

    .pager.visible {
      display: flex;
    }

    .page-arrow {
      font-size: 16px;
      line-height: 1;
    }

    .page-num {
      width: 20px;
      height: 20px;
      border: 1px solid #1689ff;
      border-radius: 2px;
      color: #1689ff;
      line-height: 18px;
      text-align: center;
      background: #fff;
    }

    .page-size {
      height: 22px;
      min-width: 70px;
      padding: 0 17px 0 8px;
      border: 1px solid #dfe2e8;
      color: #202632;
      line-height: 20px;
      background: #fff;
      position: relative;
    }

    .page-size::after {
      content: "";
      position: absolute;
      right: 7px;
      top: 7px;
      width: 6px;
      height: 6px;
      border-right: 1px solid #aeb4bd;
      border-bottom: 1px solid #aeb4bd;
      transform: rotate(45deg);
    }

    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, .44);
    }

    .modal-mask.open {
      display: block;
    }

    .drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 650px;
      min-height: 100vh;
      background: #fff;
      box-shadow: -2px 0 10px rgba(0, 0, 0, .14);
    }

    .modal-mask[data-type="create"] .drawer {
      width: 768px;
    }

    .drawer-head {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 17px;
      border-bottom: 1px solid #f0f1f4;
      font-size: 14px;
      color: #1f2329;
    }

    .drawer-close {
      margin-left: auto;
      width: 18px;
      height: 18px;
      border: 0;
      background: transparent;
      color: #8b929c;
      font-size: 22px;
      line-height: 18px;
      cursor: pointer;
    }

    .drawer-body {
      padding: 18px 16px 86px;
    }

    .section-title {
      margin: 10px 0 12px;
      color: #1689ff;
      font-weight: 500;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #edf0f5;
      border-left: 1px solid #edf0f5;
    }

    .info-cell {
      display: grid;
      grid-template-columns: 108px 1fr;
      min-height: 30px;
      border-right: 1px solid #edf0f5;
      border-bottom: 1px solid #edf0f5;
      background: #fff;
    }

    .info-label {
      padding: 8px 10px;
      text-align: right;
      font-weight: 600;
      background: #fcfcfd;
    }

    .info-value {
      padding: 8px 10px;
      min-width: 0;
    }

    .blue-tag,
    .orange-tag,
    .user-tag {
      display: inline-block;
      height: 18px;
      padding: 0 6px;
      border-radius: 1px;
      line-height: 16px;
      vertical-align: middle;
    }

    .blue-tag {
      border: 1px solid #94c4ff;
      background: #eef6ff;
      color: #1689ff;
    }

    .orange-tag {
      margin-right: 4px;
      border: 1px solid #ffc49d;
      background: #fff6ef;
      color: #ff6f1a;
    }

    .user-tag {
      margin-right: 3px;
      border: 1px solid #dfe2e8;
      background: #fafafa;
      color: #303641;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-bottom: 14px;
    }

    .mini-table th,
    .mini-table td {
      height: 30px;
      padding: 0 8px;
      border: 1px solid #edf0f5;
      text-align: left;
      background: #fff;
      white-space: normal;
    }

    .mini-table th {
      font-weight: 600;
    }

    .detail-note {
      min-height: 44px;
      padding: 9px 10px;
      border: 1px solid #edf0f5;
      background: #fcfcfd;
      line-height: 20px;
    }

    .summary-strip {
      display: flex;
      gap: 12px;
      margin: 4px 0 14px;
    }

    .summary-item {
      width: 116px;
      height: 54px;
      padding: 8px 10px;
      border: 1px solid #edf0f5;
      background: #fcfcfd;
    }

    .summary-label {
      color: #8b929c;
      line-height: 16px;
    }

    .summary-value {
      margin-top: 4px;
      color: #1f2329;
      font-size: 14px;
      font-weight: 600;
    }

    .drawer-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px;
      border-top: 1px solid #edf0f5;
      background: #fff;
    }

    .footer-field {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      width: calc(100% - 115px);
    }

    .required {
      color: #ff3b30;
    }

    .drawer-input,
    .drawer-select,
    .drawer-textarea {
      height: 24px;
      border: 1px solid #dfe2e8;
      background: #fff;
      padding: 0 8px;
      color: #1f2329;
      font-family: inherit;
      font-size: 12px;
    }

    .drawer-input {
      flex: 1;
    }

    .drawer-textarea {
      width: 100%;
      height: 42px;
      padding: 7px 8px;
      resize: none;
    }

    .small-note {
      color: #b2b8c2;
    }

    .danger-btn,
    .ok-btn,
    .plain-btn {
      height: 28px;
      min-width: 50px;
      border: 1px solid transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .ok-btn {
      background: #1689ff;
      border-color: #1689ff;
    }

    .danger-btn {
      background: #ff4d4f;
      border-color: #ff4d4f;
    }

    .plain-btn {
      color: #202632;
      background: #fff;
      border-color: #dfe2e8;
    }

    .edit-form {
      padding: 4px 32px 0 82px;
    }

    .form-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .form-label {
      width: 58px;
      text-align: right;
      color: #1f2329;
      flex: 0 0 auto;
    }

    .seg {
      display: inline-flex;
      height: 26px;
    }

    .seg span {
      min-width: 84px;
      padding: 0 10px;
      border: 1px solid #dfe2e8;
      border-left: 0;
      line-height: 24px;
      text-align: center;
      background: #fff;
    }

    .seg span:first-child {
      border-left: 1px solid #dfe2e8;
    }

    .seg .on {
      color: #fff;
      border-color: #1689ff;
      background: #1689ff;
    }

    .wide-field {
      width: 328px;
    }

    .num-field {
      width: 68px;
    }

    .form-table-area {
      width: 520px;
      margin: 0 0 16px 58px;
    }

    .create-form {
      padding: 20px 16px 0 30px;
    }

    .create-form .form-line {
      margin-bottom: 30px;
      gap: 10px;
    }

    .create-form .form-label {
      width: 76px;
    }

    .create-form .form-label.required-label {
      width: 76px;
    }

    .create-user-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .create-form .seg span {
      min-width: 92px;
      height: 28px;
      line-height: 26px;
    }

    .create-user-input {
      width: 300px;
      height: 32px;
    }

    .create-field {
      height: 30px;
    }

    .purchase-select {
      width: 270px;
    }

    .item-select {
      width: 180px;
    }

    .create-num {
      width: 82px;
      flex: 0 0 auto;
    }

    .create-table-area {
      width: 100%;
      margin: -14px 0 30px;
      padding-left: 0;
    }

    .create-table-area .mini-table {
      margin-bottom: 0;
    }

    .create-table-area .mini-table th {
      background: #fafafa;
    }

    .create-table-area .mini-table td {
      height: 34px;
      text-align: center;
      color: #b5bbc5;
    }

    .create-textarea-line {
      align-items: flex-start;
      margin-bottom: 0;
    }

    .create-reason {
      width: 610px;
      height: 48px;
      flex: 0 0 auto;
    }

    .modal-mask[data-type="create"] .drawer-body {
      padding: 0 16px 86px;
    }

    .modal-mask[data-type="create"] .drawer-footer {
      height: 48px;
    }

    .delete-link {
      color: #ff4d4f;
      text-decoration: none;
    }

    .checkbox {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 1px solid #e0e3e8;
      background: #fafbfc;
      vertical-align: middle;
    }

    .empty-row {
      position: relative;
      height: 134px;
    }

    .empty-state {
      position: absolute;
      left: 50%;
      top: 49px;
      transform: translateX(-50%);
      width: 96px;
      text-align: center;
      color: #b5bbc5;
    }

    .empty-icon {
      position: relative;
      width: 36px;
      height: 27px;
      margin: 0 auto 8px;
      border: 1px solid #d9dde4;
      border-radius: 2px;
      background: #fff;
    }

    .empty-icon::before {
      content: "";
      position: absolute;
      left: 7px;
      top: -10px;
      width: 20px;
      height: 12px;
      border: 1px solid #d9dde4;
      border-bottom: 0;
      transform: perspective(18px) rotateX(28deg);
      background: #fff;
    }

    .empty-icon::after {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: 12px;
      height: 1px;
      background: #d9dde4;
    }

    .feedback {
      position: fixed;
      right: 0;
      top: 665px;
      width: 31px;

        return `<th>${label}</th>`;
      }).join("");

      const rows = state.rows || [state.row];

        </table>
        <div class="section-title">批量审核备注</div>
        <textarea class="drawer-textarea" placeholder="请输入批量审核备注，最多50个汉字"></textarea>
      `;
    }

    function editFooter() {
      return `
        <button class="plain-btn" type="button">重 置</button>
        <button class="ok-btn" type="button">提 交</button>
      `;
    }

    function detailFooter() {
      return `<button class="plain-btn" type="button" data-action-close="true">关 闭</button>`;
    }

    function batchFooter() {
      return `
        <button class="ok-btn" type="button">全部通过</button>
        <button class="danger-btn" type="button">全部拒绝</button>
      `;
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        renderTable(tab.dataset.state);
      });
    });

    document.querySelector(".btn.primary").addEventListener("click", () => openModal("create"));
    batchButton.addEventListener("click", () => openModal("batch"));

    tableWrap.addEventListener("click", (event) => {
      const action = event.target.dataset.action;
      if (!action) return;
      openModal(action, event.target.dataset.id, event.target.dataset.state);
    });

    modalFooter.addEventListener("click", (event) => {
      if (event.target.dataset.actionClose) closeModal();
    });

    modalClose.addEventListener("click", closeModal);
    modalMask.addEventListener("click", (event) => {
      if (event.target === modalMask) closeModal();
    });

    renderTable("pending");
  </script>
</body>
</html>
