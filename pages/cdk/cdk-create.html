<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新建兑换码原型</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#1f2d3d;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:13px}
button,input,select,textarea{font:inherit}
.page{position:relative;min-width:1180px;min-height:100vh;padding-bottom:62px;background:#eef2f6}
.content{position:relative;z-index:1;background:#eef2f6}
.section{position:relative;margin-bottom:10px;background:#fff;overflow:hidden}
.section-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #dfe3e9}
.section-title{font-size:15px;font-weight:700}
.required-tip{font-weight:700;color:#1f2d3d}
.required-tip:before,.req:before{content:"*";color:#f04d5d;margin-right:3px}
.form{padding:18px 24px 34px 88px}
.row{min-height:43px;display:grid;grid-template-columns:118px minmax(0,1fr);column-gap:12px;align-items:flex-start;margin-bottom:14px}
.row:last-child{margin-bottom:0}
.label{width:118px;height:32px;padding-top:7px;text-align:right;white-space:nowrap}
.req{color:#1f2d3d}
.field{display:block;min-height:32px}
.input,.select,.textarea{height:32px;border:1px solid #d9dee8;background:#fff;color:#1f2d3d;padding:0 10px;outline:0}
.input{width:176px}.select{width:176px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9aa4b3 50%),linear-gradient(135deg,#9aa4b3 50%,transparent 50%);background-position:calc(100% - 17px) 13px,calc(100% - 12px) 13px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.long{width:294px}.qty{width:112px}.date{width:374px}.remark{width:100%;max-width:1120px;min-width:0}.textarea{height:32px;resize:none;line-height:30px}
.muted{color:#8b95a5;margin-left:10px;line-height:32px}
.addon{margin-left:10px;color:#1f2d3d;line-height:32px}
.btn{height:32px;padding:0 16px;border:1px solid #d9dee8;background:#fff;color:#1f2d3d;border-radius:2px;cursor:pointer}
.btn.primary{border-color:#168cff;background:#168cff;color:#fff}
.btn.danger{border-color:#ff4d4f;background:#ff4d4f;color:#fff}
.btn:disabled{color:#b8c0cc;background:#f4f5f7;cursor:not-allowed}
.seg{display:inline-flex;vertical-align:middle}
.seg button{height:32px;min-width:44px;padding:0 12px;border:1px solid #d9dee8;border-left:0;background:#fff;color:#1f2d3d;cursor:pointer}
.seg button:first-child{border-left:1px solid #d9dee8}
.seg button.active{border-color:#168cff;color:#168cff;background:#f4faff;position:relative;z-index:1}
.hint{margin-top:4px;color:#8b95a5;font-size:12px}
.code-preview{height:24px;color:#1f2d3d;line-height:24px}
.hide{display:none!important}
.range{display:flex;align-items:center;gap:8px}
.range .input{width:74px}
.stack{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.inline-line{display:flex;align-items:center;gap:8px;min-height:32px;white-space:nowrap}
.reward-row{display:flex;gap:10px}
.reward-row .select{width:294px}
.reward-row .qty{width:112px}
.tag{display:inline-flex;align-items:center;height:22px;margin-top:8px;padding:0 8px;background:#1da7ff;color:#fff;border-radius:2px}
.tag:after{content:"×";margin-left:8px}
.batch-panel{width:100%;max-width:1040px;border:1px solid #edf0f5;background:#fff}
.batch-table-wrap{overflow-x:auto}
.batch-table{width:100%;min-width:930px;border-collapse:collapse;table-layout:fixed}
.batch-table th,.batch-table td{height:48px;padding:8px;border-right:1px solid #edf0f5;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:middle;background:#fff}
.batch-table th{height:38px;background:#fbfcfd;font-weight:700}
.batch-table th:last-child,.batch-table td:last-child{border-right:0}
.batch-table tr:last-child td{border-bottom:0}
.batch-id{color:#8b95a5}
.mini-input{width:100%;height:30px;border:1px solid #d9dee8;padding:0 8px;outline:0}
.code-cell{display:flex;align-items:center;gap:8px}
.code-cell .mini-input{flex:1;min-width:0}
.refresh-btn{width:28px;height:28px;border:0;background:#fff;color:#1f2d3d;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.refresh-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.link-btn{border:0;background:transparent;color:#168cff;padding:0;cursor:pointer}
.link-btn.danger-link{color:#f04d5d}
.batch-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
.batch-actions .divider{color:#d9dee8}
.batch-mode .seg button{height:30px;min-width:50px;padding:0 10px}
.error-text{min-height:20px;padding:0 12px 8px;color:#f04d5d}
.locator{position:fixed;right:45px;top:100px;z-index:2;width:112px;padding:16px 0;background:#fff;box-shadow:0 2px 10px rgba(31,45,61,.12)}
.loc-item{height:34px;display:flex;align-items:center;padding-left:18px;color:#657287}
.loc-dot{width:8px;height:8px;margin-right:14px;border:1px solid #d9dee8;border-radius:50%;background:#fff}
.loc-item.active{color:#168cff;font-weight:700}
.loc-item.active .loc-dot{border-color:#168cff}
.loc-line{width:1px;height:22px;margin-left:21px;background:#e6eaf0}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:4;height:54px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 16px;border-top:1px solid #dfe3e9;background:#fff}
.save{color:#1f2d3d}
.feedback{position:fixed;right:0;top:246px;z-index:5;width:28px;height:52px;border-radius:8px 0 0 8px;background:#092e61;color:#fff;text-align:center;font-size:12px;box-shadow:0 2px 9px rgba(4,26,59,.35)}
.feedback span{display:block;padding-top:9px;line-height:15px;transform:scale(.88)}
.toast{display:none;position:fixed;left:50%;top:76px;z-index:8;transform:translateX(-50%);height:34px;padding:0 18px;border-radius:3px;background:rgba(31,45,61,.92);color:#fff;line-height:34px}
.toast.show{display:block}
@media (max-width:700px){
  .page{min-width:0;padding-bottom:62px}
  .form{padding:14px 28px 26px}
  .section-head{height:40px}
  .row{display:block;margin-bottom:16px}
  .label{width:auto;text-align:left;height:26px;padding-top:0}
  .field{display:block}
  .input,.select,.long,.qty,.date,.remark,.textarea{width:100%;min-width:0}
  .reward-row{display:grid;grid-template-columns:1fr 88px;gap:8px}
  .reward-row .select,.reward-row .qty{width:100%}
  .reward-row .btn{grid-column:auto;padding:0}
  .range{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px}
  .range .input{width:100%}
  .inline-line{white-space:normal;flex-wrap:wrap}
  .inline-line .long{width:100%}
  .seg button{min-width:42px;padding:0 10px}
  .batch-panel{max-width:none}
  .batch-table{min-width:900px}
  .locator{display:none}
  .footer{height:56px;padding:0 12px}
}
</style>
</head>
<body>
<div class="page">
  <main class="content">
    <section class="section" id="basic">
      <div class="section-head">
        <div class="section-title">基础信息</div>
        <div class="required-tip">为必填项</div>
      </div>
      <div class="form">
        <div class="row">
          <label class="label req">兑换包名称:</label>
          <div class="field"><input class="input" value="CDK0612自动走查"></div>
        </div>
        <div class="row">
          <label class="label req">兑换码分类:</label>
          <div class="field">
            <select class="select"><option>币</option><option>测试111</option><option>客服</option></select>
          </div>
        </div>
        <div class="row">
          <label class="label">互斥兑换包:</label>
          <div class="field"><input class="input long" placeholder="请输入兑换包名称或分类"></div>
        </div>
        <div class="row">
          <label class="label req">附件物品:</label>
          <div class="field reward-row">
            <select class="select"><option>请选择或输入物品名称（ID）</option><option>VIP经验药剂</option><option>紫晶灵石</option></select>
            <input class="input qty" placeholder="请输入数量">
            <button class="btn" disabled>添 加</button>
            <button class="btn">清 空</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="condition">
      <div class="section-head">
        <div class="section-title">可兑换条件</div>
        <div class="required-tip">为必填项</div>
      </div>
      <div class="form">
        <div class="row">
          <label class="label req">区服:</label>
          <div class="field">
            <div class="seg"><button class="active">所有区服</button><button>选择区服</button></div>
            <div class="hint">选择所有区服，此后新开的区服也能接收到该兑换码</div>
          </div>
        </div>
        <div class="row">
          <label class="label req">渠道:</label>
          <div class="field">
            <div class="seg"><button class="active">所有渠道</button><button>选择渠道</button></div>
            <div class="hint">选择所有渠道，此后新开的渠道也能接收到该兑换码</div>
          </div>
        </div>
        <div class="row">
          <label class="label req">角色等级:</label>
          <div class="field">
            <div class="seg"><button>不限</button><button class="active">自定义</button></div>
            <div class="range" style="margin-top:8px"><input class="input" placeholder="请输入最小值"><span>~</span><input class="input" placeholder="请输入最大值"></div>
          </div>
        </div>
        <div class="row">
          <label class="label req">角色充值总额:</label>
          <div class="field">
            <div class="seg"><button>不限</button><button class="active">自定义</button></div>
            <div class="range" style="margin-top:8px"><input class="input" placeholder="请输入最小值"><span>~</span><input class="input" placeholder="请输入最大值"><span>美元</span></div>
          </div>
        </div>
        <div class="row">
          <label class="label req">兑换次数:</label>
          <div class="field stack">
            <div class="seg"><button class="active">按账号</button><button>按角色</button></div>
            <div class="seg"><button>总计</button><button class="active">按天</button><button>按周</button><button>按月</button></div>
            <div class="inline-line">每 <input class="input" style="width:96px" placeholder="请输入天数"> 天，可兑换 <input class="input" style="width:96px" value="1"> 次</div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="code">
      <div class="section-head">
        <div class="section-title">兑换码信息</div>
        <div class="required-tip">为必填项</div>
      </div>
      <div class="form">
        <div class="row">
          <label class="label req">是否为通用码:</label>
          <div class="field"><div class="seg" id="commonSeg"><button class="active" data-common="yes">是</button><button data-common="no">否</button></div></div>
        </div>
        <div class="row common-only">
          <label class="label req">通用码批次:</label>
          <div class="field">
            <div class="batch-panel">
              <div class="batch-table-wrap">
                <table class="batch-table">
                  <colgroup>
                    <col style="width:120px">
                    <col style="width:160px">
                    <col style="width:250px">
                    <col style="width:130px">
                    <col style="width:170px">
                    <col style="width:100px">
                  </colgroup>
                  <thead>
                    <tr>
                      <th>批次ID</th>
                      <th>通用码生成方式</th>
                      <th>通用码</th>
                      <th>可兑换次数</th>
                      <th>备注</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="batchRows"></tbody>
                </table>
              </div>
              <div class="error-text" id="batchError"></div>
            </div>
          </div>
        </div>
        <div class="row exclusive-only hide">
          <label class="label req">长度:</label>
          <div class="field"><div class="inline-line"><input class="input" style="width:82px" value="8"><span class="muted">设置长度需在游戏支持范围内</span></div></div>
        </div>
        <div class="row exclusive-only hide">
          <label class="label req">数量:</label>
          <div class="field"><input class="input" style="width:82px" value="1"></div>
        </div>
        <div class="row">
          <label class="label req">关联标签:</label>
          <div class="field"><div class="seg"><button>是</button><button class="active">否</button></div></div>
        </div>
        <div class="row">
          <label class="label req">有效时间:</label>
          <div class="field"><input class="input date" value="2026-06-12 10:07:23        →    2026-06-12 10:07:23"></div>
        </div>
        <div class="row">
          <label class="label">备注:</label>
          <div class="field"><textarea class="textarea remark"></textarea></div>
        </div>
      </div>
    </section>
  </main>

  <aside class="locator" aria-label="快速定位">
    <div class="loc-item active"><span class="loc-dot"></span>基础信息</div>
    <div class="loc-line"></div>
    <div class="loc-item"><span class="loc-dot"></span>可兑换条件</div>
    <div class="loc-line"></div>
    <div class="loc-item"><span class="loc-dot"></span>兑换码信息</div>
  </aside>
</div>

<div class="feedback"><span>意见<br>反馈</span></div>
<footer class="footer">
  <span class="save">实时保存：2026-06-12 10:09:25</span>
  <button class="btn primary" id="submit">提交审核</button>
</footer>
<div class="toast" id="toast">已提交审核</div>

<script>
let isCommonMode = true;
let batches = [{ id: 1, mode: "custom", code: "", limit: "", remark: "" }];

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1500);
}

function randomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let value = "";
  for (let i = 0; i < 8; i += 1) value += chars[Math.floor(Math.random() * chars.length)];
  return value;
}

function renderBatches() {
  const tbody = document.getElementById("batchRows");
  tbody.innerHTML = "";
  batches.forEach((batch, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="batch-id">提交后生成</span></td>
      <td>
        <div class="seg batch-mode" data-index="${index}">
          <button type="button" data-mode="random" class="${batch.mode === "random" ? "active" : ""}">随机</button>
          <button type="button" data-mode="custom" class="${batch.mode === "custom" ? "active" : ""}">自定义</button>
        </div>
      </td>
      <td>
        <div class="code-cell">
          <input class="mini-input batch-code" data-index="${index}" value="${batch.code}" placeholder="${batch.mode === "random" ? "" : "请输入通用码"}" ${batch.mode === "random" ? "readonly" : ""}>
          ${batch.mode === "random" ? `<button class="refresh-btn generate-code" type="button" data-index="${index}" title="刷新通用码" aria-label="刷新通用码"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.36 6.36"/><path d="M3 12A9 9 0 0 1 18.36 5.64"/><path d="M18 2v4h-4"/><path d="M6 22v-4h4"/></svg></button>` : ""}
        </div>
      </td>
      <td><input class="mini-input batch-limit" data-index="${index}" value="${batch.limit}" placeholder="请输入次数"></td>
      <td><input class="mini-input batch-remark" data-index="${index}" value="${batch.remark}" placeholder="请输入备注"></td>
      <td><div class="batch-actions"><button class="link-btn add-batch-row" type="button">新增</button><span class="divider">|</span><button class="link-btn danger-link delete-batch" type="button" data-index="${index}">删除</button></div></td>
    `;
    tbody.appendChild(tr);
  });
}

function validateBatches() {
  const error = document.getElementById("batchError");
  error.textContent = "";
  if (!batches.length) {
    error.textContent = "至少需要配置1个通用码批次";
    return false;
  }
  const codes = new Set();
  for (let i = 0; i < batches.length; i += 1) {
    const item = batches[i];
    const rowNo = i + 1;
    if (!item.code.trim()) {
      error.textContent = item.mode === "random" ? `第${rowNo}行请先生成通用码` : `第${rowNo}行请输入通用码`;
      return false;
    }
    if (!/^[1-9]\d*$/.test(String(item.limit).trim())) {
      error.textContent = `第${rowNo}行可兑换次数需填写正整数`;
      return false;
    }
    const key = item.code.trim().toLowerCase();
    if (codes.has(key)) {
      error.textContent = `通用码“${item.code.trim()}”重复，请调整`;
      return false;
    }
    codes.add(key);
  }
  return true;
}

document.querySelectorAll(".locator .loc-item").forEach((item,index)=>{
  item.addEventListener("click",()=>{
    const ids=["basic","condition","code"];
    document.getElementById(ids[index]).scrollIntoView({behavior:"smooth",block:"start"});
  });
});

document.getElementById("batchRows").addEventListener("click", event => {
  const target = event.target;
  const modeButton = target.closest(".batch-mode button");
  const generateButton = target.closest(".generate-code");
  const addButton = target.closest(".add-batch-row");
  const deleteButton = target.closest(".delete-batch");
  if (modeButton) {
    const index = Number(modeButton.parentElement.dataset.index);
    batches[index].mode = modeButton.dataset.mode;
    batches[index].code = modeButton.dataset.mode === "random" ? randomCode() : "";
    renderBatches();
  }
  if (generateButton) {
    const index = Number(generateButton.dataset.index);
    batches[index].code = randomCode();
    renderBatches();
  }
  if (addButton) {
    batches.push({ id: Date.now(), mode: "custom", code: "", limit: "", remark: "" });
    renderBatches();
  }
  if (deleteButton) {
    if (batches.length === 1) {
      document.getElementById("batchError").textContent = "至少保留1个通用码批次";
      return;
    }
    batches.splice(Number(deleteButton.dataset.index), 1);
    renderBatches();
  }
});

document.getElementById("batchRows").addEventListener("input", event => {
  const target = event.target;
  const index = Number(target.dataset.index);
  if (target.matches(".batch-code")) batches[index].code = target.value;
  if (target.matches(".batch-limit")) batches[index].limit = target.value;
  if (target.matches(".batch-remark")) batches[index].remark = target.value;
  document.getElementById("batchError").textContent = "";
});

document.getElementById("submit").addEventListener("click",()=>{
  if (isCommonMode && !validateBatches()) return;
  showToast("已提交审核");
});

document.querySelectorAll(".seg").forEach(group=>{
  if (group.classList.contains("batch-mode")) return;
  group.addEventListener("click",e=>{
    if(e.target.tagName!=="BUTTON")return;
    [...group.children].forEach(btn=>btn.classList.remove("active"));
    e.target.classList.add("active");
    if(group.id==="commonSeg"){
      const nextIsCommon=e.target.dataset.common==="yes";
      if (!nextIsCommon && isCommonMode && batches.some(item => item.code || item.limit || item.remark)) {
        const confirmed = window.confirm("切换为非通用码将清空已填写的通用码批次配置，是否继续？");
        if (!confirmed) {
          [...group.children].forEach(btn=>btn.classList.toggle("active", btn.dataset.common === "yes"));
          return;
        }
        batches = [{ id: 1, mode: "custom", code: "", limit: "", remark: "" }];
        renderBatches();
      }
      isCommonMode = nextIsCommon;
      document.querySelectorAll(".common-only").forEach(el=>el.classList.toggle("hide",!isCommonMode));
      document.querySelectorAll(".exclusive-only").forEach(el=>el.classList.toggle("hide",isCommonMode));
    }
  });
});

renderBatches();
</script>
</body>
</html>
