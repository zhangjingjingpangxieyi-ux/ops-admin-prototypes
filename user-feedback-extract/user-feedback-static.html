  function stopSpinners(){document.querySelectorAll('.ant-spin-spinning,.ant-spin-show-text').forEach(el=>el.classList.remove('ant-spin-spinning','ant-spin-show-text'));}
  function normalizeTables(){const table=$('feedbackTable');table.querySelectorAll('th,td').forEach(cell=>{cell.title=cell.innerText.trim();});}
  function showToast(message){const toast=$('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800);}
  function filteredRows(){if(!state.demo)return[];const id=$('recordId').value.trim().toLowerCase();const queryField=$('recordField').value;const status=$('status').value;const type=$('feedbackType').value;const summary=$('summary').value.trim().toLowerCase();const description=$('description').value.trim().toLowerCase();return sampleRows.filter(row=>(!id||String(row[queryField]||'').toLowerCase().includes(id))&&(status==='所有类型'||row.status===status)&&(type==='反馈类型'||row.type===type)&&(!summary||row.summary.toLowerCase().includes(summary))&&(!description||row.description.toLowerCase().includes(description)));}
  function renderRows(){const rows=filteredRows();$('emptyState').style.display=rows.length?'none':'grid';$('feedbackTable').style.display=rows.length?'table':'none';$('resultCount').textContent='共 '+rows.length+' 条';$('tableBody').innerHTML=rows.map(row=>'<tr><td><input class="row-check" type="checkbox" value="'+esc(row.id)+'" '+(state.selected.has(row.id)?'checked':'')+' aria-label="选择 '+esc(row.id)+'"></td>'+columns.map(([key])=>'<td data-col="'+key+'">'+(key==='status'?'<span class="tag '+(row.status==='正在处理'?'processing':'')+'">'+esc(row[key])+'</span>':esc(row[key]))+'</td>').join('')+'<td><button class="link detail-btn" data-id="'+esc(row.id)+'">详情</button></td></tr>').join('');applyColumns();wireRowControls();normalizeTables();}
  function wireRowControls(){document.querySelectorAll('.row-check').forEach(box=>box.addEventListener('change',()=>{box.checked?state.selected.add(box.value):state.selected.delete(box.value);syncSelection();}));document.querySelectorAll('.detail-btn').forEach(btn=>btn.addEventListener('click',()=>openDetail(btn.dataset.id)));}
  function syncSelection(){const count=state.selected.size;['batchHandle','batchDelete','batchType'].forEach(id=>$(id).disabled=!count);$('selectAll').checked=sampleRows.length>0&&count===sampleRows.length;}
  function openDetail(id){const row=sampleRows.find(item=>item.id===id);if(!row)return;$('drawerBody').innerHTML='<div class="drawer-note">该详情使用本地原型示例数据，不连接后台接口。</div><dl class="desc">'+columns.map(([key,label])=>'<dt>'+esc(label)+'</dt><dd>'+esc(row[key])+'</dd>').join('')+'</dl>';$('detailOverlay').classList.add('open');}
  function closeDetail(){$('detailOverlay').classList.remove('open');}
  function renderColumnList(){$('columnList').innerHTML=columns.map(([key,label])=>'<label><input type="checkbox" data-column="'+key+'" '+(state.hidden.has(key)?'':'checked')+'>'+esc(label)+'</label>').join('');$('columnList').querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{input.checked?state.hidden.delete(input.dataset.column):state.hidden.add(input.dataset.column);applyColumns();}));}
  function applyColumns(){columns.forEach(([key])=>document.querySelectorAll('[data-col="'+key+'"]').forEach(el=>el.style.display=state.hidden.has(key)?'none':''));}
  function exportCsv(){const rows=filteredRows();const csv=[columns.map(([,label])=>label),...rows.map(row=>columns.map(([key])=>row[key]))].map(line=>line.map(value=>'"'+String(value??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='user-feedback-prototype.csv';link.click();URL.revokeObjectURL(url);showToast('已导出当前原型数据');}
  function wireActiveControls(){
    $('expandBtn').addEventListener('click',()=>{state.expanded=!state.expanded;$('filters').classList.toggle('expanded',state.expanded);$('expandBtn').textContent=state.expanded?'收 起':'展 开';$('expandBtn').setAttribute('aria-expanded',String(state.expanded));});
    $('demoSwitch').addEventListener('click',()=>{state.demo=!state.demo;$('demoSwitch').setAttribute('aria-checked',String(state.demo));state.selected.clear();renderRows();syncSelection();});
    $('queryBtn').addEventListener('click',()=>{state.selected.clear();renderRows();syncSelection();showToast('本地筛选已更新');});
    $('selectAll').addEventListener('change',event=>{state.selected.clear();if(event.target.checked)filteredRows().forEach(row=>state.selected.add(row.id));renderRows();syncSelection();});
    $('densityBtn').addEventListener('click',()=>{state.compact=!state.compact;document.documentElement.style.setProperty('--row-height',state.compact?'38px':'48px');document.querySelectorAll('.feedback-table th,.feedback-table td').forEach(el=>el.style.height=state.compact?'38px':'48px');$('densityBtn').setAttribute('aria-pressed',String(state.compact));});
    $('columnBtn').addEventListener('click',event=>{event.stopPropagation();$('columnPopover').classList.toggle('open');});
    $('exportBtn').addEventListener('click',exportCsv);$('drawerClose').addEventListener('click',closeDetail);$('detailOverlay').addEventListener('click',event=>{if(event.target===$('detailOverlay'))closeDetail();});
    document.addEventListener('click',event=>{if(!$('columnPopover').contains(event.target)&&event.target!==$('columnBtn'))$('columnPopover').classList.remove('open');});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeDetail();$('columnPopover').classList.remove('open');}});
    ['batchHandle','batchDelete','batchType'].forEach(id=>$(id).addEventListener('click',()=>showToast($(id).textContent+'仅作本地交互演示')));
    document.querySelectorAll('a[href]').forEach(link=>link.addEventListener('click',event=>event.preventDefault()));
  }
  renderColumnList();renderRows();wireActiveControls();stopSpinners();
</script>
