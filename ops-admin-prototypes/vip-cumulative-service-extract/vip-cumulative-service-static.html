  e.preventDefault();
  const mode=positioning(), tiers=selectedTiers(), display=document.querySelector('input[name="display"]:checked').value;
  const min=$('min').value===''?0:Number($('min').value),max=$('max').value===''?Infinity:Number($('max').value);
  if(min>max)return toast('最小累充不能大于最大累充');
  if(mode==='custom'&&$('high').value&&Number($('high').value)<Number($('vip').value))return toast('高V累充门槛不能低于VIP累充门槛');
  if(mode==='config'&&!tiers.length)return toast('请至少选择一个VIP档位，或选择全部');
  if(!$('date').value)return toast('请选择筛选日期');
  const end=new Date($('date').value+'T00:00:00Z');if($('cutoff').value==='month')end.setUTCMonth(end.getUTCMonth()+1,0);
  let result=source.filter(x=>x.row[0]<=iso(end)&&(!$('channel').value||x.channel===$('channel').value)&&(!$('region').value||x.region===$('region').value)&&x.recharge>=Math.max(min,mode==='custom'?Number($('vip').value):0)&&x.recharge<=max);
  const seen=new Set();result=result.filter(x=>{if($('period').value!=='month')return true;const key=x.row[0].slice(0,7);if(seen.has(key))return false;seen.add(key);return true;});
  const perTier=mode==='config'&&display==='tier';
  columns=perTier?[baseColumns[0],'VIP分层',...baseColumns.slice(1)]:[...baseColumns];
  const widths=perTier?[baseWidths[0],150,...baseWidths.slice(1)]:[...baseWidths];
  document.querySelector('colgroup').innerHTML=widths.map(w=>'<col style="width:'+w+'px">').join('');
  document.querySelector('table').style.width=widths.reduce((a,b)=>a+b,0)+'px';
  $('headers').innerHTML=columns.map(c=>'<th scope="col">'+c+'</th>').join('');
  if(mode==='config'){
    result=result.flatMap(x=>perTier?tiers.map(t=>({row:[x.row[0],t.name,...Array(baseColumns.length-1).fill('—')]})):[{row:[x.row[0],...Array(baseColumns.length-1).fill('—')]}]);
  }
  filtered=result;appliedPositioning=mode;
  $('query-mode').textContent=mode==='custom'?'当前结果：自定义金额 · 演示数据':'当前结果：VIP配置 · '+(perTier?'按分层统计':'合并统计')+' · '+(tiers.length===vipTierConfig.length?'全部档位':tiers.map(t=>t.name).join('、'))+'（演示配置；统计数据待接入）';
  $('pending').hidden=true;$('tier-picker').open=false;go(1);
  toast(mode==='custom'?'已更新本地演示结果；统计重算需接入真实数据':'已更新配置统计展示，未提供的数值以“—”显示');
};
$('analysis').onclick=()=>{if(appliedPositioning==='config')return toast('VIP配置统计尚未接入，暂无可分析的指标');if(!filtered.length)return toast('暂无可分析的数据');const latest=filtered[0].row;modal('VIP累计服务数据 · 数据分析','<div class="metrics"><div class="metric">累计VIP数<strong>'+latest[1].toLocaleString()+'</strong></div><div class="metric">累计VIP收录率<strong>'+latest[7]+'</strong></div></div><p>截至 '+latest[0]+'，活跃VIP '+latest[2].toLocaleString()+' 人，累计已收录VIP '+latest[3].toLocaleString()+' 人，未收录流失VIP '+latest[6]+' 人。</p><p>当前筛选结果共 '+filtered.length+' 条，可导出 CSV 继续分析。</p><div class="note">此处根据本地表格计算摘要，未连接 AI 服务。截图外记录为演示数据，不作为业务结论。</div>');};
$('about').onclick=()=>modal('页面说明','<p>本页面根据提供的截图还原，保留筛选区、表格和分页。新增的 8 个指标按补充截图顺序追加，未提供数值，使用“—”占位。</p><p>前 15 行的完整可见数值按截图录入；最右列按可见计数计算，后续记录、渠道、地区与累充属性为演示数据，共 177 条。</p><p>筛选、分页、选中单元格和 CSV 导出在本地运行。按月展示每月最新快照；按日、周起始及高V门槛可设置，真实统计重算需接入接口。</p><div class="note">无外部依赖，可直接离线打开。未包含截图中的水印、意见悬浮入口和桌面宠物。</div>');
function closeDialog(){$('dialog').close();}$('close').onclick=closeDialog;$('confirm').onclick=closeDialog;$('dialog').onclick=e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}};
$('export').onclick=()=>{const csv='\uFEFF'+[columns,...filtered.map(x=>x.row)].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='VIP累计服务数据-演示.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选结果（演示数据）');};

// 本地演示选项集中维护；接入时替换为VIP配置返回的有序名称列表。
const vipTierConfig=[{id:'recorded',name:'VIP_收录'},{id:'priority',name:'VIP_1'},{id:'premium',name:'VIP_2'}];
const baseColumns=[...columns];
const baseWidths=[132,93,91,133,91,132,133,120,120,120,120,134,131,120,150,200,200,160,200,200,160];
let appliedPositioning='custom';
function positioning(){return document.querySelector('input[name="positioning"]:checked').value;}
function selectedTiers(){return vipTierConfig.filter(t=>document.querySelector('#tier-options input[value="'+t.id+'"]').checked);}
function markPending(){$('pending').hidden=false;}
function updateTierSummary(){const selected=selectedTiers();$('all-tiers').checked=selected.length===vipTierConfig.length;$('all-tiers').indeterminate=selected.length>0&&selected.length<vipTierConfig.length;$('tier-summary').textContent=selected.length===vipTierConfig.length?'全部':selected.length?selected.map(t=>t.name).join('、'):'选择档位';}
$('tier-options').replaceChildren(...vipTierConfig.map(t=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=t.id;input.checked=true;label.append(input,document.createTextNode(t.name));return label;}));
$('all-tiers').onchange=()=>{document.querySelectorAll('#tier-options input').forEach(input=>input.checked=$('all-tiers').checked);updateTierSummary();markPending();};
$('tier-options').onchange=()=>{updateTierSummary();markPending();};
for(const id of ['vip','high'])$('custom-options').append($(id).closest('.threshold'));
function togglePositioning(){const custom=positioning()==='custom';$('custom-options').hidden=!custom;$('config-options').hidden=custom;for(const id of ['vip','high'])$(id).disabled=!custom;if(custom)$('tier-picker').open=false;markPending();}
for(const input of document.querySelectorAll('input[name="positioning"]'))input.onchange=togglePositioning;
$('filters').addEventListener('input',markPending);
$('filters').addEventListener('change',markPending);
document.addEventListener('click',e=>{if(!$('tier-picker').contains(e.target))$('tier-picker').open=false;});
$('tier-picker').addEventListener('keydown',e=>{if(e.key==='Escape'){$('tier-picker').open=false;$('tier-picker').querySelector('summary').focus();}});

render();
</script>
</body>
</html>
