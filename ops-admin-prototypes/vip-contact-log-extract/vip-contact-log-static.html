<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP客服弹窗白名单 · 本地原型</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:rgba(0,0,0,.85);font-size:14px;background:#f0f2f5}*{box-sizing:border-box}body{margin:0;padding:16px 12px}button,input{font:inherit}button{height:32px;padding:0 15px;border:1px solid #d9d9d9;background:#fff;border-radius:2px;color:inherit;cursor:pointer;white-space:nowrap}button:hover{color:#1890ff;border-color:#40a9ff}button:focus-visible,input:focus{outline:2px solid #91d5ff;outline-offset:2px}button.primary{background:#1890ff;border-color:#1890ff;color:#fff}button.primary:hover{background:#40a9ff;color:#fff}.page{background:#fff;padding:16px;box-shadow:0 4px 10px #00000010;min-height:300px}.search{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:0 0 18px}.search label{display:flex;align-items:center;gap:8px}.search input{height:32px;width:180px;border:1px solid #d9d9d9;border-radius:2px;padding:4px 10px}.search .short{width:150px}.toolbar{display:flex;align-items:center;gap:10px;min-height:44px;margin:0 0 12px}.toolbar .spacer{flex:1}.switch-wrap{display:flex;align-items:center;gap:8px;color:#434343;font-size:13px}.switch{position:relative;width:34px;height:19px;border:0;border-radius:12px;background:#bfbfbf;padding:0;transition:background .16s}.switch::after{content:"";position:absolute;width:15px;height:15px;top:2px;left:2px;border-radius:50%;background:white;box-shadow:0 1px 3px #0003;transition:left .16s}.switch[aria-checked="true"]{background:#1890ff}.switch[aria-checked="true"]::after{left:17px}.switch-text{min-width:48px;color:#8c8c8c}.switch-text.on{color:#1890ff}.hint{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border:1px solid #1890ff;border-radius:50%;color:#1890ff;font-size:11px;cursor:help}.hint:hover .tooltip,.hint:focus .tooltip{display:block}.tooltip{display:none;position:absolute;z-index:5;left:50%;top:22px;transform:translateX(-50%);width:310px;padding:10px 12px;background:#fff;border-radius:3px;box-shadow:0 2px 10px #0002;color:#595959;line-height:1.7;font-size:12px}.table-scroll{overflow:auto}table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1060px}th,td{height:56px;padding:12px 9px;border:1px solid #f0f0f0;text-align:left;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{height:48px;background:#fafafa}tbody tr:hover{background:#e6f7ff66}.link{border:0;background:transparent;padding:0;height:auto;color:#1890ff}.link.red{color:#ff4d4f;margin-left:8px}.pagination{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:14px;font-size:13px}.pagination button{height:26px;padding:0 9px}.page-active{border-color:#1890ff;color:#1890ff}.empty{text-align:center;color:#8c8c8c;padding:54px 10px}.note{font-size:12px;color:#8c8c8c;margin-top:12px}.mask{position:fixed;inset:0;background:#0007;display:flex;justify-content:flex-end;z-index:10}.mask[hidden]{display:none}.drawer{width:500px;height:100%;background:white;display:flex;flex-direction:column;box-shadow:-4px 0 14px #0002}.drawer header{height:56px;border-bottom:1px solid #f0f0f0;padding:16px 24px;font-size:16px;display:flex;justify-content:space-between}.close{border:0;background:none;padding:0;font-size:23px;height:24px;color:#999}.drawer-body{padding:24px;overflow:auto;flex:1}.field{display:grid;grid-template-columns:135px 1fr;gap:10px;align-items:center;margin-bottom:18px}.field label{text-align:right}.field input{height:32px;border:1px solid #d9d9d9;border-radius:2px;padding:4px 8px;width:100%}.drawer footer{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#fff;padding:10px 18px;box-shadow:0 2px 10px #0002;border-radius:3px;z-index:20}.toast[hidden]{display:none}@media(max-width:700px){body{padding:10px}.page{padding:12px}.toolbar{align-items:flex-start;flex-wrap:wrap}.toolbar .spacer{display:none}.switch-wrap{flex-basis:100%;order:3}.search label{flex:1}.search input,.search .short{width:min(56vw,220px)}.drawer{width:min(100%,500px)}.field{grid-template-columns:95px 1fr}.tooltip{left:auto;right:-8px;transform:none}}
</style>
<style>
.table-scroll table{min-width:1090px}.operation-cell{white-space:nowrap;overflow:visible!important}
.config-trigger{display:inline-flex;align-items:center}.config-mask{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:12;padding:20px}.config-mask[hidden]{display:none}.config-modal{width:460px;max-width:100%;background:#fff;border-radius:3px;box-shadow:0 4px 16px #0003;display:flex;flex-direction:column}.config-modal header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;font-size:16px}.config-modal-body{padding:18px 20px 12px;line-height:1.65}.config-modal footer{border-top:1px solid #f0f0f0;padding:10px 16px;display:flex;justify-content:flex-end}.config-switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fafafa;border:1px solid #f0f0f0;border-radius:3px;margin-bottom:16px}.config-switch-label{font-weight:500}.config-switch-description{font-size:12px;color:#8c8c8c;margin-top:3px}.config-switch-control{display:flex;align-items:center;gap:8px}.config-rules-title{font-weight:500;margin:0 0 7px}.config-rules{padding-left:20px;margin:0;color:#595959;font-size:13px}.config-rules li{padding:3px 0}.config-footnote{margin:12px 0 0;color:#8c8c8c;font-size:12px}.drawer-tabs{display:flex;gap:0;padding:0 24px;border-bottom:1px solid #f0f0f0}.drawer-tab{height:40px;padding:0 18px;border:0;border-bottom:2px solid transparent;background:#fff;color:#595959}.drawer-tab.active{color:#1890ff;border-bottom-color:#1890ff}.drawer-tab:hover{color:#1890ff}.required-mark{color:#ff4d4f;margin-right:4px}.field input:disabled{background:#f5f5f5;color:#8c8c8c;cursor:not-allowed}.batch-placeholder{min-height:180px;display:grid;place-items:center;text-align:center;color:#8c8c8c;line-height:1.8}.confirm-mask{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:15;padding:20px}.confirm-mask[hidden]{display:none}.confirm-box{width:420px;max-width:100%;background:#fff;border-radius:3px;padding:26px 28px 18px;box-shadow:0 4px 16px #0003}.confirm-title{display:flex;align-items:center;gap:12px;font-size:15px}.confirm-icon{width:20px;height:20px;border:2px solid #faad14;border-radius:50%;color:#faad14;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:30px}.confirm-actions button{min-width:64px}.operation-cell .link{padding:0 4px}
@media(max-width:700px){.config-trigger{max-width:calc(100vw - 48px);font-size:12px;padding:0 9px}.config-mask{padding:12px}.config-modal-body{padding:14px}.drawer-tabs{padding:0 12px}}
</style>
</head>
<body>
<main class="page">
  <form class="search" id="search-form">
    <label>角色ID：<input id="q-role" placeholder="请输入" autocomplete="off"></label>
    <label>冰川/渠道账号ID：<input id="q-account" class="short" placeholder="请输入" autocomplete="off"></label>
    <label>操作人：<input id="q-operator" placeholder="请输入" autocomplete="off"></label>
    <button class="primary" type="submit">查询</button>
  </form>
  <div class="toolbar">
    <button class="primary" id="add">＋ 新增</button>
    <button type="button" class="primary config-trigger" id="auto-config">白名单自动创建：关闭</button>
    <span class="spacer"></span>
    <button type="button" title="导出" aria-label="导出演示数据" id="export">⇩</button>
    <button type="button" title="列设置" aria-label="列设置" id="columns">☷</button>
    <button type="button" title="密度" aria-label="密度" id="density">⚙</button>
  </div>
<div class="table-scroll">
    <table>
      <colgroup><col style="width:160px"><col style="width:180px"><col style="width:200px"><col style="width:150px"><col style="width:210px"><col style="width:190px"></colgroup>
      <thead><tr><th>角色ID</th><th>冰川/渠道账号ID</th><th>专属客服名称/ID</th><th>最后修改人</th><th>最后修改时间</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pagination"><span id="count">共 0 条</span><button disabled aria-label="上一页">‹</button><button class="page-active">1</button><button disabled aria-label="下一页">›</button><select aria-label="每页条数"><option>10 条/页</option></select></div>
  <p class="note">本地交互原型 · 演示数据为虚构内容，不连接后台。开关按当前游戏版本保存。</p>
</main>
<div class="mask" id="mask" hidden><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header><span id="drawer-title">新增白名单记录</span><button class="close" id="close" aria-label="关闭">×</button></header><nav class="drawer-tabs" role="tablist" aria-label="白名单记录编辑方式"><button type="button" class="drawer-tab active" id="tab-normal" role="tab" aria-selected="true">常规</button><button type="button" class="drawer-tab" id="tab-batch" role="tab" aria-selected="false">批量</button></nav><div class="drawer-body" id="drawer-body"></div><footer><button id="cancel">取消</button><button class="primary" id="save">保存</button></footer></section></div>
<div class="confirm-mask" id="delete-mask" hidden><section class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="delete-title"><div class="confirm-title"><span class="confirm-icon">!</span><span id="delete-title">确认删除吗？</span></div><div class="confirm-actions"><button id="delete-cancel">取消</button><button class="primary" id="delete-confirm">确定</button></div></section></div>
<div class="config-mask" id="config-mask" hidden><section class="config-modal" role="dialog" aria-modal="true" aria-labelledby="config-title"><header><span id="config-title">白名单自动创建设置</span><button class="close" id="config-close" aria-label="关闭">×</button></header><div class="config-modal-body"><div class="config-switch-row"><div><div class="config-switch-label">首次已收录时自动创建白名单记录</div></div><div class="config-switch-control"><button type="button" class="switch" id="auto-switch" role="switch" aria-checked="false" aria-label="首次已收录时自动创建白名单记录"></button><span class="switch-text" id="switch-state">关闭</span></div></div><p class="config-rules-title">使用规则</p><ol class="config-rules"><li>开启后，仅处理开关开启期间玩家首次进入「已收录」状态。</li><li>已有白名单记录时不重复创建；关闭期间不创建，重新开启后不补建历史记录。</li></ol></div><footer><button class="primary" id="config-done">保存</button></footer></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),storageKey='vip-contact-log-prototype-v1',switchKey='vip-contact-auto-create-prototype-v1';
const stamp=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records=[{role:'DEMO-ROLE-001',account:'DEMO-ACCOUNT-001',specialist:'客服示例A（DEMO-CS-01）',by:'张静',at:'2026-11-06 10:15:02'},{role:'DEMO-ROLE-002',account:'DEMO-ACCOUNT-002',specialist:'未匹配',by:'张静',at:'2026-11-06 10:14:49'}];
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(Array.isArray(saved))records=saved}catch{}
let enabled=false,pendingEnabled=false;try{enabled=JSON.parse(localStorage.getItem(switchKey)||'false')===true}catch{}
let editing=null,filtered=[...records],pendingDelete=null,formTab='normal';
function toast(message){$('toast').textContent=message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2600)}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(records))}catch{toast('本机浏览器未允许保存。')}}
function render(){
  $('rows').innerHTML=filtered.length?filtered.map((r,i)=>`<tr><td title="${escapeHTML(r.role)}">${escapeHTML(r.role)}</td><td title="${escapeHTML(r.account)}">${escapeHTML(r.account)}</td><td title="${escapeHTML(r.specialist)}">${escapeHTML(r.specialist)}</td><td>${escapeHTML(r.by)}</td><td>${escapeHTML(r.at)}</td><td class="operation-cell"><button class="link" data-edit="${i}">编辑</button><button class="link red" data-delete="${i}">删除</button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">暂无数据</div></td></tr>';
  $('count').textContent=`共 ${filtered.length} 条`;
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(Number(b.dataset.edit)));
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>openDelete(Number(b.dataset.delete)));
}
function query(){const role=$('q-role').value.trim().toLowerCase(),account=$('q-account').value.trim().toLowerCase(),operator=$('q-operator').value.trim().toLowerCase();filtered=records.filter(r=>(!role||r.role.toLowerCase().includes(role))&&(!account||r.account.toLowerCase().includes(account))&&(!operator||r.by.toLowerCase().includes(operator)));render()}
function syncSwitchUI(){
  $('auto-switch').setAttribute('aria-checked',String(pendingEnabled));
  $('switch-state').textContent=pendingEnabled?'开启':'关闭';
  $('switch-state').classList.toggle('on',pendingEnabled);
  $('auto-config').textContent=enabled?'白名单自动创建：开启':'白名单自动创建：关闭';
}
function setSwitch(value){pendingEnabled=value;syncSwitchUI()}
function openConfig(){pendingEnabled=enabled;syncSwitchUI();$('config-mask').hidden=false;$('config-done').focus()}
function closeConfig(){$('config-mask').hidden=true;$('auto-config').focus()}
function saveConfig(){enabled=pendingEnabled;try{localStorage.setItem(switchKey,JSON.stringify(enabled))}catch{toast('本机浏览器未允许保存设置。')}syncSwitchUI();closeConfig();toast(enabled?'已开启：仅处理开启后的首次收录':'已关闭：不会补建历史记录')}
function openForm(index=null){editing=index===null?null:filtered[index];formTab='normal';$('drawer-title').textContent=editing?'编辑白名单记录':'新增白名单记录';$('tab-normal').classList.add('active');$('tab-normal').setAttribute('aria-selected','true');$('tab-batch').classList.remove('active');$('tab-batch').setAttribute('aria-selected','false');renderFormTab();$('mask').hidden=false}
function renderFormTab(){const role=editing?.role||'',account=editing?.account||'',specialist=editing?.specialist||'';if(formTab==='batch'){$('drawer-body').innerHTML='<div class="batch-placeholder"><div><strong>批量编辑</strong><br>批量操作字段与规则待补充</div></div>';return}$('drawer-body').innerHTML=`<label class="field"><span><b class="required-mark">*</b>角色ID：</span><input id="f-role" ${editing?'disabled':''} value="${escapeHTML(role)}" placeholder="请输入角色ID"></label><label class="field"><span><b class="required-mark">*</b>冰川/渠道账号ID：</span><input id="f-account" ${editing?'disabled':''} value="${escapeHTML(account)}" placeholder="请输入账号ID"></label><label class="field"><span><b class="required-mark">*</b>专属客服名称/ID：</span><input id="f-specialist" value="${escapeHTML(specialist)}" placeholder="请输入专属客服名称/ID"></label>`}
function closeForm(){$('mask').hidden=true;editing=null;formTab='normal'}
function openDelete(index){pendingDelete=filtered[index]||null;if(!pendingDelete)return;$('delete-mask').hidden=false;$('delete-confirm').focus()}
function closeDelete(){$('delete-mask').hidden=true;pendingDelete=null}
function confirmDelete(){if(!pendingDelete)return;records=records.filter(x=>x!==pendingDelete);persist();closeDelete();query()}
$('auto-config').onclick=openConfig;$('auto-switch').onclick=()=>setSwitch(!pendingEnabled);$('config-close').onclick=closeConfig;$('config-done').onclick=saveConfig;$('config-mask').onclick=e=>{if(e.target===$('config-mask'))closeConfig()};$('search-form').onsubmit=e=>{e.preventDefault();query()};$('add').onclick=()=>openForm();$('close').onclick=closeForm;$('cancel').onclick=closeForm;$('mask').onclick=e=>{if(e.target===$('mask'))closeForm()};$('tab-normal').onclick=()=>{formTab='normal';$('tab-normal').classList.add('active');$('tab-normal').setAttribute('aria-selected','true');$('tab-batch').classList.remove('active');$('tab-batch').setAttribute('aria-selected','false');renderFormTab()};$('tab-batch').onclick=()=>{formTab='batch';$('tab-batch').classList.add('active');$('tab-batch').setAttribute('aria-selected','true');$('tab-normal').classList.remove('active');$('tab-normal').setAttribute('aria-selected','false');renderFormTab()};$('delete-cancel').onclick=closeDelete;$('delete-confirm').onclick=confirmDelete;$('delete-mask').onclick=e=>{if(e.target===$('delete-mask'))closeDelete()};$('save').onclick=()=>{if(formTab==='batch'){toast('批量操作规则待补充');return}const role=$('f-role').value.trim(),account=$('f-account').value.trim(),specialist=$('f-specialist').value.trim();if(!role||!account||!specialist){toast('请填写角色ID、冰川/渠道账号ID和专属客服名称/ID');return}const next={role:editing?.role||role,account:editing?.account||account,specialist,by:'当前用户',at:stamp()};if(editing){records=records.map(x=>x===editing?next:x)}else records.unshift(next);persist();closeForm();query();toast('仅保存到本地原型')};
$('export').onclick=()=>{const csv=['角色ID,冰川/渠道账号ID,专属客服名称/ID,最后修改人,最后修改时间',...filtered.map(r=>[r.role,r.account,r.specialist,r.by,r.at].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='VIP客服弹窗白名单-演示.csv';a.click();URL.revokeObjectURL(a.href)};$('columns').onclick=()=>toast('列设置为静态演示');$('density').onclick=()=>{document.querySelectorAll('td,th').forEach(el=>el.style.padding=el.style.padding?'':'7px 9px');toast('已切换演示密度')};
syncSwitchUI();render();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('delete-mask').hidden)closeDelete();else if(!$('config-mask').hidden)closeConfig();else if(!$('mask').hidden)closeForm()}});
})();
</script>
</body>
</html>
