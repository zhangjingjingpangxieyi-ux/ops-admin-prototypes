<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>客服负责渠道配置</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#262626;font-size:14px;background:#f0f2f5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;color:#bfbfbf;background:#f5f5f5;border-color:#d9d9d9}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #1890ff;outline-offset:3px}button{transition:background .15s}h1,h2,p{margin:0}.page-head{background:white;border-bottom:1px solid #e8e8e8;padding:19px 24px 20px}.crumb{font-size:13px;color:#8c8c8c;margin-bottom:15px}.crumb span{margin:0 10px;color:#bfbfbf}.head-line{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:20px;font-weight:600}.prototype{font-size:12px;color:#8c8c8c;border:1px solid #e8e8e8;padding:3px 9px;border-radius:2px}.page-head p{color:#8c8c8c;margin-top:9px;font-size:13px}main{padding:20px 24px}.notice{display:flex;align-items:center;gap:9px;padding:11px 15px;background:#e6f7ff;border:1px solid #91d5ff;border-radius:2px;margin-bottom:16px;font-size:13px}.info{border-radius:50%;background:#1890ff;color:#fff;width:16px;height:16px;text-align:center;font-size:12px;flex-shrink:0}.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);background:white;border:1px solid #e8e8e8;min-height:610px;height:calc(100vh - 235px)}.people{border-right:1px solid #e8e8e8;display:flex;flex-direction:column;min-height:0}.panel-title{padding:19px 20px 15px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}.subtle{color:#8c8c8c;font-size:12px;font-weight:400}.input-wrap{position:relative}.search-icon{position:absolute;left:11px;top:9px;width:13px;height:13px;border:1.5px solid #bfbfbf;border-radius:50%;pointer-events:none}.search-icon:after{content:"";width:5px;height:1.5px;background:#bfbfbf;position:absolute;right:-4px;bottom:-2px;transform:rotate(45deg)}input[type=search]{width:100%;height:34px;border:1px solid #d9d9d9;border-radius:2px;padding:4px 10px 4px 34px;background:white;color:#262626}input::placeholder{color:#bfbfbf}.people-search{margin:0 16px 14px}.tree{padding:0 10px 20px;overflow:auto;flex:1}.tree-root{padding:9px 10px;font-weight:500}.org-icon{color:#8c8c8c;margin-right:8px}.tree details{margin:1px 0 0 12px}.tree summary{cursor:pointer;padding:10px 6px;color:#595959;user-select:none;font-size:13px}.person{display:flex;align-items:center;width:calc(100% - 14px);margin:2px 0 2px 14px;padding:10px 10px 10px 13px;border:0;border-radius:2px;background:white;text-align:left;gap:9px;min-height:59px;position:relative}.person:hover{background:#fafafa}.person.active{background:#e6f7ff}.person.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#1890ff}.person-name{font-size:13px;display:block}.person-account{display:block;color:#8c8c8c;font-size:11px;margin-top:3px}.person-status{margin-left:auto;white-space:nowrap;font-size:11px;color:#389e0d;background:#f6ffed;border:1px solid #b7eb8f;padding:1px 5px;border-radius:2px}.person-status.none{color:#8c8c8c;border-color:#d9d9d9;background:#fafafa}.people-foot{padding:12px 20px;border-top:1px solid #f0f0f0;color:#8c8c8c;font-size:12px}.editor{display:flex;flex-direction:column;min-width:0;min-height:0}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:300px;color:#8c8c8c;text-align:center;padding:30px}.empty-symbol{width:56px;height:48px;border:1px solid #d9d9d9;background:#fafafa;border-radius:3px;margin-bottom:21px;position:relative}.empty-symbol:before,.empty-symbol:after{content:"";position:absolute;left:12px;right:12px;top:16px;border-top:2px solid #e0e0e0}.empty-symbol:after{top:27px;right:20px}.empty h2{font-size:16px;color:#595959;font-weight:500}.empty p{font-size:13px;margin-top:10px;line-height:1.8}.editor-head{padding:19px 24px 17px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;gap:16px;align-items:center}.editor-head h2{font-size:15px;font-weight:600}.identity{margin-top:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.identity strong{font-size:15px;font-weight:500}.identity span{font-size:12px;color:#8c8c8c}.pending{font-size:12px;color:#d48806;background:#fffbe6;border:1px solid #ffe58f;padding:3px 8px;white-space:nowrap;border-radius:2px}.toolbar{padding:18px 24px 14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.toolbar .input-wrap{width:300px;max-width:100%}.check-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none}input[type=checkbox]{accent-color:#1890ff;width:15px;height:15px;margin:0;flex-shrink:0;cursor:pointer}.selected-count{margin-left:auto;font-size:13px;white-space:nowrap}.blue{color:#1890ff}.selection-bar{margin:0 24px;min-height:44px;background:#fafafa;border-top:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;padding:10px 12px;display:flex;align-items:center;gap:14px}.text-btn{border:0;background:none;color:#1890ff;padding:0;font-size:13px}.selection-bar .text-btn{margin-left:auto}.text-btn:disabled{background:none}.channels-scroll{flex:1;overflow:auto;min-height:140px;padding:12px 24px 18px}.channel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}.channel-item{display:flex;align-items:flex-start;gap:10px;padding:13px 12px;min-height:71px;border-bottom:1px solid #f0f0f0;cursor:pointer}.channel-item:hover{background:#fafafa}.channel-item.selected{background:#f5faff}.channel-item input{margin-top:3px}.channel-name{display:block;font-size:13px;line-height:20px}.channel-detail{display:block;color:#8c8c8c;font-size:12px;line-height:18px;margin-top:3px}.no-result{padding:55px 15px;text-align:center;color:#8c8c8c;line-height:2}.footer{border-top:1px solid #e8e8e8;padding:16px 24px;display:flex;align-items:center;gap:10px;box-shadow:0 -3px 6px #00000002}.footer-note{color:#8c8c8c;font-size:12px;margin-right:auto;line-height:1.6}.btn{border:1px solid #d9d9d9;border-radius:2px;background:white;padding:6px 16px;min-height:33px;white-space:nowrap}.btn:hover:not(:disabled){border-color:#40a9ff;color:#1890ff}.btn.primary{background:#1890ff;border-color:#1890ff;color:white}.btn.primary:hover:not(:disabled){background:#40a9ff}.btn.primary:disabled{background:#f5f5f5;color:#bfbfbf;border-color:#d9d9d9}.btn.danger{background:#ff4d4f;color:#fff;border-color:#ff4d4f}.page-note{color:#8c8c8c;font-size:12px;margin-top:12px;line-height:1.8}.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);padding:11px 19px;background:white;box-shadow:0 3px 14px #0002;border-radius:3px;z-index:20;font-size:14px;max-width:90vw}.toast:before{content:"✓";color:#52c41a;margin-right:9px}dialog{border:0;border-radius:3px;box-shadow:0 12px 40px #0003;padding:25px;width:490px;max-width:calc(100vw - 32px);color:#262626}dialog::backdrop{background:#0006}dialog h2{font-size:17px;font-weight:600}dialog p{line-height:1.9;font-size:14px;color:#595959;margin:16px 0 25px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}[hidden]{display:none!important}@media(min-width:1550px){.channel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){main{padding:16px}.channel-grid{grid-template-columns:1fr}.toolbar,.editor-head,.footer{padding-left:16px;padding-right:16px}.selection-bar{margin-left:16px;margin-right:16px}.channels-scroll{padding-left:16px;padding-right:16px}.selected-count{margin-left:0}.workspace{grid-template-columns:270px minmax(0,1fr)}}@media(max-width:620px){.page-head{padding:16px}main{padding:12px}.workspace{grid-template-columns:1fr;height:auto}.people{height:310px;border-right:0;border-bottom:1px solid #e8e8e8}.editor{min-height:530px}.channels-scroll{max-height:430px}.prototype{display:none}.notice{align-items:flex-start;line-height:1.7}.info{margin-top:3px}.footer{flex-wrap:wrap}.footer-note{width:100%}.head-line h1{font-size:18px}}
</style>
</head>
<body>
<!-- Local interaction prototype. Staff, organization, channels and version are fictional examples.
     Existing project/version context is inherited, not selectable here. Bindings persist only in this browser.
     One staff member is edited at a time; channel search never removes hidden selections. -->
<header class="page-head"><div class="crumb">VIP 管理<span>/</span>客服负责渠道配置</div><div class="head-line"><h1>客服负责渠道配置</h1><span class="prototype">交互原型 · 示例数据</span></div><p>为客服分配当前版本的负责渠道，控制 VIP 自定义字段的查看与编辑。</p></header>
<main><div class="notice"><span class="info">i</span><span>客服仅可查看、编辑所负责渠道的 VIP 自定义字段；其他渠道的字段值显示“无查看权限”。</span></div>
<section class="workspace" aria-label="客服渠道绑定管理">
<aside class="people"><div class="panel-title">选择客服<span class="subtle">组织结构</span></div><div class="input-wrap people-search"><span class="search-icon"></span><input id="personSearch" type="search" placeholder="搜索姓名或域账号" aria-label="搜索姓名或域账号"></div><div id="tree" class="tree"></div><div class="people-foot">按人员配置 · 一个渠道可由多位客服负责</div></aside>
<section class="editor" id="editor" aria-label="负责渠道配置"><div id="empty" class="empty"><div class="empty-symbol" aria-hidden="true"></div><h2>请先选择客服</h2><p>从左侧组织结构选择人员<br>查看或配置其负责渠道</p></div>
<div id="editorHead" class="editor-head" hidden><div><h2>负责渠道</h2><div class="identity"><strong id="staffName"></strong><span id="staffAccount"></span></div></div><span id="pending" class="pending" hidden>有未保存修改</span></div>
<div id="toolbar" class="toolbar" hidden><div class="input-wrap"><span class="search-icon"></span><input id="channelSearch" type="search" placeholder="搜索渠道名称或 ID" aria-label="搜索渠道名称或 ID"></div><label class="check-label"><input id="onlySelected" type="checkbox">仅看已选</label><span class="selected-count">已选 <strong id="selectedCount" class="blue">0</strong> 个渠道</span></div>
<div id="selectionBar" class="selection-bar" hidden><label class="check-label"><input id="selectAll" type="checkbox">全选当前结果</label><span id="resultCount" class="subtle"></span><button class="text-btn" id="clearAll">清空已选</button></div>
<div id="channelBody" class="channels-scroll" hidden><div id="channels" class="channel-grid"></div><div id="noChannels" class="no-result" hidden></div></div>
<footer id="footer" class="footer" hidden><div class="footer-note" id="changeSummary">暂无修改</div><button class="btn" id="cancel" disabled>取消修改</button><button class="btn primary" id="save" disabled>保存</button></footer>
</section></section><p class="page-note">仅保存当前客服的绑定，不影响其他客服。新增加的渠道需要另行配置；仅系统回填的字段仍不可人工编辑。</p></main>
<dialog id="confirmDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogActions" class="dialog-actions"></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const people=[{id:'lin.xia',name:'林夏',dept:'国内客服组'},{id:'chen.chen',name:'陈晨',dept:'国内客服组'},{id:'zhou.ning',name:'周宁',dept:'国内客服组'},{id:'xu.ran',name:'许然',dept:'海外客服一组'},{id:'su.yue',name:'苏悦',dept:'海外客服一组'},{id:'lu.yan',name:'陆言',dept:'海外客服一组'},{id:'jiang.yu',name:'江予',dept:'海外客服二组'},{id:'shen.qing',name:'沈清',dept:'海外客服二组'},{id:'tang.ke',name:'唐可',dept:'海外客服二组'}];
const channels=[['1001','官方 Android','官方渠道'],['1002','官方 iOS','官方渠道'],['1003','官方网站','官方渠道'],['2001','华为应用市场','国内联运'],['2002','小米游戏中心','国内联运'],['2003','OPPO 游戏中心','国内联运'],['2004','vivo 游戏中心','国内联运'],['2005','应用宝','国内联运'],['3001','Google Play · 英语','海外渠道'],['3002','App Store · 英语','海外渠道'],['3003','Google Play · 繁体中文','海外渠道'],['3004','App Store · 繁体中文','海外渠道'],['3005','Google Play · 日语','海外渠道'],['3006','App Store · 日语','海外渠道'],['3007','Google Play · 韩语','海外渠道'],['3008','App Store · 韩语','海外渠道']].map(([id,name,group])=>({id,name,group}));
const defaults={'lin.xia':['1001','1002','1003'],'chen.chen':['2001','2002','2003','2004'],'zhou.ning':[],'xu.ran':['3001','3002'],'su.yue':['3003','3004'],'lu.yan':[],'jiang.yu':['3005','3006'],'shen.qing':['3007','3008'],'tang.ke':[]};
const storageKey='vip-channel-staff-prototype:demo-project:demo-region:demo-version:v1';
let bindings=structuredClone(defaults);try{const stored=JSON.parse(localStorage.getItem(storageKey));if(stored&&typeof stored==='object')for(const p of people)if(Array.isArray(stored[p.id]))bindings[p.id]=[...new Set(stored[p.id].filter(id=>channels.some(c=>c.id===id)))];}catch{}
let current=null,draft=new Set(),toastTimer;const collapsed=new Set();const $=id=>document.getElementById(id);
function dirty(){return current&&(draft.size!==bindings[current].length||bindings[current].some(id=>!draft.has(id)))}
function renderPeople(){const q=$('personSearch').value.trim().toLowerCase();const matches=people.filter(p=>(p.name+' '+p.id).toLowerCase().includes(q));$('tree').replaceChildren();if(!matches.length){$('tree').innerHTML='<div class="no-result">未找到匹配人员</div>';return}const root=document.createElement('div');root.className='tree-root';root.innerHTML='<span class="org-icon">▾</span>客户服务中心';$('tree').append(root);for(const dept of [...new Set(matches.map(p=>p.dept))]){const det=document.createElement('details');det.open=!!q||!collapsed.has(dept);const summary=document.createElement('summary');summary.textContent=dept;det.append(summary);det.addEventListener('toggle',()=>{if(!q){if(det.open)collapsed.delete(dept);else collapsed.add(dept)}});for(const p of matches.filter(p=>p.dept===dept)){const b=document.createElement('button');b.className='person'+(current===p.id?' active':'');b.setAttribute('aria-pressed',String(current===p.id));b.dataset.person=p.id;const n=bindings[p.id].length;b.innerHTML='<span><span class="person-name">'+p.name+'</span><span class="person-account">'+p.id+'</span></span><span class="person-status '+(!n?'none':'')+'">'+(n?'已配置 '+n+' 个':'未配置')+'</span>';b.onclick=()=>requestPerson(p.id);det.append(b)}$('tree').append(det)}}
function loadPerson(id){current=id;draft=new Set(bindings[id]);$('channelSearch').value='';$('onlySelected').checked=false;renderPeople();renderEditor()}
function requestPerson(id){if(id===current)return;if(!dirty()){loadPerson(id);return}showDialog('当前修改尚未保存','请选择如何处理当前客服的渠道修改，再切换到其他客服。',[['继续编辑',()=>{}],['放弃修改',()=>loadPerson(id)],['保存并切换',()=>saveDraft(()=>loadPerson(id)),'primary']])}
function visibleChannels(){const q=$('channelSearch').value.trim().toLowerCase();return channels.filter(c=>(c.id+' '+c.name).toLowerCase().includes(q)&&(!$('onlySelected').checked||draft.has(c.id)))}
function renderEditor(){const has=!!current;$('empty').hidden=has;for(const id of ['editorHead','toolbar','selectionBar','channelBody','footer'])$(id).hidden=!has;if(!has)return;const p=people.find(p=>p.id===current);$('staffName').textContent=p.name;$('staffAccount').textContent=p.id+' · '+p.dept;$('pending').hidden=!dirty();$('selectedCount').textContent=draft.size;$('save').disabled=!dirty();$('cancel').disabled=!dirty();$('clearAll').disabled=draft.size===0;const added=[...draft].filter(x=>!bindings[current].includes(x)).length;const removed=bindings[current].filter(x=>!draft.has(x)).length;$('changeSummary').textContent=dirty()?'待保存：新增 '+added+' 个，移除 '+removed+' 个渠道':'暂无修改';const visible=visibleChannels();$('resultCount').textContent='共 '+visible.length+' 个';$('selectAll').checked=visible.length>0&&visible.every(c=>draft.has(c.id));$('selectAll').indeterminate=visible.some(c=>draft.has(c.id))&&!$('selectAll').checked;$('selectAll').disabled=!visible.length;$('channels').replaceChildren();for(const c of visible){const label=document.createElement('label');label.className='channel-item'+(draft.has(c.id)?' selected':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=draft.has(c.id);cb.dataset.channel=c.id;cb.setAttribute('aria-label',c.name+' '+c.id);cb.onchange=()=>{cb.checked?draft.add(c.id):draft.delete(c.id);renderEditor();const replacement=document.querySelector('[data-channel="'+c.id+'"]');if(replacement)replacement.focus();else $('onlySelected').focus()};const content=document.createElement('span');content.innerHTML='<span class="channel-name">'+c.name+'</span><span class="channel-detail">'+c.id+' · '+c.group+'</span>';label.append(cb,content);$('channels').append(label)}$('noChannels').hidden=visible.length>0;$('noChannels').textContent=$('onlySelected').checked&&!draft.size?'尚未选择渠道，取消“仅看已选”可继续选择。':'没有匹配的渠道，请调整搜索条件。'}
function showDialog(title,body,actions){$('dialogTitle').textContent=title;$('dialogText').textContent=body;$('dialogActions').replaceChildren();for(const [label,fn,kind]of actions){const b=document.createElement('button');b.className='btn '+(kind||'');b.textContent=label;b.onclick=()=>{$('confirmDialog').close();fn()};$('dialogActions').append(b)}$('confirmDialog').showModal()}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function saveDraft(after){if(!dirty()){if(after)after();return}const commit=()=>{const next={...bindings,[current]:[...draft]};try{localStorage.setItem(storageKey,JSON.stringify(next))}catch{showDialog('保存失败','浏览器未允许保存本地数据。当前修改已保留，请调整浏览器设置后重试。',[['继续编辑',()=>{}]]);return}bindings=next;renderPeople();renderEditor();toast('保存成功');if(after)after()};if(!draft.size&&bindings[current].length){showDialog('确认解除全部渠道？','保存后，该客服将无法查看、编辑当前版本所有渠道 VIP 的自定义字段值。其他客服的配置不受影响。',[['继续编辑',()=>{}],['确认解除并保存',commit,'danger']])}else commit()}
$('personSearch').oninput=renderPeople;$('channelSearch').oninput=renderEditor;$('onlySelected').onchange=renderEditor;$('selectAll').onchange=e=>{const ids=visibleChannels().map(c=>c.id);for(const id of ids)e.target.checked?draft.add(id):draft.delete(id);renderEditor()};$('clearAll').onclick=()=>{draft.clear();renderEditor()};$('cancel').onclick=()=>{draft=new Set(bindings[current]);renderEditor();toast('已取消修改')};$('save').onclick=()=>saveDraft();window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});renderPeople();renderEditor();
</script></body></html>
