<section class="card"><div class="filters"><label>渠道：<select id="channelFilter" aria-label="筛选渠道"><option value="">全部渠道</option></select></label><label>客服：<input id="staffFilter" placeholder="请输入姓名或域账号" type="search"></label><label>在职状态：<select id="employmentFilter" aria-label="在职状态"><option value="">全部</option><option value="active">在职</option><option value="departed">离职</option></select></label><div class="actions"><button id="query" class="primary">查询</button></div></div></section>
<section class="card"><div class="bar"><div class="create-with-note"><button id="create" class="primary">＋ 新建</button><span class="binding-note">绑定关系仅在当前项目版本生效，一个客服可负责多个渠道，同一渠道可绑定多个客服。</span></div><div class="table-tools"><button class="icon-button" id="downloadList" title="导出列表" aria-label="导出列表"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></svg></button><div class="tool-wrap"><button class="icon-button" id="densityButton" title="表格密度" aria-label="表格密度" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 3h16M4 21h16M12 7v10m-3-7 3-3 3 3m-6 4 3 3 3-3"/></svg></button><div class="tool-menu" id="densityMenu" hidden><button data-density="compact">紧凑</button><button data-density="normal">默认</button><button data-density="loose">宽松</button></div></div><div class="tool-wrap"><button class="icon-button" id="columnsButton" title="列设置" aria-label="列设置" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 2 1 2 0 2 3-1 2v3l1 2-2 3h-2l-2 1-1 3h-4l-1-3-2-1H5l-2-3 1-2V9L3 7l2-3h2Z" transform="translate(1 1) scale(.9)"/><circle cx="12" cy="11" r="3"/></svg></button><div class="tool-menu columns-menu" id="columnsMenu" hidden><strong>列设置</strong><div id="columnChoices"></div><button id="restoreColumns" class="link">恢复默认</button></div></div></div></div><div class="table-scroll"><table><thead><tr><th>客服姓名</th><th>客服所属部门</th><th style="width:28%">负责渠道</th><th>最后操作人</th><th>最后操作时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="total"></span><button id="prev" aria-label="上一页">‹</button><button id="page" class="page">1</button><button id="next" aria-label="下一页">›</button><select id="pageSize" aria-label="每页条数"><option value="10">10 条／页</option><option value="5">5 条／页</option></select></div><div class="bottom">示例人员与渠道，仅用于演示；保存仅保留在当前浏览器，不修改真实后台。</div></section></main>
<dialog id="formDialog" aria-labelledby="formTitle"><div class="modal-head"><span id="formTitle">新建客服渠道配置</span><button class="close" id="closeForm" aria-label="关闭配置弹窗">×</button></div><div class="modal-body"><div class="form-row"><label for="staffInput" class="form-label"><span class="required">*</span>客服姓名：</label><div><div class="name-wrap"><input id="staffInput" autocomplete="off" placeholder="输入姓名，选择对应人员"><div id="suggestions" class="suggestions" hidden></div></div><div id="staffError" class="staff-error" role="alert"></div></div></div><div class="form-row"><span class="form-label">所属部门：</span><div id="department" class="readonly muted">选择客服后自动带出</div></div><div class="form-row"><span class="form-label"><span class="required" id="channelRequired">*</span>负责渠道：</span><div><div class="selection"><button id="openChannels" class="channel-trigger" aria-expanded="false">选择渠道</button><span id="chosenCount" class="muted" style="float:right;font-size:12px">已选 0 个</span><div class="tags" id="chosenTags"></div></div><div class="help">可多选。已被其他客服负责的渠道仍可选择。</div></div></div><div id="error" class="error" role="alert"></div></div><div class="modal-footer"><button id="cancelForm">取消</button><button id="saveForm" class="primary">保存</button></div></dialog>
<div id="channelDialog" class="chooser-popover" role="dialog" aria-label="选择负责渠道" hidden><div class="chooser-tools"><input type="search" id="channelSearch" placeholder="输入名字或 ID 查找，多个查询值用英文逗号隔开" aria-label="搜索渠道"><select id="channelScope" aria-label="渠道选择状态"><option value="all">不限</option><option value="selected">已选</option><option value="unselected">未选</option></select><span id="tempCount" class="muted"></span><label class="check"><input id="allResults" type="checkbox">当前全选</label></div><div class="channel-layout"><div id="groups" class="groups"></div><div class="channel-main"><label class="group-heading check"><input type="checkbox" id="groupAll"><strong id="groupTitle">全部渠道</strong></label><div id="channelOptions" class="channel-grid"></div></div></div><div class="modal-footer"><button id="clearChannels">重置</button><button id="acceptChannels" class="primary">确定</button></div></div>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><div class="modal-head" id="confirmTitle"></div><div class="modal-body" id="confirmText"></div><div class="modal-footer"><button id="keepEditing">继续编辑</button><button id="confirmAction" class="primary"></button></div></dialog><div id="toast" class="toast" role="status" hidden></div><script>
const people=[{id:'lin.xia',name:'林夏',dept:'国内客服组',employmentStatus:'departed'},{id:'chen.chen',name:'陈晨',dept:'国内客服组'},{id:'zhou.ning',name:'周宁',dept:'国内客服组'},{id:'xu.ran',name:'许然',dept:'海外客服一组'},{id:'su.yue',name:'苏悦',dept:'海外客服一组'},{id:'lu.yan',name:'陆言',dept:'海外客服一组'},{id:'jiang.yu',name:'江予',dept:'海外客服二组'},{id:'shen.qing',name:'沈清',dept:'海外客服二组'},{id:'tang.ke',name:'唐可',dept:'海外客服二组'}];
const channels=[['1001','官方 Android','官方渠道'],['1002','官方 iOS','官方渠道'],['1003','官方网站','官方渠道'],['2001','华为应用市场','国内联运'],['2002','小米游戏中心','国内联运'],['2003','OPPO 游戏中心','国内联运'],['2004','vivo 游戏中心','国内联运'],['2005','应用宝','国内联运'],['3001','Google Play · 英语','海外渠道'],['3002','App Store · 英语','海外渠道'],['3003','Google Play · 繁体中文','海外渠道'],['3004','App Store · 繁体中文','海外渠道'],['3005','Google Play · 日语','海外渠道'],['3006','App Store · 日语','海外渠道'],['3007','Google Play · 韩语','海外渠道'],['3008','App Store · 韩语','海外渠道']].map(([id,name,group])=>({id,name,group}));
const defaults={'lin.xia':['1001','1002','1003'],'chen.chen':['2001','2002','2003','2004'],'zhou.ning':[],'xu.ran':['3001','3002'],'su.yue':['3003','3004'],'lu.yan':[],'jiang.yu':['3005','3006'],'shen.qing':['3007','3008'],'tang.ke':[]};

const $=id=>document.getElementById(id),key='vip-staff-channel-list-demo-v2';
let records=Object.entries(defaults).filter(([id,ids])=>ids.length).map(([id,ids])=>({id,channels:ids,by:'演示管理员',time:'2026-09-23 10:00:00'}));
try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.every(r=>people.some(p=>p.id===r.id)&&Array.isArray(r.channels)&&r.channels.every(id=>channels.some(c=>c.id===id))))records=saved}catch{}
let pageNo=1,filterName='',filterChannel='',filterEmployment='',editId=null,person=null,selected=new Set(),temporary=new Set(),group='',initial='',toastTimer;
const name=id=>people.find(p=>p.id===id);const snap=()=>JSON.stringify({person:person?.id||'',channels:[...selected].sort(),input:$('staffInput').value});
function notify(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2300)}
function channelCell(ids){if(!ids.length)return '<span class="muted">未绑定渠道</span>';const names=ids.map(id=>channels.find(c=>c.id===id).name);return '<div class="channel-summary"><span class="channel-tag">'+names[0]+'</span>'+(ids.length>1?'<span class="channel-more" tabindex="0" role="button" aria-label="查看全部 '+ids.length+' 个负责渠道">+'+(ids.length-1)+'<span class="channel-popover" role="tooltip"><strong>负责渠道（'+ids.length+'）</strong>'+names.map(n=>'<span>'+n+'</span>').join('')+'</span></span>':'')+'</div>'}
function render(){const list=records.filter(r=>(name(r.id).name+' '+r.id).toLowerCase().includes(filterName)&&(!filterChannel||r.channels.includes(filterChannel))&&(!filterEmployment||(name(r.id).employmentStatus==='departed'?'departed':'active')===filterEmployment));const size=+$('pageSize').value;pageNo=Math.max(1,Math.min(pageNo,Math.ceil(list.length/size)||1));$('rows').innerHTML=list.slice((pageNo-1)*size,pageNo*size).map(r=>'<tr><td><span class="staff-display">'+name(r.id).name+(name(r.id).employmentStatus==='departed'?'<span class="departed-label">（离职）</span>':'')+'</span></td><td><span class="department-cell" title="客户服务中心 → '+name(r.id).dept+'">客户服务中心 → '+name(r.id).dept+'</span></td><td>'+channelCell(r.channels)+'</td><td>'+r.by+'</td><td>'+r.time+'</td><td><span class="row-actions"><button class="link" data-edit="'+r.id+'">编辑</button><button class="link delete-link" data-delete="'+r.id+'">删除</button></span></td></tr>').join('')||'<tr><td colspan="6" class="empty">暂无匹配的绑定关系</td></tr>';$('total').textContent='共 '+list.length+' 条';$('page').textContent=pageNo;$('prev').disabled=pageNo===1;$('next').disabled=pageNo*size>=list.length;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.delete))}
function updatePerson(){ $('department').textContent=person?'客户服务中心 → '+person.dept:'选择客服后自动带出'}
function updateSelected(){$('chosenCount').textContent='已选 '+selected.size+' 个';$('chosenTags').innerHTML=[...selected].map(id=>'<span class="tag">'+channels.find(c=>c.id===id).name+'</span>').join('')}
function openForm(id=null){closeChannels();editId=id;person=id?name(id):null;selected=new Set(id?records.find(r=>r.id===id).channels:[]);$('staffInput').value=person?.name||'';$('staffInput').disabled=!!id;$('channelRequired').hidden=false;$('formTitle').textContent=id?'编辑客服渠道配置':'新建客服渠道配置';$('error').textContent='';$('staffError').textContent='';$('suggestions').hidden=true;updatePerson();updateSelected();initial=snap();$('formDialog').showModal()}
function confirm(title,text,label,fn){$('keepEditing').textContent='继续编辑';$('confirmAction').classList.remove('danger');$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmAction').textContent=label;$('confirmAction').onclick=()=>{$('confirmDialog').close();fn()};$('confirmDialog').showModal()}
function deleteRecord(id){const row=records.find(r=>r.id===id);if(!row)return;confirm('确认删除该客服配置？','删除后，将解除 '+name(id).name+' 在当前项目版本绑定的全部 '+row.channels.length+' 个渠道。其他客服的绑定及该账号独立的全渠道权限不受影响。','确认删除',()=>{const next=records.filter(r=>r.id!==id);try{localStorage.setItem(key,JSON.stringify(next))}catch{notify('删除失败，请检查浏览器存储设置。');return}records=next;render();notify('已删除，渠道绑定已解除')});$('keepEditing').textContent='取消';$('confirmAction').classList.add('danger')}
function closeForm(){closeChannels();$('formDialog').close()}
$('staffInput').oninput=()=>{$('staffError').textContent='';person=null;updatePerson();const q=$('staffInput').value.trim().toLowerCase();$('suggestions').hidden=!q;$('suggestions').replaceChildren();if(!q)return;const found=people.filter(p=>p.employmentStatus!=='departed'&&(p.name+' '+p.id).toLowerCase().includes(q));if(!found.length){$('suggestions').innerHTML='<div class="empty">未找到匹配人员</div>';return}for(const p of found){const b=document.createElement('button');b.className='suggestion';b.innerHTML=p.name+'<small>'+p.id+' · '+p.dept+'</small>';b.onclick=()=>{person=p;$('staffInput').value=p.name;$('suggestions').hidden=true;updatePerson();$('staffError').textContent=records.some(r=>r.id===p.id)?'该客服已有配置，请在列表中编辑已有记录。':''};$('suggestions').append(b)}};
function visible(){const queries=$('channelSearch').value.toLowerCase().split(/[,，]/).map(q=>q.trim()).filter(Boolean);const scope=$('channelScope').value;return channels.filter(c=>(!group||c.group===group)&&(!queries.length||queries.some(q=>(c.name+' '+c.id).toLowerCase().includes(q)))&&(scope==='all'||(scope==='selected'?temporary.has(c.id):!temporary.has(c.id))))}
function renderChannels(){$('groups').innerHTML=['',...new Set(channels.map(c=>c.group))].map(g=>'<button data-group="'+g+'" class="'+(g===group?'active':'')+'">'+'○　'+(g||'全部渠道')+'</button>').join('');$('groups').querySelectorAll('button').forEach(b=>b.onclick=()=>{group=b.dataset.group;renderChannels()});const items=visible();$('channelOptions').innerHTML=items.map(c=>'<label class="channel-option"><input type="checkbox" data-channel="'+c.id+'" '+(temporary.has(c.id)?'checked':'')+'><span>('+c.id+') '+c.name+'</span></label>').join('')||'<div class="empty">暂无匹配渠道</div>';$('channelOptions').querySelectorAll('input').forEach(cb=>cb.onchange=()=>{cb.checked?temporary.add(cb.dataset.channel):temporary.delete(cb.dataset.channel);renderChannels()});$('tempCount').textContent='已选 '+temporary.size+' 个';$('allResults').checked=items.length>0&&items.every(c=>temporary.has(c.id));$('allResults').indeterminate=items.some(c=>temporary.has(c.id))&&!$('allResults').checked;$('allResults').disabled=!items.length;$('groupTitle').textContent=group||'全部渠道';$('groupAll').checked=$('allResults').checked;$('groupAll').indeterminate=$('allResults').indeterminate;$('groupAll').disabled=!items.length}
$('formDialog').append($('channelDialog'));
function closeChannels(){$('channelDialog').hidden=true;$('openChannels').setAttribute('aria-expanded','false')}
function positionChannels(){const trigger=$('openChannels').getBoundingClientRect();const popup=$('channelDialog');const width=Math.min(970,innerWidth-32);popup.style.width=width+'px';popup.style.left=Math.max(16,Math.min(trigger.right-width,innerWidth-width-16))+'px';popup.style.top=Math.max(16,Math.min(trigger.bottom+12,innerHeight-530))+'px';popup.style.setProperty('--arrow-left',Math.max(20,Math.min(width-20,trigger.left+trigger.width/2-parseFloat(popup.style.left)))+'px')}
$('openChannels').onclick=()=>{if(!$('channelDialog').hidden){closeChannels();return}temporary=new Set(selected);group='';$('channelSearch').value='';$('channelScope').value='all';renderChannels();$('channelDialog').hidden=false;$('openChannels').setAttribute('aria-expanded','true');positionChannels()};$('channelSearch').oninput=renderChannels;$('channelScope').onchange=renderChannels;
function selectResults(checked){for(const c of visible())checked?temporary.add(c.id):temporary.delete(c.id);renderChannels()}
$('allResults').onchange=e=>selectResults(e.target.checked);$('groupAll').onchange=e=>selectResults(e.target.checked);
$('clearChannels').onclick=()=>{temporary.clear();$('channelSearch').value='';$('channelScope').value='all';group='';renderChannels()};$('acceptChannels').onclick=()=>{selected=new Set(temporary);updateSelected();closeChannels()};
document.addEventListener('click',e=>{if(!$('channelDialog').hidden&&!$('channelDialog').contains(e.target)&&!$('openChannels').contains(e.target))closeChannels()});
$('formDialog').addEventListener('cancel',e=>{if(!$('channelDialog').hidden){e.preventDefault();e.stopImmediatePropagation();closeChannels();$('openChannels').focus()}},true);window.addEventListener('resize',()=>{if(!$('channelDialog').hidden)positionChannels()});
$('saveForm').onclick=()=>{if(person&&name(person.id).employmentStatus==='departed'){$('staffError').textContent='该客服已离职，无法保存，请关闭弹窗并更换负责客服。';return}if(!person){$('staffError').textContent='请搜索并选择有效客服，不能仅输入姓名。';return}if(!editId&&records.some(r=>r.id===person.id)){$('staffError').textContent='该客服已有配置，请在列表中编辑已有记录。';return}if(!selected.size){$('error').textContent='请至少选择一个负责渠道。';return}const commit=()=>{const t=new Date();const time=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+t.toTimeString().slice(0,8);const row={id:person.id,channels:[...selected],by:'演示管理员',time};const next=editId?records.map(r=>r.id===editId?row:r):[row,...records];try{localStorage.setItem(key,JSON.stringify(next))}catch{$('error').textContent='本地保存失败，请检查浏览器存储设置。';return}records=next;$('formDialog').close();render();notify('保存成功')};commit()};
$('create').onclick=()=>openForm();$('query').onclick=()=>{filterName=$('staffFilter').value.trim().toLowerCase();filterChannel=$('channelFilter').value;filterEmployment=$('employmentFilter').value;pageNo=1;render()};$('staffFilter').onkeydown=e=>{if(e.key==='Enter')$('query').click()};$('pageSize').onchange=()=>{pageNo=1;render()};$('prev').onclick=()=>{pageNo--;render()};$('next').onclick=()=>{pageNo++;render()};for(const id of ['closeForm','cancelForm'])$(id).onclick=closeForm;$('formDialog').addEventListener('cancel',e=>{e.preventDefault();closeForm()});$('keepEditing').onclick=()=>$('confirmDialog').close();$('channelFilter').innerHTML+=channels.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');window.addEventListener('beforeunload',e=>{if($('formDialog').open&&snap()!==initial){e.preventDefault();e.returnValue=''}});document.addEventListener('mouseover',positionPopover);document.addEventListener('focusin',positionPopover);function positionPopover(e){const el=e.target.closest('.channel-more');if(!el)return;const pop=el.querySelector('.channel-popover'),r=el.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(r.left,innerWidth-330))+'px';pop.style.top=Math.max(8,Math.min(r.bottom+5,innerHeight-285))+'px'}render();

const columnNames=['客服姓名','客服所属部门','负责渠道','最后操作人','最后操作时间'];
const hiddenColumns=new Set();const columnStyle=document.createElement('style');document.head.append(columnStyle);
function applyColumns(){columnStyle.textContent=[...hiddenColumns].map(i=>'#rows td:nth-child('+(i+1)+'),thead th:nth-child('+(i+1)+'){display:none}').join('');$('columnChoices').innerHTML=columnNames.map((n,i)=>'<label><input type="checkbox" data-column="'+i+'" '+(!hiddenColumns.has(i)?'checked':'')+'>'+n+'</label>').join('');$('columnChoices').querySelectorAll('input').forEach(cb=>cb.onchange=()=>{cb.checked?hiddenColumns.delete(+cb.dataset.column):hiddenColumns.add(+cb.dataset.column);applyColumns()})}
function closeTools(){$('densityMenu').hidden=true;$('columnsMenu').hidden=true;$('densityButton').setAttribute('aria-expanded','false');$('columnsButton').setAttribute('aria-expanded','false')}
for(const [button,menu]of [['densityButton','densityMenu'],['columnsButton','columnsMenu']])$(button).onclick=()=>{const opening=$(menu).hidden;closeTools();$(menu).hidden=!opening;$(button).setAttribute('aria-expanded',String(opening))};
document.querySelectorAll('[data-density]').forEach(b=>b.onclick=()=>{document.body.dataset.density=b.dataset.density;document.querySelectorAll('[data-density]').forEach(x=>x.classList.toggle('active',x===b));closeTools()});
$('restoreColumns').onclick=()=>{hiddenColumns.clear();applyColumns()};document.addEventListener('click',e=>{if(!e.target.closest('.table-tools'))closeTools()});
$('downloadList').onclick=()=>{const active=columnNames.map((n,i)=>i).filter(i=>!hiddenColumns.has(i));const filtered=records.filter(r=>(name(r.id).name+' '+r.id).toLowerCase().includes(filterName)&&(!filterChannel||r.channels.includes(filterChannel))&&(!filterEmployment||(name(r.id).employmentStatus==='departed'?'departed':'active')===filterEmployment));const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';const lines=[active.map(i=>cell(columnNames[i])).join(',')];for(const r of filtered){const values=[name(r.id).name,'客户服务中心 → '+name(r.id).dept,r.channels.map(id=>channels.find(c=>c.id===id).name).join('、'),r.by,r.time];lines.push(active.map(i=>cell(values[i])).join(','))}const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='客服渠道绑定关系.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出当前查询结果')};applyColumns();
</script></body></html>
