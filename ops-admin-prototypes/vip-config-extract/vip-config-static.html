<body>
<div class="page-layout">
<aside class="module-sidebar" aria-label="VIP配置菜单">
 <form class="menu-search" id="menu-search"><input id="menu-keyword" type="search" placeholder="请输入关键字" aria-label="搜索菜单"><button class="primary" type="submit" aria-label="搜索"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 5 5"></path></svg></button></form>

 <div class="menu-empty" id="menu-empty" hidden>暂无匹配菜单</div>
</aside>
<section class="module-content">
<main>
 <div class="toolbar"><button class="primary" id="import">导入默认配置</button><button class="primary" id="add">新增</button><span class="toolbar-note">ⓘ 仅用于报表 VIP 分层；每小时第 10 分钟计算，影响历史报表。<button class="link" id="help">使用说明</button></span></div>
 <div class="summary" id="summary"></div>
 <div class="table-scroll"><table><colgroup><col style="width:150px"><col style="width:150px"><col style="width:150px"><col style="width:100px"><col style="width:100px"><col style="width:100px"><col style="width:200px"><col style="width:120px"></colgroup><thead><tr><th>游戏</th><th>游戏版本</th><th>VIP等级</th><th>最小值</th><th>最大值</th><th>配置人</th><th>配置时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
 <div class="pagination" id="pagination"></div>
</main>
<div class="footnote"><span>3.7.3 交互原型 · 示例数据仅保存在本机浏览器</span><button class="link" id="reset">重置演示数据</button></div>
</section>
</div>
<div class="mask" id="mask" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><span id="dialog-title"></span><button class="close" aria-label="关闭弹窗" id="close">×</button></header><div class="modal-body" id="dialog-body"></div><footer id="dialog-footer"></footer></section></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),KEY='vip-config-prototype-373-v1';
function filterMenu(){const key=$('menu-keyword').value.trim().toLowerCase();const items=[$('nav-vip'),$('nav-light')];items.forEach(item=>item.hidden=!item.textContent.toLowerCase().includes(key));$('menu-empty').hidden=items.some(item=>!item.hidden)}
$('menu-search').onsubmit=e=>{e.preventDefault();filterMenu()};$('menu-keyword').oninput=filterMenu;$('nav-vip').onclick=()=>{};$('nav-light').onclick=()=>toast('当前原型仅演示 VIP 等级配置，亮灯规则暂未制作。');
const bounds=[0,10,50,100,200,500,1000,2000,5000,10000,20000];
const defaults=()=>bounds.slice(0,-1).map((min,i)=>({id:i+1,level:i+1,name:'VIP_'+(i+1),sort:i+1,min,max:bounds[i+1],by:'张静',time:'2026-10-19 10:19:52'}));
const seed=()=>({currency:'CNY',rows:defaults(),changed:false});
let state=seed(),page=1,size=10,returnFocus=null,toastTimer;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&['CNY','USD',null].includes(v.currency)&&Array.isArray(v.rows)&&v.rows.every(r=>Number.isFinite(r.level)&&Number.isFinite(r.min)&&Number.isFinite(r.max)))state=v;}catch{}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currency=c=>c==='CNY'?'人民币（CNY）':c==='USD'?'美元（USD）':'待研发确认';
const stamp=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4200)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('浏览器未允许保存，本次修改仅在当前页面保留。')}}
function save(){state.changed=true;persist();close();render();toast('保存成功。正式环境将在下一轮 VIP 计算任务完成后生效。')}
function open(title,body,confirm,label='确定',danger=false,wide=false){returnFocus=document.activeElement;$('mask').classList.remove('drawer-mode');$('modal').classList.remove('drawer');$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('modal').classList.toggle('wide',wide);$('dialog-footer').innerHTML=confirm?'<button id="cancel">取消</button><button id="confirm" class="'+(danger?'danger':'primary')+'">'+label+'</button>':'<button id="cancel" class="primary">知道了</button>';$('mask').hidden=false;document.body.style.overflow='hidden';$('cancel').onclick=close;if(confirm)$('confirm').onclick=confirm;setTimeout(()=>$('modal').querySelector('input:not([readonly]),select,footer button').focus(),0)}
function close(){$('mask').hidden=true;document.body.style.overflow='';returnFocus?.focus()}
function radio(c){return '<div class="field"><label class="required">配置币种</label><div class="radios"><label><input type="radio" name="currency" value="CNY" '+(c==='CNY'?'checked':'')+'>人民币（CNY）</label><label><input type="radio" name="currency" value="USD" '+(c==='USD'?'checked':'')+'>美元（USD）</label></div></div>'}
function selected(){return document.querySelector('input[name=currency]:checked')?.value}
function fail(msg){$('error').textContent=msg;return false}
const target='<div class="neutral" style="margin-bottom:20px">游戏：小小特工队<br>游戏版本：小小特工队-国内</div>';
const impact='下一轮 VIP 计算任务完成后生效，并影响所有历史充值用户及历史报表分层。';
function render(){const has=state.rows.length>0;state.rows.sort((a,b)=>(a.sort??a.level)-(b.sort??b.level));page=Math.max(1,Math.min(page,Math.ceil(state.rows.length/size)||1));$('summary').innerHTML=has?'<span>配置币种：<strong>'+currency(state.currency)+'</strong></span><button class="link" id="change-currency">修改</button><span class="badge blue">当前版本配置</span>'+(state.changed?'<span class="pending">已保存修改 · 待下一轮任务计算（演示）</span>':''):'<span class="badge">系统默认规则</span><span>计算币种：<span style="color:#d48806">待研发确认</span></span>';
if(has)$('change-currency').onclick=changeCurrency;
$('rows').innerHTML=has?state.rows.slice((page-1)*size,page*size).map(r=>'<tr><td>小小特工队</td><td>小小特工队-国内</td><td>'+esc(r.name??('VIP_'+r.level))+'</td><td>'+r.min+'</td><td>'+r.max+'</td><td>'+esc(r.by)+'</td><td>'+esc(r.time)+'</td><td><div class="actions"><button class="link" data-edit="'+r.id+'">编辑</button><button class="link red" data-delete="'+r.id+'">删除</button></div></td></tr>').join(''):'<tr><td colspan="8"><div class="empty"><svg width="60" height="44" viewBox="0 0 60 44" fill="none"><path d="M10 16 20 4h20l10 12v24H10Z" fill="#fafafa" stroke="#d9d9d9"/><path d="M10 17h14l3 6h6l3-6h14" stroke="#d9d9d9"/></svg><strong>暂无自定义 VIP 配置</strong><div>当前回退至系统默认区间，默认计算币种待研发确认。</div><div>可导入默认配置，或新增第一条等级并选择币种。</div><button class="primary" id="empty-import">导入默认配置</button><button id="empty-add">新增等级</button></div></td></tr>';
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(Number(b.dataset.delete)));if(!has){$('empty-import').onclick=importDefault;$('empty-add').onclick=()=>form();}
const pages=Math.ceil(state.rows.length/size)||1;$('pagination').innerHTML='<span>共 '+state.rows.length+' 条</span><button id="prev" aria-label="上一页" '+(page===1?'disabled':'')+'>‹</button>'+Array.from({length:pages},(_,i)=>'<button data-page="'+(i+1)+'" class="'+(page===i+1?'active':'')+'">'+(i+1)+'</button>').join('')+'<button id="next" aria-label="下一页" '+(page===pages?'disabled':'')+'>›</button><select id="size" aria-label="每页条数">'+[10,20,50].map(n=>'<option '+(size===n?'selected':'')+' value="'+n+'">'+n+' 条/页</option>').join('')+'</select><span>跳至</span><input id="jump" type="number" min="1" max="'+pages+'" aria-label="跳转页码"><span>页</span>';
$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);render()});$('size').onchange=e=>{size=Number(e.target.value);page=1;render()};$('jump').onkeydown=e=>{if(e.key==='Enter'){const n=Number(e.target.value);if(Number.isInteger(n)&&n>=1&&n<=pages){page=n;render()}else toast('请输入有效页码')}};
}
function importDefault(){const has=state.rows.length>0;open('导入模板配置','<div class="import-form"><p class="import-tip">ⓘ '+(has?'模板配置将会覆盖已有配置及币种，请确认是否导入':'将导入系统默认 VIP 等级区间，请选择配置币种')+'</p>'+radio(has?state.currency:null)+'<div class="notice">共用默认区间数值，不做汇率换算。<br>'+impact+'</div><div class="error" id="error" role="alert"></div></div>',()=>{const c=selected();if(!c)return fail('请选择配置币种');state.currency=c;state.rows=defaults().map(r=>({...r,by:'当前用户',time:stamp()}));page=1;save()},'确 定')}
function changeCurrency(){open('修改配置币种',target+radio(state.currency)+'<div class="notice">修改币种后，所有 VIP 等级的区间数值保持不变，不做汇率换算。程序将使用用户对应币种的充值金额重新分类。<br>'+impact+'</div><div class="error" id="error" role="alert"></div>',()=>{const c=selected();if(c===state.currency){close();return}const old=state.currency;open('确认修改币种','<p>配置币种将从 <strong>'+currency(old)+'</strong> 变更为 <strong>'+currency(c)+'</strong>。</p><div class="notice">所有区间数值保持不变。例如区间 10～50 将按新币种解释。<br>'+impact+'</div>',()=>{state.currency=c;state.rows=state.rows.map(r=>({...r,by:'当前用户',time:stamp()}));save()},'确认修改')},'下一步')}
function form(id){const row=state.rows.find(r=>r.id===id),first=!state.rows.length;open(row?'编辑':'新增',
(first?radio(null):'<div class="field"><label>配置币种</label><input class="readonly" readonly value="'+currency(state.currency)+'"><div class="muted">沿用整套配置币种，可在列表顶部修改。</div></div>')+
'<div class="field"><label class="required" for="level">VIP等级</label><input type="text" id="level" placeholder="请输入名称" value="'+esc(row?.name??(row?'VIP_'+row.level:''))+'"></div>'+
'<div class="field"><label class="required" for="min">最小值</label><input id="min" type="number" min="0" step="any" placeholder="请输入" value="'+(row?.min??'')+'"></div>'+
'<div class="field"><label class="required" for="max">最大值</label><input id="max" type="number" min="0" step="any" placeholder="请输入名称" value="'+(row?.max??'')+'"></div>'+
'<div class="field"><label class="required" for="sort">排序</label><input id="sort" type="number" step="1" placeholder="请输入名称" value="'+(row?.sort??row?.level??'')+'"></div>'+
'<div class="drawer-note">金额单位：<span id="unit">'+(first?'请先选择币种':currency(state.currency))+'</span>。区间边界归属待研发核实。</div>'+
'<div class="notice">'+impact+'</div><div class="error" id="error" role="alert"></div>',()=>{
if(first&&!selected())return fail('请选择配置币种');const name=$('level').value.trim();if(!name||['min','max','sort'].some(k=>$(k).value.trim()===''))return fail('请填写完整的等级、金额区间和排序');
const min=Number($('min').value),max=Number($('max').value),sort=Number($('sort').value);if(!Number.isSafeInteger(sort))return fail('排序请输入整数');if(!Number.isFinite(min)||!Number.isFinite(max)||min<0||max<=min)return fail('最小值须为非负数，最大值须大于最小值');
if(state.rows.some(r=>r.id!==id&&(r.name??('VIP_'+r.level))===name))return fail('该 VIP 等级已存在');if(state.rows.some(r=>r.id!==id&&min<r.max&&max>r.min))return fail('该区间与已有等级区间重叠，请调整');
if(first)state.currency=selected();const next={id:row?.id??Date.now(),level:row?.level??sort,name,sort,min,max,by:'当前用户',time:stamp()};if(row)state.rows=state.rows.map(r=>r.id===id?next:r);else state.rows.push(next);state.rows.sort((a,b)=>(a.sort??a.level)-(b.sort??b.level));page=Math.floor(state.rows.findIndex(r=>r.id===next.id)/size)+1;save();
},'确 定');$('mask').classList.add('drawer-mode');$('modal').classList.add('drawer');if(first)document.querySelectorAll('[name=currency]').forEach(r=>r.onchange=()=>$('unit').textContent=currency(selected()));}
function remove(id){const row=state.rows.find(r=>r.id===id),last=state.rows.length===1;open(last?'删除最后一条 VIP 配置':'删除 VIP 配置','<p>确定删除 <strong>'+esc(row.name??('VIP_'+row.level))+'</strong>（'+row.min+'～'+row.max+'，'+currency(state.currency)+'）？</p><div class="notice">'+(last?'删除后将恢复系统默认区间，不再保留当前配置币种。默认计算币种待研发确认。':'删除后可能出现未覆盖的充值区间，其匹配处理沿用现有程序。')+'<br>'+impact+'</div>',()=>{state.rows=state.rows.filter(r=>r.id!==id);if(!state.rows.length)state.currency=null;save()},'确认删除',true)}
function help(){open('VIP 配置使用说明','<div class="help-section"><h3>用途与金额口径</h3><p>用于 VIP 用户列表中的等级划分，不影响游戏内 VIP 等级或权益。数据库已存有用户的人民币和美元充值金额，程序按配置币种选择对应金额，再匹配 VIP 区间。</p></div><div class="help-section"><h3>两种配置方式</h3><p>导入默认配置：复制共用默认区间，并选择人民币或美元；再次导入会覆盖原有区间及币种。<br>手动新增：第一条配置选择币种，后续等级沿用整套币种。币种可在列表顶部统一修改，区间数值不自动换算。</p></div><div class="help-section"><h3>何时生效</h3><div class="timeline"><div class="time-node"><b>每小时整点</b>执行订单脚本<br>例如 10:00</div><span>→</span><div class="time-node"><b>每小时第 10 分钟</b>执行 VIP 脚本<br>例如 10:10</div><span>→</span><div class="time-node"><b>任务完成</b>更新 VIP 分类结果</div></div><p>每轮重新计算历史上所有有过充值的用户。配置变更会改变历史报表分层。保存成功不代表计算已完成；执行期间保存是否纳入当次任务待研发确认。</p></div><div class="help-section"><h3>没有自定义配置时</h3><p>从未配置或删除全部配置后，使用系统默认区间；默认计算币种需由研发确认，不能直接假定为人民币或美元。</p></div><div class="neutral"><strong>待确认事项</strong><ul class="review-list"><li>默认回退时的计算币种。</li><li>区间边界金额的等级归属。</li><li>除 VIP 用户列表外，其他受影响的报表和页面。</li></ul></div>',null,'',false,true)}
$('import').onclick=importDefault;$('add').onclick=()=>form();$('help').onclick=help;$('close').onclick=close;$('mask').onclick=e=>{if(e.target===$('mask'))close()};$('reset').onclick=()=>open('重置演示数据','<p>将恢复初始 10 条示例配置及人民币币种，清除本机的原型修改。</p>',()=>{state=seed();page=1;persist();close();render();toast('已恢复示例数据')},'重置');
document.addEventListener('keydown',e=>{if($('mask').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...$('modal').querySelectorAll('button,input,select')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
})();
</script>
</body></html>
