<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>游戏特性配置 - 原型</title>
<style>
:root{--blue:#1677ff;--line:#e7e7e7;--muted:#666;--bg:#f5f7fa;--head:#fafafa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Arial,"Microsoft YaHei",sans-serif;color:#222}
.page{min-height:100vh;background:#fff}.toolbar{height:58px;border-bottom:1px solid #ddd;background:#fff;display:flex;align-items:center;padding:0 18px;gap:22px;position:sticky;top:0;z-index:5}.toolbar .tab{height:58px;display:flex;align-items:center;color:#222;cursor:pointer}.toolbar .tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}.toolbar .actions{margin-left:auto;display:flex;gap:10px}.btn{border:1px solid #d9d9d9;background:#fff;border-radius:3px;height:32px;padding:0 15px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{color:#aaa;background:#f5f5f5;cursor:not-allowed}
.content{padding:12px 10px 45px;max-width:1240px;margin:auto}.section{border:1px solid #d9d9d9;margin-bottom:12px;background:#fff}.section-head{height:42px;background:#fafafa;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;font-size:15px}.section-head .sync{font-size:13px;color:var(--blue);margin-left:16px;cursor:pointer}.section-head .chevron{margin-left:auto;color:#666;cursor:pointer}.section-body{padding:17px 20px 23px}.section.collapsed .section-body{display:none}
.row{display:flex;align-items:center;min-height:42px;gap:12px;flex-wrap:wrap}.row label{min-width:128px;text-align:right;color:#333}.required:before{content:'*';color:#ff4d4f;margin-right:4px}.check{display:inline-flex;align-items:center;gap:6px;margin-right:22px;cursor:pointer}.check input{accent-color:var(--blue);width:15px;height:15px}.hint{font-size:12px;color:#888;margin-left:140px}.divider{height:1px;background:#eee;margin:17px 0}.feature-title{font-weight:600;color:#1f1f1f;margin-bottom:9px}.feature-card{border:1px solid #e6e6e6;border-radius:3px;padding:14px 16px;background:#fff;margin-top:8px}.feature-card .title{font-weight:600}.feature-card .desc{color:#777;font-size:12px;margin:6px 0 12px}.switch{position:relative;display:inline-block;width:42px;height:22px;vertical-align:middle}.switch input{display:none}.slider{position:absolute;inset:0;background:#bfbfbf;border-radius:12px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px #999}.switch input:checked+.slider{background:var(--blue)}.switch input:checked+.slider:before{transform:translateX(20px)}.badge{font-size:12px;border-radius:10px;padding:2px 8px;margin-left:8px}.badge.off{background:#f0f0f0;color:#777}.badge.on{background:#e6f4ff;color:#1677ff}.note{background:#f5faff;border:1px solid #b7d9ff;color:#4b6380;padding:10px 12px;border-radius:3px;font-size:12px;margin-top:10px}.json{display:none}.json pre{background:#1f2430;color:#d7e4ff;padding:18px;border-radius:3px;overflow:auto;min-height:380px;margin:0;font:13px/1.6 Consolas,monospace}.small{font-size:12px;color:#888}.toast{position:fixed;right:24px;top:72px;background:#222;color:#fff;padding:10px 16px;border-radius:3px;display:none;z-index:9}.toast.show{display:block}
.scene-option{display:inline-flex;align-items:center;gap:6px;margin-right:24px;white-space:nowrap}.scene-option .check{margin-right:0}.feature-help{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border:1px solid #a4a4a4;border-radius:50%;color:#888;background:#fff;font-size:11px;line-height:1;cursor:help}.feature-help:focus,.feature-help:hover{border-color:var(--blue);color:var(--blue);outline:0}.feature-help span{display:none;position:absolute;z-index:10;left:-10px;top:22px;width:300px;padding:9px 11px;border:1px solid #ddd;border-radius:2px;box-shadow:0 3px 8px #0002;background:#fff;color:#555;text-align:left;white-space:normal;font-size:12px;line-height:1.6;font-weight:400}.feature-help:focus span,.feature-help:hover span{display:block}.scene-config-note{margin:0 0 12px 140px;color:#888;font-size:12px}.slot-config{margin:12px 0 0 140px;max-width:860px;border:1px solid #e8e8e8}.slot-config.disabled{opacity:.62}.slot-config-head{display:grid;grid-template-columns:125px 130px minmax(190px,1fr);background:#fafafa;border-bottom:1px solid #e8e8e8;color:#555}.slot-config-head span,.slot-config-row>*{padding:9px 12px}.slot-config-row{display:grid;grid-template-columns:125px 130px minmax(190px,1fr);align-items:center;min-height:48px;border-bottom:1px solid #f0f0f0}.slot-config-row:last-child{border-bottom:0}.slot-config-row .check{margin:0;min-width:0;text-align:left}.slot-config-row .slot-name{width:min(360px,100%);height:30px;padding:4px 9px;border:1px solid #d9d9d9;border-radius:2px;background:#fff;font:inherit}.slot-config-row .slot-name:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 2px #1677ff25}.slot-config-row .slot-name:disabled{background:#f5f5f5}.slot-config-row .slot-name.invalid{border-color:#ff4d4f}.slot-config-foot{margin:9px 0 0 140px;color:#888;font-size:12px}.scene-error{display:none;margin:8px 0 0 140px;color:#cf1322;font-size:12px}.scene-error.show{display:block}
@media(max-width:760px){.row label{min-width:95px;text-align:left}.hint{margin-left:0}.content{padding:8px}.toolbar{gap:10px;padding:0 10px}.toolbar .actions{gap:5px}.btn{padding:0 8px}}
@media(max-width:760px){.scene-config-note,.slot-config,.slot-config-foot,.scene-error{margin-left:0}.slot-config-head,.slot-config-row{grid-template-columns:85px 85px minmax(140px,1fr)}.slot-config-head span,.slot-config-row>*{padding:8px}.scene-option{margin:4px 12px 4px 0}}
</style>
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div class="tab active" data-tab="visual">可视化编辑</div><div class="tab" data-tab="json">JSON 编辑</div><div class="tab" data-tab="init">初始化编辑</div>
    <div class="actions"><button class="btn primary" id="initBtn">▣ 初始化配置</button><button class="btn primary" id="syncBtn">▣ 同步配置</button><button class="btn" id="saveBtn" disabled>▣ 保存</button></div>
  </div>
  <main class="content">
    <div class="section" data-section="internal"><div class="section-head">内部号管理 <span class="sync">▣ 同步配置</span><span class="chevron">⌃</span></div><div class="section-body">
      <div class="row"><label class="required">账号类型</label><label class="check"><input type="checkbox" checked> 冰川账号</label><label class="check"><input type="checkbox"> 游戏账号</label><label class="check"><input type="checkbox" disabled checked> 角色ID</label></div>
      <div class="row"><label>启用设备白名单</label><label class="check"><input type="checkbox" checked> 冰川账号</label><label class="check"><input type="checkbox"> 游戏账号</label><label class="check"><input type="checkbox"> 角色ID</label></div>
    </div></div>

    <div class="section" data-section="announce"><div class="section-head">公告 <span class="sync">▣ 同步配置</span><span class="chevron">⌃</span></div><div class="section-body">
      <div class="row"><label>公告位置</label><label class="check"><input type="checkbox"> Banner公告(-1)</label><label class="check"><input type="checkbox" checked disabled> 登录公告(1)</label><label class="check"><input type="checkbox"> 游戏内公告(2)</label><label class="check"><input type="checkbox"> 游戏内社区公告(3)</label><label class="check"><input type="checkbox"> 通用公告(4)</label><label class="check"><input type="checkbox"> 攻略(5)</label><a class="sync">[新增位置]</a></div>
      <div class="row"><label class="required">公告标题</label><input class="input" value="10" style="width:90px;height:30px;border:1px solid #d9d9d9;padding:4px 8px"></div><div class="row"><label class="required">公告文本内容</label><input class="input" value="4500" style="width:90px;height:30px;border:1px solid #d9d9d9;padding:4px 8px"></div>
      <div class="row"><label class="required">公告内容特殊符号</label><label class="check"><input type="radio" name="symbol" checked> 不支持</label><label class="check"><input type="radio" name="symbol"> 支持</label></div>
      <div class="row"><label>投放条件(无限制)</label><label class="check"><input type="checkbox"> 主线推关 ◉</label><label class="check"><input type="checkbox"> IP编码</label><label class="check"><input type="checkbox"> 创建时间</label></div><div class="row"><label>投放条件(有限制)</label><label class="check"><input type="checkbox"> VIP经验 [0，99999999] ✎</label></div>
    </div></div>

    <div class="section" data-section="dialog"><div class="section-head">弹窗管理 <span class="sync">▣ 同步配置</span><span class="chevron">⌃</span></div><div class="section-body">
      <div class="row"><label>使用场景</label><span class="scene-option"><label class="check"><input id="dialogScene1" type="checkbox" value="1"> 不分区内容弹窗(1)</label><button type="button" class="feature-help" aria-label="不分区内容弹窗使用说明">?<span>无需选择素材位，内容作为一组提供给游戏。推荐用于拍脸图、弹屏、普通活动弹窗等；具体展示方式由游戏决定。</span></button></span><span class="scene-option"><label class="check"><input id="dialogScene2" type="checkbox" value="2"> 分区内容弹窗(2)</label><button type="button" class="feature-help" aria-label="分区内容弹窗使用说明">?<span>按素材位分别配置内容，同一素材位可有多条弹窗记录。推荐用于多 Tab 弹窗、多内容区域等；具体展示方式由游戏决定。</span></button></span></div>
      <div class="scene-config-note">勾选后，该游戏的弹窗管理新增页才会提供对应使用场景。场景 ID 固定，仅用于区分后台配置方式。</div>
      <div class="row"><label>素材位配置</label><span class="small" id="slotConfigState">先勾选“分区内容弹窗”后配置</span></div>
      <div class="slot-config disabled" id="slotConfig"><div class="slot-config-head"><span>素材位 ID</span><span>启用</span><span>该游戏显示名称</span></div>
        <div class="slot-config-row"><strong>1</strong><label class="check"><input type="checkbox" class="slot-enable" value="1"> 启用</label><input class="slot-name" aria-label="素材位 1 名称" placeholder="请输入名称" maxlength="20" disabled></div>
        <div class="slot-config-row"><strong>2</strong><label class="check"><input type="checkbox" class="slot-enable" value="2"> 启用</label><input class="slot-name" aria-label="素材位 2 名称" placeholder="请输入名称" maxlength="20" disabled></div>
        <div class="slot-config-row"><strong>3</strong><label class="check"><input type="checkbox" class="slot-enable" value="3"> 启用</label><input class="slot-name" aria-label="素材位 3 名称" placeholder="请输入名称" maxlength="20" disabled></div>
        <div class="slot-config-row"><strong>4</strong><label class="check"><input type="checkbox" class="slot-enable" value="4"> 启用</label><input class="slot-name" aria-label="素材位 4 名称" placeholder="请输入名称" maxlength="20" disabled></div>
      </div>
      <div class="slot-config-foot">素材位 ID 1～4 固定；名称按游戏分别配置。运营在弹窗管理中只看到已启用的素材位名称。</div>
      <div class="scene-error" id="dialogSceneError" role="alert"></div>
    </div></div>

    <div class="section" data-section="mail"><div class="section-head">邮件 <span class="sync">▣ 同步配置</span><span class="chevron">⌃</span></div><div class="section-body"><div class="row"><label>邮件类型</label><label class="check"><input type="checkbox" checked> 普通邮件(0)</label><label class="check"><input type="checkbox" checked> 历史邮件(1)</label><label class="check"><input type="checkbox" checked> 内部邮件(2)</label><label class="check"><input type="checkbox" checked> 福利邮件(11)</label><label class="check"><input type="checkbox" checked> 活动邮件(12)</label><label class="check"><input type="checkbox" checked> 通知邮件(13)</label><label class="check"><input type="checkbox" checked> 补偿邮件(14)</label><label class="check"><input type="checkbox" checked> 测试邮件(15)</label></div><div class="row"><label></label><label class="check"><input type="checkbox" checked> GS福利(16)</label><label class="check"><input type="checkbox"> QQ群福利(17)</label><a class="sync">[新增类型]</a></div><div class="small" style="margin-left:140px">value 小于 10 为系统默认，邮件新增将不会显示</div><div class="row"><label class="required">邮件标题</label><input value="30" style="width:90px;height:30px;border:1px solid #d9d9d9;padding:4px 8px"></div><div class="row"><label class="required">邮件内容</label><input value="3000" style="width:90px;height:30px;border:1px solid #d9d9d9;padding:4px 8px"></div><div class="row"><label class="required">邮件文本格式</label><label class="check"><input type="radio" name="format"> HTML</label><label class="check"><input type="radio" name="format"> 自嗨引擎</label><label class="check"><input type="radio" name="format" checked> 纯文本</label></div><div class="row"><label class="required">邮件内容特殊符号</label><label class="check"><input type="radio" name="mail-symbol" checked> 不支持</label><label class="check"><input type="radio" name="mail-symbol"> 支持</label></div></div></div>

  </main>
</div><div class="toast" id="toast"></div>
<script>
const toast=(msg)=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
const dialogStorageKey='game-feature-dialog-config:2132:2132-LOCAL-DEV';
const dialogScene1=document.getElementById('dialogScene1');
const dialogScene2=document.getElementById('dialogScene2');
const slotRows=[...document.querySelectorAll('.slot-config-row')];
const dialogError=document.getElementById('dialogSceneError');
const getDialogConfig=()=>({sceneIds:[dialogScene1,dialogScene2].filter(x=>x.checked).map(x=>Number(x.value)),slots:dialogScene2.checked?slotRows.filter(row=>row.querySelector('.slot-enable').checked).map(row=>({id:Number(row.querySelector('.slot-enable').value),name:row.querySelector('.slot-name').value.trim()})):[]});
const renderDialogConfig=()=>{document.getElementById('slotConfig').classList.toggle('disabled',!dialogScene2.checked);document.getElementById('slotConfigState').textContent=dialogScene2.checked?'勾选素材位并填写该游戏显示名称':'先勾选“分区内容弹窗”后配置';slotRows.forEach(row=>{const enabled=row.querySelector('.slot-enable');const name=row.querySelector('.slot-name');enabled.disabled=!dialogScene2.checked;name.disabled=!dialogScene2.checked||!enabled.checked;name.classList.remove('invalid')});dialogError.classList.remove('show')};
try{const saved=JSON.parse(localStorage.getItem(dialogStorageKey)||'null');if(saved){dialogScene1.checked=saved.sceneIds?.includes(1)||false;dialogScene2.checked=saved.sceneIds?.includes(2)||false;slotRows.forEach(row=>{const slot=saved.slots?.find(item=>item.id===Number(row.querySelector('.slot-enable').value));row.querySelector('.slot-enable').checked=!!slot;row.querySelector('.slot-name').value=slot?.name||''})}}catch(error){}
renderDialogConfig();
document.querySelectorAll('[data-section="dialog"] input').forEach(input=>input.addEventListener('input',()=>{renderDialogConfig();document.getElementById('saveBtn').disabled=false}));
function showDialogError(message){dialogError.textContent=message;dialogError.classList.add('show');document.querySelector('[data-section="dialog"]').classList.remove('collapsed');dialogError.scrollIntoView({block:'nearest'})}
document.querySelectorAll('.section-head').forEach(h=>h.addEventListener('click',e=>{if(e.target.classList.contains('sync'))return;h.parentElement.classList.toggle('collapsed');h.querySelector('.chevron').textContent=h.parentElement.classList.contains('collapsed')?'⌄':'⌃'}));
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');const isJson=tab.dataset.tab==='json';document.querySelector('main').style.display=isJson?'none':'block';let box=document.querySelector('.json');if(!box){box=document.createElement('div');box.className='json content';box.innerHTML='<pre></pre>';document.querySelector('.page').appendChild(box)}box.querySelector('pre').textContent=JSON.stringify({gameId:2132,gameVersionId:'2132-LOCAL-DEV',dialogManagement:getDialogConfig()},null,2);box.style.display=isJson?'block':'none'}));
document.getElementById('saveBtn').addEventListener('click',()=>{const config=getDialogConfig();if(dialogScene2.checked&&!config.slots.length){showDialogError('启用分区内容弹窗时，请至少启用一个素材位。');return}const missing=slotRows.find(row=>dialogScene2.checked&&row.querySelector('.slot-enable').checked&&!row.querySelector('.slot-name').value.trim());if(missing){missing.querySelector('.slot-name').classList.add('invalid');showDialogError('请填写已启用素材位的名称。');return}try{localStorage.setItem(dialogStorageKey,JSON.stringify(config))}catch(error){}document.getElementById('saveBtn').disabled=true;toast('配置已保存到本地原型')});document.getElementById('syncBtn').addEventListener('click',()=>toast('同步配置仅作本地演示'));document.getElementById('initBtn').addEventListener('click',()=>toast('初始化配置仅作本地演示'));
</script></body></html>
