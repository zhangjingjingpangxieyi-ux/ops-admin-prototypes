    function parseSocialGroupIds(value) {
      return [...new Set(String(value || '').split(/[\s,，;；]+/).map((id) => id.trim()).filter(Boolean))];
    }

    function renderSocialGroupValidationRows(groups, invalidIds) {
      const usedRoleIds = new Set();
      const rows = [];
      groups.forEach((group) => {
        const allowed = socialGroupAllowedServers.has(group.serverId);
        const members = group.members || [];
        if (!allowed) {
          rows.push('<tr><td>' + group.id + '</td><td>' + escapeHtml(group.name) + '</td><td>' + socialGroupMemberCount(group) + '</td><td>-</td><td>-</td><td>' + group.serverName + '(' + group.serverId + ')</td><td><span class="social-group-status-blocked">区服不匹配</span></td><td><button type="button" class="ant-btn ant-btn-link social-group-remove-row" data-group-id="' + group.id + '">移除</button></td></tr>');
          return;
        }
        if (!members.length) {
          rows.push('<tr><td>' + group.id + '</td><td>' + escapeHtml(group.name) + '</td><td>0</td><td>-</td><td>-</td><td>' + group.serverName + '(' + group.serverId + ')</td><td><span class="social-group-status-blocked">无有效成员</span></td><td><button type="button" class="ant-btn ant-btn-link social-group-remove-row" data-group-id="' + group.id + '">移除</button></td></tr>');
          return;
        }
        members.forEach((member) => {
          const duplicated = usedRoleIds.has(member.roleId);
          if (!duplicated) usedRoleIds.add(member.roleId);
          rows.push('<tr><td>' + group.id + '</td><td>' + escapeHtml(group.name) + '</td><td>' + socialGroupMemberCount(group) + '</td><td>' + member.roleId + '</td><td>' + escapeHtml(member.roleName) + '</td><td>' + group.serverName + '(' + group.serverId + ')</td><td>' + (duplicated ? '<span class="social-group-status-blocked">重复，已去重</span>' : '<span class="social-group-status-ok">成功</span>') + '</td><td>' + (duplicated ? '<button type="button" class="ant-btn ant-btn-link social-group-remove-row" data-group-id="' + group.id + '">移除</button>' : '-') + '</td></tr>');
        });
      });
      invalidIds.forEach((id) => {
        rows.push('<tr><td>' + escapeHtml(id) + '</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td><span class="social-group-status-blocked">组织不存在</span></td><td><button type="button" class="ant-btn ant-btn-link social-group-remove-row" data-group-id="' + escapeHtml(id) + '">移除</button></td></tr>');
      });
      return rows.join('') || '<tr><td colspan="8">暂无校验数据</td></tr>';
    }

    function setSocialGroupValidationState(panel, hasError, message) {
      const input = panel?.querySelector('.social-group-id-input');
      const error = panel?.querySelector('.social-recipient-error');
      if (input) input.classList.toggle('social-group-input-error', Boolean(hasError));
      if (error) {
        error.textContent = message || '';
        error.classList.toggle('active', Boolean(hasError && message));
      }
    }

    function socialGroupFailureCount(groups, invalidIds, ids) {
      if (!ids.length) return 1;
      return invalidIds.length + groups.filter((group) => !socialGroupAllowedServers.has(group.serverId) || socialGroupMemberCount(group) === 0).length;
    }

    function validateSocialGroupRecipients(view) {
      const panel = view.querySelector('.social-recipient-panel');
      if (!panel) return;
      const input = panel.querySelector('.social-group-id-input');
      const ids = parseSocialGroupIds(input?.value);
      const groups = ids.map((id) => socialGroupDirectory.find((group) => group.id === id)).filter(Boolean);
      const validIds = new Set(groups.map((group) => group.id));
      const invalidIds = ids.filter((id) => !validIds.has(id));
      const sendableGroups = groups.filter((group) => socialGroupAllowedServers.has(group.serverId) && socialGroupMemberCount(group) > 0);
      setSocialGroupSelection(view, sendableGroups);
      const tbody = panel.querySelector('.social-group-validation-table tbody');
      if (tbody) tbody.innerHTML = renderSocialGroupValidationRows(groups, invalidIds);
      const total = [...new Set(sendableGroups.flatMap((group) => (group.members || []).map((member) => member.roleId)))].length;
      const failCount = socialGroupFailureCount(groups, invalidIds, ids);
      const successResult = panel.querySelector('[data-social-group-success-count]');
      const failResult = panel.querySelector('[data-social-group-fail-count]');
      if (successResult) successResult.textContent = total;
      if (failResult) failResult.textContent = failCount;
      const hasError = failCount > 0;
      const errorMessage = !ids.length ? '请输入组织ID' : '组织校验失败，请重新输入';
      setSocialGroupValidationState(panel, hasError, hasError ? errorMessage : '');
      if (!ids.length) showToast('请输入组织ID');
      else if (!total) showToast('未检测到可发送角色');
      else showToast('校验完成，成功角色数：' + total + '，失败数：' + failCount);
    }
    function syncSocialGroupPanel(view) {
      const panel = view.querySelector('.social-recipient-panel');
      if (!panel) return;
      const groups = getSocialGroupSelection(view);
      const totalMembers = [...new Set(groups.flatMap((group) => (group.members || []).map((member) => member.roleId)))].length;
      const summary = panel.querySelector('[data-social-group-summary]');
      const payload = panel.querySelector('input[name="socialGroupRecipientPayload"]');
      if (summary) summary.innerHTML = '<span class="social-group-count-chip">组织数量：' + groups.length + '</span><span class="social-group-count-chip">预计覆盖角色数：' + totalMembers + '</span><span>发送时重新解析组织成员，重复角色按角色ID去重</span>';
      if (payload) payload.value = JSON.stringify(socialGroupPayload(groups));
    }

    function normalizeHeaderText(value) {
      return (value || '').replace(/\s+/g, '').replace('•', '');
    }

    function reorderTableCellsByIndexes(row, order) {
      const cells = [...row.children];
      if (cells.length < order.length) return;
      const orderSet = new Set(order);
      const fragment = document.createDocumentFragment();
      order.forEach((index) => {
        if (cells[index]) fragment.appendChild(cells[index]);
      });
      cells.forEach((cell, index) => {
        if (!orderSet.has(index)) fragment.appendChild(cell);
      });
      row.appendChild(fragment);
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

      tableRoots.forEach((tableRoot) => {
        const tables = [...tableRoot.querySelectorAll('table')];
        const headerTable = tables.find((table) => table.querySelector('thead th'));
        const bodyTable = tables.find((table) => table.querySelector('tbody tr'));
        if (!headerTable || !bodyTable) return;
        const headers = [...headerTable.querySelectorAll('thead th')].map((cell) => normalizeHeaderText(cell.innerText || cell.textContent));
        const titleIndex = headers.findIndex((header) => header === '标题');
        if (titleIndex < 0) return;
        const dataRows = [...bodyTable.querySelectorAll('tbody tr')].filter((row) => {
          const cell = row.children[titleIndex];
          return cell && textOf(cell);
        });
        dataRows.forEach((row, rowIndex) => {
          const cell = row.children[titleIndex];
          if (!cell || cell.dataset.mailTitleTags) return;
          const rawText = (cell.innerText || cell.textContent || '').replace(/\s+/g, ' ').trim();
          if (!rawText) return;
          const rowText = (row.innerText || row.textContent || '').replace(/\s+/g, ' ').trim();
          const isRisk = rawText.includes('[高风险]') || rowText.includes('高风险');
          const isBatch = rawText.includes('批量邮件') || rowText.includes('批量邮件') || rowIndex === 2 || rowIndex === 3;
          const isRequired = rawText.includes('[必读]') || rowText.includes('必读邮件') || rowIndex === 0 || rowIndex === 3 || rowIndex === 4;
          const cleanTitle = rawText.replace(/\[高风险\]/g, '').replace(/\[必读\]/g, '').replace(/批量邮件/g, '').trim() || rawText;

    function enhanceEmailListColumns(view) {
      if (!view || view.dataset.emailColumnsEnhanced) return;
      let enhanced = false;
      const tableRoots = [...view.querySelectorAll('.ant-table')];
      tableRoots.forEach((tableRoot) => {
        const tables = [...tableRoot.querySelectorAll('table')];
        const headerTable = tables.find((table) => table.querySelector('thead th'));
        if (!headerTable) return;
        const headerCells = [...headerTable.querySelectorAll('thead th')];
        let headers = headerCells.map((cell) => normalizeHeaderText(cell.innerText || cell.textContent));
        if (headers.length > 1 && !headers[headers.length - 1]) headers = headers.slice(0, -1);
        if (!headers.length) return;
        const actionOriginalIndex = headers.findIndex((header) => header.includes('操作'));
        if (actionOriginalIndex < 0) return;
        const targetNames = ['审核信息', '撤回信息', '提交信息', '操作'];
        const targetIndexes = targetNames.map((name) => headers.findIndex((header) => header.includes(name))).filter((index) => index >= 0);
        const createRoleIndex = headers.findIndex((header) => header.includes('创角时间'));
        let order = headers.map((_, index) => index);
        if (targetIndexes.length && createRoleIndex >= 0) {
          const targetSet = new Set(targetIndexes);
          order = [];
          headers.forEach((_, index) => {
            if (targetSet.has(index)) return;
            order.push(index);
            if (index === createRoleIndex) targetIndexes.forEach((targetIndex) => order.push(targetIndex));
          });
          if (order.length !== headers.length) return;
        }
        const actionIndex = order.indexOf(actionOriginalIndex);
        if (actionIndex < 0) return;

        tableRoot.classList.add('email-table-column-cleanup');
        tables.forEach((table) => {
          table.querySelectorAll('tr').forEach((row) => reorderTableCellsByIndexes(row, order));
          table.querySelectorAll('colgroup').forEach((colgroup) => reorderTableCellsByIndexes(colgroup, order));
          table.querySelectorAll('tr').forEach((row) => {
            const cell = row.children[actionIndex];
            if (!cell) return;
            cell.classList.add('email-action-fixed-right');
            cell.classList.remove('ant-table-cell-fix-left', 'ant-table-cell-fix-left-last', 'ant-table-cell-fix-right', 'ant-table-cell-fix-right-first');
          });
        });
        enhanced = true;
      });
      if (enhanced) view.dataset.emailColumnsEnhanced = 'true';
    }

                '<button class="mail-page-button active" type="button">1</button>',
                '<button class="mail-page-button" type="button" aria-label="下一页">›</button>',
                '<select class="mail-page-size"><option>10 条/页</option><option>20 条/页</option><option>50 条/页</option></select>',
              '</div>',
            '</section>',
          '</section>',
        '</main>'
      ].join('');

      view.addEventListener('click', (event) => {
        const tab = event.target.closest('[data-mail-tab]');
        if (tab) activateMailOverviewTab(view, tab.dataset.mailTab);
        if (event.target.closest('[data-go-server]')) activateMailOverviewTab(view, 'server');
        if (event.target.closest('[data-export-recipient]')) showToast('已按当前筛选条件导出收件人详情');
      });
      const abnormalToggle = view.querySelector('[data-only-abnormal]');
      if (abnormalToggle) abnormalToggle.addEventListener('change', () => {
        view.querySelectorAll('[data-server-success]').forEach((row) => { row.hidden = abnormalToggle.checked; });
      });
    }

    function enhanceChannelGroupFeature() {
      const view = activeViewNode();
      if (!view) return;
      const name = view.dataset.view;
      if (name === 'list') {
        enhanceMailSearchFilters(view);
        enhanceEmailListColumns(view);
        enhanceMailTitleTags(view);
        enhanceEmailStatusSummary(view);
        enhanceMailTableTools(view);
        enhanceSocialGroupListSummary(view);
      }
      if (name === 'audit') {
        enhanceMailSearchFilters(view);
        enhanceEmailListColumns(view);
        enhanceMailTableTools(view);
        enhanceSocialGroupListSummary(view);
      }
      if (name === 'create') { enhanceCreateChannelGroup(view, false); enhanceSocialGroupRecipient(view); }
      if (name === 'copy') { enhanceCreateChannelGroup(view, true); enhanceSocialGroupRecipient(view); }
      if (name === 'batch') enhanceBatchChannelGroup(view);
      if (name === 'detail') {
        renderMailOverviewPrototype(view);
        enhanceSocialGroupOverview(view);
      }
    }
    function activeViewName(name) {
      return snapshots[name] ? name : "list";
    }

    function renderAll() {
      viewNodes.forEach((node) => {
        const snapshot = snapshots[node.dataset.view];
        node.innerHTML = snapshot ? snapshot.html : "";
      });
    }

    function show(view) {
      const active = activeViewName(view);
      viewNodes.forEach((node) => {
        node.hidden = node.dataset.view !== active;
      });
      document.title = snapshots[active].label + " - 邮件模块真实业务区";
      if (location.hash !== "#" + active) history.replaceState(null, "", "#" + active);
      closeDropdown();
      closeModal();
      initActiveView();
      window.scrollTo(0, 0);
    }

    function textOf(node) {
      return (node && (node.innerText || node.textContent) || "").replace(/\s+/g, "").trim();
    }

    function findRoute(target) {
      const routeTarget = target.closest("[data-local-route]");
      if (routeTarget) return routeTarget.dataset.localRoute;

      const hrefTarget = target.closest("a[href]");
      if (hrefTarget) {
        const href = hrefTarget.getAttribute("href") || "";
        if (href.includes("#batch") || href.includes("/game/email/batch-create")) return "batch";
        if (href.includes("#copy") || href.includes("/game/email/copy")) return "copy";
        if (href.includes("#create") || href.includes("/game/email/create")) return "create";
        if (href.includes("#detail") || href.includes("/game/email/detail")) return "detail";
        if (href.includes("#list") || href.includes("/game/email/list")) return "list";
      }

      const tab = target.closest(".ant-tabs-tab, .ant-tabs-tab-btn, [role='tab'], [id^='rc-tabs-'][id*='-tab-']");
      if (tab) {
        const id = tab.id || "";
        const controls = tab.getAttribute("aria-controls") || "";
        const text = textOf(tab);
        if (id.includes("tab-audit") || controls.includes("panel-audit") || text === "邮件审核") return "audit";
        if (id.includes("tab-record") || controls.includes("panel-record") || text === "邮件记录") return "list";
      }

      const action = target.closest("button, .ant-btn, [role='button']");
      if (action) {
        const text = textOf(action);
        if (text === "展开" || text === "收起") return "toggle-filter";
        if (text === "复制") return "copy";
        if (text === "批量新建") return "batch-create";
        if (text.includes("新建") && !text.includes("批量")) return "create";
        if (text === "详情") return "detail-modal";
        if (text === "邮件发送数据" || /^\d+\/\d+(\/\d+)?$/.test(text)) return "detail";
      }

      return "";
    }

    function activeViewNode() {
      return document.querySelector(".email-view:not([hidden])");
    }

    function toggleFilters(button) {
      const view = activeViewNode();
      if (!view) return;
      const expanded = !view.classList.contains("filter-expanded");
      view.classList.toggle("filter-expanded", expanded);
      const label = button.querySelector("span") || button;
      label.textContent = expanded ? "收 起" : "展 开";
    }

    function closeDropdown() {
      document.querySelectorAll(".snapshot-dropdown").forEach((node) => node.remove());
      document.querySelectorAll(".ant-select-open").forEach((node) => node.classList.remove("ant-select-open"));
    }

    function openSelectDropdown(selectNode) {
      const input = selectNode.querySelector("input[id]");
      const id = input && input.id;
      const options = selectOptions[id];
      if (!options) return false;
      closeDropdown();
      selectNode.classList.add("ant-select-open");
      const rect = selectNode.getBoundingClientRect();
      const dropdown = document.createElement("div");
      dropdown.className = "snapshot-dropdown ant-select-dropdown ant-select-dropdown-placement-bottomLeft";
      dropdown.style.left = rect.left + "px";
      dropdown.style.top = rect.bottom + 4 + "px";
      dropdown.style.width = Math.max(rect.width, 160) + "px";
      const current = selectNode.querySelector(".ant-select-selection-item")?.textContent?.trim();
      dropdown.innerHTML = options.map((option) => '<div class="snapshot-dropdown-option ant-select-item ant-select-item-option ' + (option === current ? 'active' : '') + '" data-value="' + option + '"><div class="ant-select-item-option-content">' + option + '</div></div>').join("");
      dropdown.addEventListener("click", (event) => {
        const option = event.target.closest(".snapshot-dropdown-option");
        if (!option) return;
        const value = option.dataset.value || "";
        const item = selectNode.querySelector(".ant-select-selection-item");
        if (item) {
          item.textContent = value;
          item.setAttribute("title", value);
        }
        closeDropdown();
      });
      document.body.appendChild(dropdown);
      return true;
    }

    function rowDataFromAction(action) {
      const row = action.closest("tr");
      if (!row) return [];
      const headers = [...row.closest("table")?.querySelectorAll("thead th") || []]
        .map((cell) => textOf(cell).replace("•", ""));
      return [...row.children].map((cell, index) => ({
        label: headers[index] || "字段" + (index + 1),
        value: textOf(cell).replace(/^(详情|复制|撤回|重试)+$/, "") || "-"
      })).filter((item) => item.label && item.value);
    }

    function ensureModal() {
      let modal = document.querySelector(".snapshot-modal-root");
      if (modal) return modal;
      modal = document.createElement("div");
      modal.className = "snapshot-modal-root";
      modal.hidden = true;
      modal.innerHTML = '<div class="snapshot-modal-mask"></div><div class="snapshot-modal-wrap" role="dialog" aria-modal="true"><div class="snapshot-modal ant-modal"><div class="ant-modal-content"><button type="button" class="ant-modal-close"><span class="ant-modal-close-x">×</span></button><div class="ant-modal-header"><div class="ant-modal-title">邮件详情</div></div><div class="ant-modal-body"></div><div class="ant-modal-footer"><button type="button" class="ant-btn ant-btn-primary snapshot-modal-ok"><span>确 定</span></button></div></div></div></div>';
      modal.addEventListener("click", (event) => {
        if (event.target.classList.contains("snapshot-modal-mask") || event.target.closest(".ant-modal-close, .snapshot-modal-ok")) {
          closeModal();
        }
      });
      document.body.appendChild(modal);
      return modal;
    }

    function openDetailModal(action) {
      if (detailDialogHtml) {
        const host = document.createElement("div");
        host.className = "snapshot-real-dialog-host";
        host.innerHTML = detailDialogHtml;
        host.addEventListener("click", (event) => {
          if (event.target.classList.contains("ant-drawer-mask") || event.target.closest(".ant-drawer-close")) {
            host.remove();
          }
        });
        document.body.appendChild(host);
        enhanceChannelGroupDetail(host);
        enhanceSocialGroupDetail(host);
        decorateDetailDialogTitle(host);
        return;
      }
      const data = rowDataFromAction(action).filter((item) => !["", "操作"].includes(item.label));
      const modal = ensureModal();
      const body = modal.querySelector(".ant-modal-body");
      const rows = data.length ? data : [{ label: "提示", value: "当前快照中没有可展开的详情数据" }];
      body.innerHTML = '<div class="ant-descriptions ant-descriptions-bordered"><div class="ant-descriptions-view"><table><tbody>' + rows.map((item) => '<tr class="ant-descriptions-row"><th class="ant-descriptions-item-label" style="width: 180px;">' + item.label + '</th><td class="ant-descriptions-item-content">' + item.value + '</td></tr>').join("") + '</tbody></table></div></div>';
      modal.hidden = false;
    }

    function closeModal() {
      document.querySelectorAll(".snapshot-real-dialog-host").forEach((node) => node.remove());
      const modal = document.querySelector(".snapshot-modal-root");
      if (modal) modal.hidden = true;
    }

    function showToast(message) {
      document.querySelectorAll(".snapshot-toast").forEach((node) => node.remove());
      const toast = document.createElement("div");
      toast.className = "snapshot-toast";
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1600);
    }

    function normalizeTables() {
      const view = activeViewNode();
      if (!view) return;
      view.querySelectorAll(".ant-table").forEach((table) => {
        const header = table.querySelector(".ant-table-header");
        const body = table.querySelector(".ant-table-body");
        const container = table.querySelector(".ant-table-container");
        if (container) {
          container.style.overflowX = "auto";
          container.style.overflowY = "visible";
        }
        [header, body].forEach((node) => {
          if (!node) return;
          node.style.overflow = "visible";
          node.style.maxHeight = "none";
          node.scrollLeft = 0;
        });
      });
    }

    function stopSpinners() {
      const view = activeViewNode();
      if (!view) return;
      view.querySelectorAll(".ant-spin-spinning, .ant-spin-show-text").forEach((node) => {
        node.classList.remove("ant-spin-spinning", "ant-spin-show-text");
      });
    }

    function wireActiveControls() {
      const view = activeViewNode();
      if (!view) return;

      view.querySelectorAll(".ant-select").forEach((selectNode) => {
        if (selectNode.dataset.snapshotWired) return;
        selectNode.dataset.snapshotWired = "true";
        selectNode.addEventListener("click", (event) => {
          if (!openSelectDropdown(selectNode)) return;
          event.preventDefault();
          event.stopPropagation();
        });
      });

      view.querySelectorAll("button, .ant-btn, [role='button']").forEach((button) => {
        if (button.dataset.snapshotWired) return;
        const text = textOf(button);
        if (!["展开", "收起", "详情", "复制", "批量新建"].includes(text)) return;
        button.dataset.snapshotWired = "true";
        button.addEventListener("click", (event) => {
          const currentText = textOf(button);
          if (currentText === "展开" || currentText === "收起") {
            event.preventDefault();
            event.stopPropagation();
            toggleFilters(button);
          } else if (currentText === "详情") {
            event.preventDefault();
            event.stopPropagation();
            openDetailModal(button);
          } else if (currentText === "复制") {
            event.preventDefault();
            event.stopPropagation();
            show("copy");
          } else if (currentText === "批量新建") {
            event.preventDefault();
            event.stopPropagation();
            show("batch");
          }
        });
      });
    }

    function initActiveView() {
      normalizeTables();
      stopSpinners();
      wireActiveControls();
      enhanceChannelGroupFeature();
      setTimeout(() => {
        normalizeTables();
        stopSpinners();
        wireActiveControls();
        enhanceChannelGroupFeature();
      }, 0);
    }

    document.addEventListener("click", (event) => {
      const selectNode = event.target.closest(".email-view:not([hidden]) .ant-select");
      if (selectNode && openSelectDropdown(selectNode)) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        return;
      }

      const route = findRoute(event.target);
      if (!route) return;
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      if (route === "toggle-filter") {
        toggleFilters(event.target.closest("button, .ant-btn, [role='button']"));
        return;
      }
      if (route === "detail-modal") {
        openDetailModal(event.target.closest("button, .ant-btn, [role='button']"));
        return;
      }
      if (route === "copy") {
        show("copy");
        return;
      }
      if (route === "batch-create") {
        show("batch");
        return;
      }
      show(route);
    }, true);

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".snapshot-dropdown, .ant-select")) closeDropdown();
    });

    window.addEventListener("hashchange", () => show((location.hash || "#list").slice(1)));

    renderAll();
    show((location.hash || "#list").slice(1));
  </script>
</body>
</html>
